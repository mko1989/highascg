; WO-595 / WO-596 risk 1: RenderingDevice staging-buffer tuning for big per-frame texture uploads.
; Defaults upload in 64 px tiles through a 256 KB-block staging buffer. To test the tuned values:
;   cp override.tuned.cfg override.cfg   (Godot reads override.cfg next to project.godot)
; and compare the HUD "upload ms" against a run without override.cfg. Record both in WO-595.

[rendering]

rendering_device/staging_buffer/block_size_kb=2048
rendering_device/staging_buffer/max_size_mb=256
rendering_device/staging_buffer/texture_upload_region_size_px=1024
