<!DOCTYPE html>
<!-- lt-confetti-center.html — Confetti Center title (screen-centered, confetti burst on title reveal) -->
<html>
<head>
    <meta charset="utf-8">
    <title>Lower Third — Confetti Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent;
            display: flex;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
            height: 1080px; width: 1920px;
            overflow: hidden;
            position: relative;
        }
        /* margin:auto inside the flex body centers on both axes; applyStyles re-asserts it. */
        .lt-confetti-center {
            margin: auto;
            position: relative;
        }
        .graphic {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            max-width: 1700px;
            opacity: 0;
        }
        h1 {
            font-size: 76px;
            font-weight: 800;
            color: var(--text, #fff);
            letter-spacing: 0.01em;
            line-height: 1.1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 4px 18px rgba(0,0,0,0.55);
        }
        p {
            font-size: 30px;
            font-weight: 600;
            color: var(--primary, #ffc107);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 3px 12px rgba(0,0,0,0.5);
        }
        #confetti {
            position: absolute;
            left: 0; top: 0;
            width: 1920px; height: 1080px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <main class="lt-confetti-center">
        <div class="graphic">
            <h1>Name</h1>
            <p>Title</p>
        </div>
    </main>
    <canvas id="confetti" width="1920" height="1080"></canvas>
    <script src="vendor/gsap.min.js"></script>
    <script src="lt-engine.js"></script>
    <script src="lt-engine-controls.js"></script>
    <script>
        /*
         * Confetti burst — closed-form physics (linear drag + gravity) driven by a GSAP tween, so it
         * follows the engine's `speed` (globalTimeline timeScale) and the studio hold-in's instant
         * jump lands on the settled, confetti-free end frame.
         */
        var Confetti = (function () {
            var canvas = document.getElementById('confetti');
            var ctx = canvas.getContext('2d');
            var PALETTE = ['#ffd54f', '#ff4081', '#40c4ff', '#69f0ae', '#b388ff', '#ff6e40'];
            var COUNT = 180;
            var DRAG = 2.2;        // 1/s
            var GRAVITY = 700;     // px/s²  → terminal fall ≈ 320 px/s
            var LIFE_MAX = 4.4;    // s
            var particles = [];
            var tween = null;
            var clock = { t: 0 };

            function rand(a, b) { return a + Math.random() * (b - a); }

            function colors() {
                var cs = window.getComputedStyle(document.documentElement);
                var primary = cs.getPropertyValue('--primary').trim() || '#ffc107';
                var text = cs.getPropertyValue('--text').trim() || '#ffffff';
                return [primary, primary, text].concat(PALETTE);
            }

            function spawn(rect) {
                var cols = colors();
                particles = [];
                for (var i = 0; i < COUNT; i++) {
                    var angle = (-90 + rand(-70, 70)) * Math.PI / 180;
                    var speed = rand(650, 1500);
                    particles.push({
                        x0: rect.left + rand(0.1, 0.9) * rect.width,
                        y0: rect.top + rand(0.2, 0.6) * rect.height,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        w: rand(8, 16),
                        h: rand(4, 8),
                        round: Math.random() < 0.2,
                        color: cols[(Math.random() * cols.length) | 0],
                        rot0: rand(0, Math.PI * 2),
                        spin: rand(-8, 8),
                        flip: rand(4, 12),
                        swayAmp: rand(8, 28),
                        swayFreq: rand(3, 7),
                        phase: rand(0, Math.PI * 2),
                        life: rand(3.0, LIFE_MAX),
                    });
                }
            }

            function draw() {
                var t = clock.t;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                var decay = (1 - Math.exp(-DRAG * t)) / DRAG;
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    if (t >= p.life) continue;
                    var x = p.x0 + p.vx * decay + p.swayAmp * Math.sin(p.swayFreq * t + p.phase);
                    var y = p.y0 + p.vy * decay + (GRAVITY / DRAG) * (t - decay);
                    if (y > canvas.height + 40) continue;
                    var fade = Math.min(1, (p.life - t) / 0.8);
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, fade);
                    ctx.translate(x, y);
                    ctx.rotate(p.rot0 + p.spin * t);
                    ctx.scale(1, Math.cos(p.flip * t + p.phase));
                    ctx.fillStyle = p.color;
                    if (p.round) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.h, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    }
                    ctx.restore();
                }
            }

            function clear() {
                if (tween) { tween.kill(); tween = null; }
                particles = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.style.opacity = '';
            }

            function burst(originEl) {
                clear();
                spawn(originEl.getBoundingClientRect());
                clock.t = 0;
                tween = gsap.to(clock, {
                    t: LIFE_MAX,
                    duration: LIFE_MAX,
                    ease: 'none',
                    onUpdate: draw,
                    onComplete: clear,
                });
            }

            return { burst: burst, clear: clear, canvas: canvas };
        })();

        LTEngine.init({
            containerSel: '.lt-confetti-center',
            titleSel: '.graphic h1',
            subtitleSel: '.graphic p',
            applyStyles: function(style) {
                var root = document.documentElement;
                if (style.primaryColor) root.style.setProperty('--primary', style.primaryColor);
                if (style.textColor) root.style.setProperty('--text', style.textColor);
                // Always screen-centered: undo the engine's position / marginX / marginY anchoring.
                var container = document.querySelector('.lt-confetti-center');
                container.style.margin = 'auto';
                if (container.dataset.ltBoxScaled) container.style.transformOrigin = 'center center';
            },
            animateIn: function() {
                return new Promise(function(resolve) {
                    var g = document.querySelector('.lt-confetti-center .graphic');
                    var h1 = g.querySelector('h1');
                    var p = g.querySelector('p');
                    Confetti.clear();
                    var tl = new gsap.timeline({ onComplete: resolve });
                    tl.set(g, { opacity: 1, scale: 1, y: 0 })
                      .set([h1, p], { opacity: 0 })
                      .addLabel('reveal')
                      .fromTo(h1, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(2.2)' }, 'reveal')
                      .call(function () { Confetti.burst(h1); }, null, 'reveal+=0.12')
                      .fromTo(p, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 'reveal+=0.35');
                });
            },
            animateOut: function() {
                return new Promise(function(resolve) {
                    var g = document.querySelector('.lt-confetti-center .graphic');
                    var tl = new gsap.timeline({ defaults: { ease: 'power2.in' }, onComplete: function () {
                        Confetti.clear();
                        resolve();
                    } });
                    tl.to(g, { opacity: 0, scale: 0.94, duration: 0.5 })
                      .to(Confetti.canvas, { opacity: 0, duration: 0.5 }, '<')
                      .set(g, { scale: 1 });
                });
            }
        });
    </script>
</body>
</html>
