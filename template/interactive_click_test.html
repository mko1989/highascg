<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>CEF interactive click test</title>
	<style>
		* { box-sizing: border-box; margin: 0; }
		html, body { width: 100%; height: 100%; font: 48px/1.2 sans-serif; }
		body {
			display: flex; align-items: center; justify-content: center;
			background: #c0392b; color: #fff; text-align: center; cursor: pointer;
		}
	</style>
</head>
	<body tabindex="0">
	<div id="msg">CLICK ME — count: 0 (keys: 0)<br><small>Space / Enter also bump</small></div>
	<script>
		window.__clickCount = 0
		window.__keyCount = 0
		const msg = document.getElementById('msg')
		const colors = ['#c0392b', '#27ae60', '#2980b9', '#8e44ad', '#d35400']
		function bump() {
			window.__clickCount++
			document.body.style.background = colors[window.__clickCount % colors.length]
			msg.textContent = 'CLICK ME — count: ' + window.__clickCount + ' (keys: ' + window.__keyCount + ')'
		}
		document.body.addEventListener('click', bump)
		document.body.addEventListener('keydown', (e) => {
			if (e.key === ' ' || e.key === 'Enter') {
				window.__keyCount++
				bump()
			}
		})
	</script>
</body>
</html>
