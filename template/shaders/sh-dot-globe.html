<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Dot Globe — HighAsCG Shader FX</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }

<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-dot-globe","name":"Dot Globe","common":"","passes":{"image":{"source":"// Audio-Reactive Dot Matrix Sphere - SMOOTH MOVEMENT\n// IMPORTANT: Set iChannel0 to Microphone (Misc -> Microphone)\n\n// --- MATH & UTILS ---\nmat2 rot(float a) {\n    float s = sin(a), c = cos(a);\n    return mat2(c, -s, s, c);\n}\n\n// 3D Random Hash Function\nvec3 hash33(vec3 p3) {\n    p3 = fract(p3 * vec3(.1031, .1030, .0973));\n    p3 += dot(p3, p3.yxz+33.33);\n    return fract((p3.xxy + p3.yxx)*p3.zyx);\n}\n\n// Palette\nvec3 getPalette(float t) {\n    vec3 a = vec3(0.5, 0.5, 0.5);\n    vec3 b = vec3(0.5, 0.5, 0.5);\n    vec3 c = vec3(1.0, 1.0, 1.0);\n    vec3 d = vec3(0.263, 0.416, 0.557);\n    return a + b * cos(6.28318 * (c * t + d));\n}\n\nvoid mainImage( out vec4 fragColor, in vec2 fragCoord )\n{\n    // 1. Setup\n    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;\n    \n    // --- 2. AUDIO INPUT ---\n    \n    // A. SNAPPY AUDIO (For Dots)\n    // We grab the specific bass frequency for the dots\n    float rawVol = texture(iChannel0, vec2(0.05, 0.0)).x;\n    float threshold = 0.15;\n    float inputVal = max(0.0, rawVol - threshold) / (1.0 - threshold);\n    \n    // Exponential Curve (Snappy/Fast for dots)\n    float dotAudio = pow(inputVal, 2.0); \n    dotAudio *= 1.5; \n    dotAudio = clamp(dotAudio, 0.0, 1.0);\n\n    // B. SMOOTH AUDIO (For Size/Movement)\n    // [FIX 1] We average 3 bass frequencies to reduce \"jitter/flash\"\n    float smoothVol = texture(iChannel0, vec2(0.02, 0.0)).x + \n                      texture(iChannel0, vec2(0.05, 0.0)).x + \n                      texture(iChannel0, vec2(0.10, 0.0)).x;\n    smoothVol /= 3.0; // Average them\n    \n    // [FIX 2] Use linear response (no pow) so it expands gently\n    float radiusAudio = max(0.0, smoothVol - threshold) / (1.0 - threshold);\n    \n    // 3. Ray-Sphere Intersection\n    vec3 ro = vec3(0.0, 0.0, -2.2); \n    vec3 rd = normalize(vec3(uv, 1.0)); \n    \n    // [FIX 3] Smoother Expansion\n    // Reduced multiplier to 0.12 so it doesn't jump as aggressively\n    float radius = 0.55 + (radiusAudio * 0.12);\n    \n    float t = dot(ro, rd) * dot(ro, rd) - (dot(ro, ro) - radius * radius);\n    \n    vec3 col = vec3(0.0);\n    \n    if (t > 0.0) {\n        float d = -dot(ro, rd) - sqrt(t);\n        vec3 pOnSphere = ro + rd * d;\n        \n        vec3 pRotated = pOnSphere;\n        pRotated.xz *= rot(iTime * 0.2);\n        pRotated.xy *= rot(iTime * 0.1);\n        \n        // --- 4. 3D CELLULAR GRID ---\n        \n        float density = 30.0;\n        \n        vec3 pScaled = pRotated * density;\n        vec3 id = floor(pScaled);\n        vec3 local = fract(pScaled);\n        \n        float minDist = 100.0;\n        vec3 closestCellId = vec3(0.0);\n        \n        // Search 3x3x3 neighbors\n        for(int z=-1; z<=1; z++) {\n            for(int y=-1; y<=1; y++) {\n                for(int x=-1; x<=1; x++) {\n                    vec3 offset = vec3(float(x), float(y), float(z));\n                    vec3 currentId = id + offset;\n                    vec3 r = hash33(currentId); \n                    vec3 pointPos = offset + r - local;\n                    float dist = length(pointPos);\n                    \n                    if(dist < minDist) {\n                        minDist = dist;\n                        closestCellId = currentId;\n                    }\n                }\n            }\n        }\n        \n        float rnd = hash33(closestCellId).x;\n        \n        // --- 5. VISIBILITY & COLOR ---\n        // Use the 'dotAudio' (Snappy) here so lights still flicker to the beat\n        float visibility = 0.0;\n        if (dotAudio > rnd) {\n            visibility = smoothstep(rnd, rnd + 0.15, dotAudio);\n        }\n        if (dotAudio < 0.01) visibility = 0.0;\n        \n        if (visibility > 0.01) {\n            float dotSize = 0.4 * visibility; \n            float mask = smoothstep(dotSize, dotSize - 0.1, minDist);\n            \n            vec3 baseColor = getPalette(length(closestCellId) * 0.05 + iTime * 0.5);\n            baseColor *= 3.0; \n            \n            vec3 glint = vec3(1.0) * smoothstep(0.0, 0.01, minDist) * 0.01;\n            \n            vec3 finalDotColor = baseColor + glint;\n            \n            col = finalDotColor * mask * visibility;\n            \n            // Shading\n            vec3 normal = normalize(pOnSphere);\n            float shade = max(0.0, dot(normal, vec3(0.0, 0.0, -1.0)));\n            col *= 0.2 + 0.8 * shade;\n        }\n    }\n    \n    col = pow(col, vec3(0.4545));\n    fragColor = vec4(col, 1.0);\n}","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
</html>
