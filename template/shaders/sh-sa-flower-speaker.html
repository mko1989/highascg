	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-flower-speaker","name":"Flower Speaker","common":"","passes":{"image":{"source":"// Flower Speaker — by coposuke\n// https://www.shadertoy.com/view/ttXczX\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/ttXczX\n// Modified by ArthurTent\n// Created by coposuke\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n#define PI (3.14159265357989)\n#define TAU (PI * 2.0)\n\n\nvec3 hsv2rgb(vec3 c)\n{\n\treturn c.b * ((clamp( abs( fract(c.r + vec3(0,2,1) / 3.0) * 6.0 - 3.0) - 1.0, 0.0, 1.0) - 1.0) * c.g + 1.0);\n}\n\nvoid sa_main()\n{\n    //vec2 uvSound = fragCoord.xy / iResolution.xy;\n\t//vec2 uv = (fragCoord.xy * 2.0 - iResolution.xy) / min(iResolution.x, iResolution.y);\n    vec2 uvSound = vUv.xy;\n    vec2 uv = -2.+4.*vUv;\n\n    vec2 uvCircle = vec2(\n    \t(atan(-uv.y, -uv.x) + PI) / TAU,\n    \tlength(uv) * 1.5\n    );\n\n    const float CircleOffset = -0.5;\n    const float CircleLevel = 5.5;\n    float circleType = floor(uvCircle.y * CircleLevel + CircleOffset);\n\n    int colorType = 0;\n    float colorDepth = 0.0;\n\n    if (circleType < 20.0)\n    {\n        for(float i=0.0; i<6.0; i++)\n        {\n            if(circleType - i < 9.0)\n            {\n                vec2 fftUV = vec2(uvCircle.x, 0.0);\n                float fft1 = texture(iChannel0, sa_fft(fftUV)).x;\n                float fft2 = texture(iChannel0, sa_fft(vec2(1.0 - fftUV.x, fftUV.y))).x;\n                float fft = fract(uvCircle.y * CircleLevel + CircleOffset);\n                if( fft + i < fft1 * fft2 * mix(1.0, 50.0, (circleType - i) / 20.0) )\n                {\n                    colorType = int(circleType) - int(i);\n                    colorDepth = smoothstep(0.0, 1.0, fft + i);\n                }\n            }\n        }\n    }\n\n\n\tvec3 col = vec3(0);\n\n    float t = PI * float(colorType) / 20.0 + fract(iTime * 0.1);\n    col += float(1 < colorType && colorType < 10) * hsv2rgb(vec3(fract(t), 1.75 - colorDepth, colorDepth));\n\n    /*\n    if(uvCircle.y < 0.5)\n    {\n    \tcol = mix(col, vec3(0.2, 0.16, 0.15), smoothstep(0.3, 0.45, uvCircle.y) * smoothstep(0.5, 0.45, uvCircle.y));\n    }\n    */\n\n    //float wave = texture( iChannel0, vec2(uvSound.x * 0.25, 1.0) ).x;\n\t//col += smoothstep(0.002, 0.001, abs(uvSound.y - wave)) * vec3(1.0, 1.0, 0.0);\n\n\tsa_FragColor = vec4( col, 1.0 );\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
