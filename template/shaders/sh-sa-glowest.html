	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-glowest","name":"Glowest","common":"","passes":{"image":{"source":"// Glowest — by TornaxO7\n// https://www.shadertoy.com/view/w3tcWr\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/w3tcWr\n// Modified by ArthurTent\n// Modified Source Code: https://www.shadertoy.com/view/33tcWH or here below\n// Created by Kali\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\nconst float PI = acos(-1.);\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\n\n\nfloat get_freq(float hash) {\n    return FFT(hash);\n    //float range = 255.;//hash * freqs.length();\n    //return freqs[int(round(range))];\n}\n\n// https://www.shadertoy.com/view/4djSRW\nvec3 hash33(vec3 p3)\n{\n\tp3 = fract(p3 * vec3(.1031, .1030, .0973));\n    p3 += dot(p3, p3.yxz+33.33);\n    return fract((p3.xxy + p3.yxx)*p3.zyx);\n}\n\nfloat hash12(vec2 p)\n{\n\tvec3 p3  = fract(vec3(p.xyx) * .1031);\n    p3 += dot(p3, p3.yzx + 33.33);\n    return fract((p3.x + p3.y) * p3.z);\n}\n\nmat2x2 rotate(float r) {\n    return mat2x2(cos(r), -sin(r), sin(r), cos(r));\n}\n\n// https://iquilezles.org/articles/distfunctions/\n// (a lot sdf functions are from him below)\nfloat smin( float a, float b, float k )\n{\n    k *= 16.0/3.0;\n    float h = max( k-abs(a-b), 0.0 )/k;\n    return min(a,b) - h*h*h*(4.0-h)*k*(1.0/16.0);\n}\n\nfloat sdCappedCylinder( vec3 p, float r, float h )\n{\n  vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\nfloat sdRoundCone( vec3 p, float r1, float r2, float h )\n{\n  float b = (r1-r2)/h;\n  float a = sqrt(1.0-b*b);\n\n  vec2 q = vec2( length(p.xz), p.y );\n  float k = dot(q,vec2(-b,a));\n  if( k<0.0 ) return length(q) - r1;\n  if( k>a*h ) return length(q-vec2(0.0,h)) - r2;\n  return dot(q, vec2(a,b) ) - r1;\n}\n\nfloat sdHexPrism( vec3 p, vec2 h )\n{\n  const vec3 k = vec3(-0.8660254, 0.5, 0.57735);\n  p = abs(p);\n  p.xy -= 2.0*min(dot(k.xy, p.xy), 0.0)*k.xy;\n  vec2 d = vec2(\n       length(p.xy-vec2(clamp(p.x,-k.z*h.x,k.z*h.x), h.x))*sign(p.y-h.x),\n       p.z-h.y );\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\n\nfloat sdVerticalCapsule( vec3 p, float h, float r )\n{\n  p.y -= clamp( p.y, 0.0, h );\n  return length( p ) - r;\n}\n\nfloat sdTreeBranches(vec3 p) {\n    float t = iTime;\n    float s = cos(PI*.25);\n    float d = 100.;\n\n    for (int i = 0; i < 2; ++i) {\n         for (int id = -1; id < 2; ++id) {\n            float y = p.y - s*float(id);\n            vec3 r = vec3(p.x, y, p.z);\n\n            float dir = id == 0 ? 1. : -1.;\n            r.xy *= rotate(dir * PI*.25);\n\n            r.x += sin(r.y*3.+t)*.05;\n\n            d = min(d, sdVerticalCapsule(r, 1.5, .02));\n        }\n\n        p.xz *= rotate(PI*.6);\n        p.y += .2;\n    }\n    \n    return d;\n}\n\nfloat sdTreeLeaves(vec3 p, vec2 fid) {\n    float t = iTime;\n\n    float h1 = hash12(fid);\n    float body;\n    if (h1 < .25) {\n        body = length(p) - 1.5;\n    } else if (h1 < .5) {\n        body = sdRoundCone(p, 1., .2, 3.);\n    } else if (h1 < .75) {\n        body = sdHexPrism(p, vec2(1., 1.));\n    } else {\n        body = sdCappedCylinder(p, 1., 2.);\n    }\n    \n    p.xz *= rotate(sin(p.y*1.+t*.1));\n    vec3 s = vec3(.2);\n    vec3 id = round(p/s);\n\n    vec3 pt = p - s*id;\n\n    vec3 h = hash33(id);\n    pt += sin(h*100. + t)*.05;\n\n    \n    float freq = get_freq(h.x);\n    return max(length(pt)*(1. - freq*.8) - .001, body);\n    return max(length(pt) - .001, body);\n}\n\nfloat sdSnow(vec3 p) {\n    float t = iTime;\n\n    float fade_out = smoothstep(0., -30., p.y);\n    \n    p.y += t;\n\n    vec3 s = vec3(2.);\n    vec3 id = round(p/s);\n    vec3 h = hash33(id);\n\n    float freq = get_freq(h.x);\n\n    vec3 pt = p - s*id;\n    pt += sin(h*100.+t)*.2;\n\n    return length(pt)*(1. - freq*.5) + fade_out;\n    return length(pt) + fade_out;\n}\n\nfloat sdTree(vec3 p, vec2 id) {\n    float t = iTime;\n    p.xz += sin(p.y + t)*.05;\n\n    float stem = sdVerticalCapsule(p, 3., .03);\n    float branches = sdTreeBranches(p - vec3(0., 2.25, .0));\n    float leaves = sdTreeLeaves(p - vec3(0., 2.75, 0.), id);\n    float snow = sdSnow(p - vec3(0., 3., 0.));\n\n    return smin(stem, smin(branches, min(snow, leaves), .02), .02);\n}\n\nfloat map(vec3 p) {\n    float t = iTime;\n    float d = 100.;\n\n    p.y += sin(p.x + t*.5)*.2*(FFT(abs(p.x)) + 1.);\n    p.y += sin(p.z + t*.5)*.2*(FFT(abs(p.x)) + 1.);\n    /*\n    p.y += sin(p.x + t*.5)*.2*(FFT(1) + 1.);\n    p.y += sin(p.z + t*.5)*.2*(FFT(25) + 1.);\n    */\n   // p.y += sin(p.x + t*.5)*.2;\n   // p.y += sin(p.z + t*.5)*.2;\n\n\n    {\n        vec3 p = p;\n        vec2 s = vec2(5.);\n        vec2 id = round(p.xz / s);\n        p.xz -= s*id;\n        p.xz *= rotate(id.x*id.y);\n\n        d = min(d, sdTree(p, id));\n    }\n\n    {\n        vec3 p = p;\n        vec2 s = vec2(.2);\n        ivec2 id = ivec2(round(p.xz / s));\n\n        p.xz -= s*vec2(id);\n\n        float dir = id.x % 2 == 0 && id.y % 2 == 0 ? -1. : 1.;\n        p.xz *= rotate(float(id.x) + dir * t);\n        p.xy *= rotate(float(id.y) + dir * t);\n        p.yz *= rotate(float(id.x)+float(id.y) + dir * t);\n\n        vec3 h = hash33(vec3(id.xyx));\n\n        float freq = get_freq(h.x);\n        d = min(d, sdHexPrism(p, vec2((sin(h.x*100.+t)*.5+.5)*.05*freq)));\n    }\n\n    return d;\n}\n\nvoid sa_mainImage(out vec4 fragColor, in vec2 fragCoord) {\n    float t = iTime;\n    vec3 col = vec3(0.);\n    vec2 uv = (2. * gl_FragCoord.xy - iResolution.xy) / iResolution.y;\n    \n    vec3 ro = vec3(sin(t)*.3+2., .75, -t*.8);\n    vec3 rd = normalize(vec3(uv, -1.));\n\n    ro.y -= sin(ro.x + t*.5)*.2;\n    ro.y -= sin(ro.z + t*.5)*.2;\n\n    rd.yz *= rotate(PI*.1 + sin(t*.5)*PI*.05);\n\n    float d = 0.;\n    for (int i = 0; i < 30; ++i) {\n        vec3 p = ro + d * rd;\n\n        float dt = map(p);\n        dt = abs(dt);\n\n        col += (sin(vec3(1., 2., 3.) + p.x*.1+p.z*.01 +t*.1)*.2+.2) / (dt+.01);\n        d += dt*.8;\n    }\n\n    col = tanh(col * .01);\n\n    fragColor = vec4(col, 1.);\n}\n\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
