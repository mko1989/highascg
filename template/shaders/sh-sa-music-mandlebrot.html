<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-music-mandlebrot","name":"Music + Mandlebrot","common":"","passes":{"image":{"source":"// Music + Mandlebrot — by sujay\n// https://www.shadertoy.com/view/4dKBDh\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/4dKBDh\n// Created by sujay\n// Modified by Arthur Tent\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\nvoid sa_main()\n{\n\n    // Normalized pixel coordinates (from 0 to 1)\n    //vec2 uv = fragCoord/iResolution.xy;\n    vec2 uv = -1. + 2.* vUv;\n    //uv = (2.*vUv - iResolution.xy) / iResolution.y;\n\tuv.y = uv.y+0.5;\n\n    //sound data\n    // first texture row is frequency data\n\n\n    // second texture row is the sound wave\n\n\n\t// convert frequency to colors\n\t//vec3 col = vec3( fft, 4.0*fft*(1.0-fft), 1.0-fft ) * fft;\n\n\n    // Time varying pixel color\n    vec3 col = 0.5 + 0.5*cos(iTime+uv.xyx+vec3(0,2,4));\n    uv.xy=uv.yx;\n    uv = vec2 ( sqrt(uv.x*uv.x + uv.y*uv.y), atan(uv.y, uv.x)/2.0*3.14 );\n    vec2 z = vec2(0.0, .0);;\n    //vec2 c = uv*sin(iTime/3.0);\n    float wave = texture(iChannel0, sa_fft(vec2(uv.x,uv.y/20.))).x;\n    float fft  = texture(iChannel0, sa_fft(vec2(uv.x,0.5))).x;\n    vec2 c = uv*0.4;\n\n    float iter=30.0 * fft;//10.0+abs(10.0*sin(iTime*0.1));\n    float flag =1.0;\n    float j= 0.0;\n\n    for(float i = 0.0; i<iter;i= i+1.0)\n    {\n        z = vec2(z.x*z.x -z.y*z.y, 2.0*z.x*z.y) + c;\n        j = i;//iter -i;\n\t\tif((z.x*z.x +z.y*z.y) > 4.0)\n        {\n            flag = 0.0;\n            break;\n        }\n    }\n\n    float sn = float(j) - log2(log2(dot(z,z)));// + 40.0;\n    if(flag == 1.0)\n    {\n        sa_FragColor = vec4(vec3(0), 1.0);\n    }\n    else\n    {\n        //fragColor=vec4(vec3(j/iter)*vec3(2,0,0)*abs(sin(0.2*iTime)),1.0);\n        sa_FragColor=vec4(vec3(j/iter)*col*wave*vec3(1,1,1)*sn,1.0);\n    }\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
