	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-sound-oscilloscope-from-spectrum","name":"Sound Oscilloscope from spectrum","common":"","passes":{"image":{"source":"// Sound Oscilloscope from spectrum — by jaszunio15\n// https://www.shadertoy.com/view/Ws2GWD\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: CC BY 3.0 — https://creativecommons.org/licenses/by/3.0/deed.de\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/Ws2GWD\n// Modified by ArthurTent\n// Sound Oscilloscope from spectrum by jaszunio15\n//Shader License: CC BY 3.0\n// https://creativecommons.org/licenses/by/3.0/deed.de\n//Author: Jan Mróz (jaszunio15)\nvec2 vUv;\n\n#define LINE_WIDTH 10.6\n\n//Precision of one band from 0 to 1\n//#define PRECISION 0.25\n#define PRECISION 0.35\n\n//Number of bands\n#define BANDS_COUNT 64.0\n\n//From 0 to 1\n#define HIGH_FREQ_APPERANCE 0.7\n\n#define AMPLITUDE 4.0\n\nfloat hash(in float v)\n{\n \treturn fract(sin(v * 124.14518) * 2123.14121) - 0.5;\n}\n\nfloat getBand(in float freq)\n{\n \treturn pow(texture(iChannel0, sa_fft(vec2(freq, 0.0))).r, (2.0 - HIGH_FREQ_APPERANCE));   \n}\n\n\nfloat getSmoothBand(float band, float iterations, float bandStep)\n{\n \tfloat sum = 0.0;\n    for(float i = 0.0; i < iterations; i++)\n    {\n        sum += getBand(band + i * bandStep);\n    }\n    sum = smoothstep(0.2, 1.0, sum / iterations);\n    return sum * sum;\n}\n\nfloat getOsc(float x)\n{\n    x *= 1000.0;\n \tfloat osc = 0.0;\n    for (float i = 1.0; i <= BANDS_COUNT; i++)\n    {\n     \tfloat freq = i / BANDS_COUNT;\n        freq *= freq;\n        float h = hash(i);\n        osc += getSmoothBand(freq, (512.0 / BANDS_COUNT) * PRECISION, ((1.0 / PRECISION) / 512.0)) \n            \t* sin( freq * (x + iTime * 500.0 * h));\n    }\n    osc /= float(BANDS_COUNT);\n    \n    return osc;\n}\n\nvoid sa_main() \n{\n  \t//vec2 res = iResolution.xy;\n    vec2 res = iResolution.xy;\n    //vec2 uv = (2.0 * fragCoord - res) / res.x;\n    vec2 uv = -1.0 + 2.0 *vUv +.5;\n    uv.y -= 0.5;\n    uv.x += iTime * 0.5;// + 1.5 * hash(iTime);\n    \n    //float ps = 1.0 / min(res.x, res.y);\n    float ps = 1.0 / min(iResolution.x, iResolution.y);\n    \n    \n    float osc1 = getOsc(uv.x) * AMPLITUDE;\n    \n    float tgAlpha = clamp(fwidth(osc1) * res.x * 0.5, 0.0, 8.0);\n    float verticalThickness = abs(uv.y - osc1) / sqrt(tgAlpha * tgAlpha + 2.0);\n    \n    float line = 1.0 - smoothstep(0.0, ps * LINE_WIDTH, verticalThickness);\n    line = smoothstep(0.0, 0.5, line);\n    \n    float blur = (1.0 - smoothstep(0.0, ps * LINE_WIDTH * 32.0, verticalThickness * 4.0)) * 0.2;\n    \n    sa_FragColor = vec4(line + blur);\n    //sa_FragColor += pow(max(sa_FragColor - .2, 0.0), vec4(1.4))*vec4(sin(iTime), cos(iTime), 1., 1.);\n    sa_FragColor += pow(max(sa_FragColor - .4, 0.15), vec4(1.4))*vec4(vec3(0.5-(cos(iTime)+sin(iTime)), sin(iTime)*.5, cos(iTime)*5.),1.);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
