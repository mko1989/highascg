<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Otherworldy — HighAsCG Shader FX</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }
	</style>
</head>
<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-otherworldy","name":"Otherworldy","common":"","passes":{"image":{"source":"// Otherworldy — by lherm\n// https://www.shadertoy.com/view/MlySWd\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/MlySWd\n// Modified by ArthurTent\n// Otherworldy by lherm\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\n\n\n\n\n // nice hint for loading tAudio --> https://threejs.org/examples/webaudio_visualizer\nvec2 vUv;\n\n#define T iTime\n\n#define PSD (abs(texture(iChannel0, sa_fft(vec2(.5))).r)*abs(texture(iChannel0, sa_fft(vec2(.5))).r))\n\n// HG_SDF rotate function\n#define r(p, a) {p = cos(a)*p + sin(a)*vec2(p.y,-p.x);}\n\n// Cabbibo's HSV\nvec3 hsv(float h, float s, float v) {return mix( vec3( 1.0 ), clamp( ( abs( fract(h + vec3( 3.0, 2.0, 1.0 ) / 3.0 ) * 6.0 - 3.0 ) - 1.0 ), 0.0, 1.0 ), s ) * v;}\n\nvoid sa_main()\n{\n\t//vec2 u = (-iResolution.xy+2.*w.xy) / iResolution.y;\n    vec2 u = -.458 + 2.0 *vUv*.456;\n\n    vec3 ro = vec3(u, 1.), rd = normalize(vec3(u, -1.)), p; // Camera and ray dir\n    float d = 0., m; // Distance for march\n    for (float i = 1.; i > 0.; i-=0.02)\n    {\n        p = ro + rd * d;\n        r(p.zy, T);\n        r(p.zx, T);\n        m = length(cos(abs(p)+sin(abs(p))+T))-(PSD + .5); // Distance function\n        d += m;\n        sa_FragColor = vec4(hsv(T, 1.,1.)*i*i, 1.);\n        if (m < 0.02) break;\n    }\n    \n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
</html>
