	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-blue-thunder","name":"Blue Thunder","common":"","passes":{"image":{"source":"#ifdef GL_ES\nprecision highp float;\n#endif\n\n\n// ---- NOISE FUNCTIONS ----\n// Standard pseudo-random noise to generate the texture patterns\nfloat noise(in vec2 p) {\n    vec2 i = floor(p);\n    vec2 f = fract(p);\n    f = f*f*(3.0-2.0*f); // Smoothstep\n    float res = mix(mix(fract(sin(dot(i + vec2(0.0,0.0), vec2(12.9898,78.233)))*43758.5453123),\n                        fract(sin(dot(i + vec2(1.0,0.0), vec2(12.9898,78.233)))*43758.5453123),f.x),\n                    mix(fract(sin(dot(i + vec2(0.0,1.0), vec2(12.9898,78.233)))*43758.5453123),\n                        fract(sin(dot(i + vec2(1.0,1.0), vec2(12.9898,78.233)))*43758.5453123),f.x),f.y);\n    return res;\n}\n\n// Fractal Brownian Motion (Layering noise)\nfloat fbm(in vec2 p) {\n    float f = 0.0;\n    f += 0.5000*noise(p); p = p*2.02 + vec2(0.15);\n    f += 0.2500*noise(p); p = p*2.03 + vec2(0.15);\n    f += 0.1250*noise(p); p = p*2.01 + vec2(0.15);\n    f += 0.0625*noise(p);\n    return f/0.9375;\n}\n\n// ---- MAIN SHADER ----\nvoid mainImage( out vec4 fragColor, in vec2 fragCoord ) {\n    // Normalize UV coordinates\n    vec2 uv = (fragCoord.xy * 2.0 - iResolution.xy) / iResolution.y;\n    \n    // === AUDIO REACTIVITY ===\n    // IMPORTANT: Use texture2D(...) if your environment is WebGL1\n    float bass = texture(iChannel0, vec2(0.02, 0.0)).x; // Low frequency\n    float mids = texture(iChannel0, vec2(0.3, 0.0)).x;  // Mid frequency\n    \n    // Sharpen the bass response so it only reacts to loud hits\n    float bassActivity = smoothstep(0.3, 0.7, bass) * 1.5; \n    float midActivity = pow(mids, 2.0) * 2.0; // Brightness flash\n\n    // === DOMAIN WARPING ===\n    // We use noise to warp the coordinate space of subsequent noise calls.\n    vec2 p = uv * 3.0; // Scale space\n    \n    // Warp Layer 1: Slowly moving background flow\n    vec2 q = vec2(fbm(p + iTime * 0.2), \n                  fbm(p + vec2(5.2, 1.3) - iTime * 0.1));\n    \n    // Warp Layer 2: Highly reactive to BASS audio\n    // The 'bassActivity' makes the swirl more turbulent when loud.\n    vec2 r = vec2(fbm(p + 4.0*q + vec2(1.7, 9.2) + bassActivity + iTime*0.5),\n                  fbm(p + 4.0*q + vec2(8.3, 2.8) - bassActivity + iTime*0.3));\n                  \n    // Final noise value based on warped coordinates\n    float f = fbm(p + 4.0*r);\n\n    // === COLOR GRADING ===\n    // Mix deep blue and teal based on the noise pattern\n    vec3 col = mix(vec3(0.08, 0.1, 0.3), vec3(0.2, 0.4, 0.8), f);\n    \n    // Add \"Gold\" highlights where the warping is strongest\n    float highlight = dot(r, r);\n    col = mix(col, vec3(0.9, 0.7, 0.3), highlight * highlight * 0.8);\n    \n    // Audio Brightness Flash (reactive to Mids/Voice)\n    col *= (0.8 + midActivity * 1.2);\n    \n    // Contrast and Vignette for depth\n    col = col * col * 3.8; // Increase contrast\n    col *= 1.0 - length(uv) * 0.4; // Darken edges\n\n    fragColor = vec4(col, 1.0);\n}\n\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
