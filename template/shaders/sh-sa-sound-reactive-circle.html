	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-sound-reactive-circle","name":"Sound Reactive Circle","common":"","passes":{"image":{"source":"// Sound Reactive Circle — by Friend\n// https://www.shadertoy.com/view/NlsfDM\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/MXSXDt\n// Modified by ArthurTent\n// Created by Friend\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n\n#define R       iResolution\n#define t       iTime\n#define d(p,s)  (2. * p.xy - R.xy) / R.y * s\n#define mod3_   vec3(.1031, .11369, .13787)\n\nfloat hash3_1(vec3 p3) {\n\tp3  = fract(p3 * mod3_);\n    p3 += dot(p3, p3.yzx + 19.19);\n    return -1. + 2. * fract((p3.x + p3.y) * p3.z);\n}\n\nfloat vn3(vec3 p) {\n    vec3 pi = floor(p);\n    vec3 pf = p - pi;\n\n    vec3 w = pf * pf * (3. - 2. * pf);\n\n    return \tmix(\n    \tmix(\n        \tmix(hash3_1(pi + vec3(0, 0, 0)), hash3_1(pi + vec3(1, 0, 0)), w.x),\n            mix(hash3_1(pi + vec3(0, 0, 1)), hash3_1(pi + vec3(1, 0, 1)), w.x),\n  \t    w.z),\n        mix(\n            mix(hash3_1(pi + vec3(0, 1, 0)), hash3_1(pi + vec3(1, 1, 0)), w.x),\n            mix(hash3_1(pi + vec3(0, 1, 1)), hash3_1(pi + vec3(1, 1, 1)), w.x),\n      \tw.z),\n\tw.y);\n}\n\n\n\nvec3 gfb(vec2 ndc) {\n    float bass   = 0.0;\n    float mid    = 0.0;\n    float treble = 0.0;\n\n    // Loop over a set range of indices for each band to average their magnitudes\n    int spb = 10;\n    for (int i = 0; i < spb; i++) {\n        bass += texelFetch(iChannel0, sa_fftI(ivec2(i, 0)), 0).x;          // Bass band (low frequencies)\n        mid += texelFetch(iChannel0, sa_fftI(ivec2(170 + i, 0)), 0).x;     // Mid band (middle frequencies)\n        treble += texelFetch(iChannel0, sa_fftI(ivec2(340 + i, 0)), 0).x;  // Treble band (high frequencies)\n    }\n\n    // Average the magnitudes for each band\n    bass /= float(spb);\n    mid /= float(spb);\n    treble /= float(spb);\n\n    return vec3(bass, mid, treble);\n}\n\nvoid sa_main() {\n    //vec2 p = d(vUv, 5.5);\n    vec2 p = -6.0 + 2. *vUv * 6.;\n    //vec2 ndc = i.xy / R.xy;\n    vec2 ndc =vUv;\n    vec3 bands = gfb(ndc);\n\n    float vn1  = vn3(vec3(p-vec2(t), t));\n    float vn2  = vn3(vec3(p*2., t*2.));\n    float vn3_ = vn3(vec3(p*4., t*4.));\n    float vn4  = vn3(vec3(-p*16., -t*16.));\n    float vn   = .8*vn1 + .3*vn2 + .2*vn3_ + .1*vn4;\n\n    float cd = abs(length(p) - (.5+3.*bands.x) + .5*vn);\n    cd = smoothstep(0.55+bands.z, 0.01, cd);\n\n    vec3 col = vec3(0.388,0.388,0.992);\n    col += vn3(vec3(log(cd), vn, vn)) / length(p*.45);\n    col.r += 3.*bands.y*log(vn+1.)*vn2;\n\n    sa_FragColor = vec4(col, 1.);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
