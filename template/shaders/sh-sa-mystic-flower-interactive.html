	<style>

<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-mystic-flower-interactive","name":"Mystic Flower interactive","common":"","passes":{"image":{"source":"// Mystic Flower interactive — by timmaffett \n// https://www.shadertoy.com/view/mdjGDc\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/4Xt3RX\n// Created by timmaffett\n// Based on Rigel Mystic Flower\n// https://www.shadertoy.com/view/XsjBRt \n// Modified by Arthur Tent\n// License Creative Commons Attribution-NonCommercial-ShareAlike 4.0 Unported License.\n// https://creativecommons.org/licenses/by/4.0/\nvec2 vUv;\n// Author: Rigel\n// Shader: Mystic Flower\n// licence: https://creativecommons.org/licenses/by/4.0/\n\n#define PI 3.141592653589793\n#define TWO_PI 6.283185307179586\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nfloat snd = 0.;\n\n// radom number in 2d\nfloat hash(vec2 p) {\n  return fract(sin(dot(p,vec2(12.9898,78.2333)))*43758.5453123);\n}\n\n// noise in 2d\nfloat noise(vec2 p) {\n    vec2 i = floor(p);\n    vec2 f = fract(p);\n    vec2 u = f*f*(3.0-2.0*f);\n    return mix( mix( hash( i + vec2(0.0,0.0) ), hash( i + vec2(1.0,0.0) ), u.x),\n                mix( hash( i + vec2(0.0,1.0) ), hash( i + vec2(1.0,1.0) ), u.x), u.y);\n}\n\n// fractal noise in 2d\nfloat fbm ( vec2 p ) {\n    const mat2 m = mat2(0.8,0.6,-0.6,0.8);\n    float f = 0.0;\n    f += 0.5000*noise ( p ); p*=m*2.02;\n    f += 0.2500*noise ( p ); p*=m*2.04;\n    f += 0.1250*noise ( p ); p*=m*2.03;\n    f += 0.0650*noise ( p ); p*=m*2.01;\n\n    // normalize f;\n    f /= 0.9375;\n    return f;\n}\n\n// generates a palette with a cosine\n// from https://www.shadertoy.com/view/ll2GD3\nvec3 pal(float domain, vec3 frequency, vec3 phase) {\n  return vec3(0.5) + vec3(0.5) * cos(TWO_PI*(frequency*domain+phase));\n}\n\nvoid sa_mainImage(out vec4 light, in vec2 space)\t{\n  // cordinate system from -2 to 2\n  vec2 p = (-0.5 + (space.xy / iResolution.xy)) * vec2(4.0);\n  int max_freq = 100;\n  for(int i=1; i < max_freq; i++){\n      snd +=FFT(i)*float(i);\n  }\n  snd /=float(max_freq*20);\n\n  // aspect ratio\n  p.x *= iResolution.x / iResolution.y;\n\n  // angle and radius to center 0,0\n  float a = atan( p.y, abs(p.x) );\n  float r = length(p);\n  r/=1.+snd/4.;\n\n  float mouseX = (iMouse.x>0.) ? (iMouse.x-iResolution.x)/iResolution.x : 1.;  // add mouseX in as 0.5 - +0.5 term to allow interactivity\n  //float mouseX = (iMouse.x>0.) ? iMouse.x/iResolution.x : 1.;  // add mouseX in as 0.0 - 1.0 term to allow interactivity\n  //mouseX *=snd;\n  mouseX+=sin(iTime/40.);\n  // space distortion\n  p += vec2(fbm(vec2(a*2.+mouseX*iTime*.1,r*.4-iTime*.3)))*5.0;\n  // divide the space into cells and get cell index to seed the palette\n  float cidx = (floor(p.x+2.0) + (floor(p.y+2.0)*4.0)) / 16.0;\n  // color is from palette with cell index\n  vec3 color = pal(fbm(p*.5)*(1.+snd), vec3(1.0), vec3(0.4+cidx,0.2+cidx,0.0));\n\n  // draw a grid for the cells\n  color *= smoothstep(0.49,0.44, abs(fract(p.x)-0.5));\n  color *= smoothstep(0.49,0.44, abs(fract(p.y)-0.5));\n\n  // angular distortion\n  a += fbm(p*0.05);\n  // flower white petals\n  float f = abs(cos(a*9.)*sin(a*6.))*.7+.1;\n  float ff = smoothstep(f,f+0.05,r);\n  color = ff * color + (1.0-ff) * vec3(0.9,0.9,0.7) * (1.8-r);\n\n  // flower center\n  color = mix(color,vec3(1.,1.-r*3.,0.0),smoothstep(0.26,0.1+fbm(vec2(r+iTime,a-iTime))*0.06 ,r));\n  /*\n  color.r=1.-color.r;\n  color.g=1.-color.g;\n  color.b=1.-color.b;\n  */\n  light = vec4(color,1.0);\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
