	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-neon-bridge","name":"Neon Bridge","common":"","passes":{"image":{"source":"// Neon Bridge — by kishimisu\n// https://www.shadertoy.com/view/msjXzR\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/msjXzR\n// Modified by ArthurTent\n// Created by kishimisu\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\n\n/* \"Neon Bridge\" by @kishimisu (2022) - https://www.shadertoy.com/view/msjXzR\n\n   Playing around with neon lights and raymarching in 2022 chars =)\n\n   The light is accumulated at each step of the raymarching\n   and uses this intensity falloff : 1. / (1. + pow(abs(d*att), n))\n   that allow to produce such shiny and glowing colors.\n\n   The drawback is that I need a fixed number in the raymarching\n   loop as breaking early when hitting a surface don't produce nice\n   results.\n   Fortunately, with 40 steps it already looks really good and doesn't\n   require a top-tier graphic card.\n\n   I could optimize it more but I currently have exams and not much\n   time so I'm happy with this result !\n*/\nvec2 vUv;\n\n// copied from QuantumSuper <3\n#define getDat(addr) texelFetch(iChannel0, sa_fftI(ivec2(addr,0)), 0).x\nvec4 fft, ffts; //compressed frequency amplitudes\nvoid compressFft(){ //v1.2, compress sound in iChannel0 to simplified amplitude estimations by frequency-range\n    fft = vec4(0), ffts = vec4(0);\n\n\t// Sound (assume sound texture with 44.1kHz in 512 texels, cf. https://www.shadertoy.com/view/Xds3Rr)\n    for (int n=0;n<3;n++) fft.x  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //bass, 0-517Hz, reduced to 0-258Hz\n    for (int n=6;n<8;n++) ffts.x  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //speech I, 517-689Hz\n    for (int n=8;n<14;n+=2) ffts.y  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //speech II, 689-1206Hz\n    for (int n=14;n<24;n+=4) ffts.z  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //speech III, 1206-2067Hz\n    for (int n=24;n<95;n+=10) fft.z  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //presence, 2067-8183Hz, tenth sample\n    for (int n=95;n<512;n+=100) fft.w  += texelFetch(iChannel0, sa_fftI(ivec2(n,0)), 0 ).x; //brilliance, 8183-44100Hz, tenth2 sample\n    fft.y = dot(ffts.xyz,vec3(1)); //speech I-III, 517-2067Hz\n    ffts.w = dot(fft.xyzw,vec4(1)); //overall loudness\n    fft /= vec4(3,8,8,5); ffts /= vec4(2,3,3,23); //normalize\n\n\t//if (isVdj) for (int n=0;n++<4;) fft[n] *= 1. + .3*pow(fft[n],5.); fft = clamp(fft,.0,1.); //limiter? workaround attempt for VirtualDJ\n}\n\nvec3 getCol(float id){ //color definitions, for triplets\n    vec3 setCol = vec3(0);\n    id = mod(id,15.);\n         if (id< 1.) setCol = vec3(244,  0,204); //vw2 pink\n    else if (id< 2.) setCol = vec3(  0,250,253); //vw2 light blue\n    else if (id< 3.) setCol = vec3( 30, 29,215); //vw2 blue\n    else if (id< 4.) setCol = vec3(252,157,  0); //miami orange\n    else if (id< 5.) setCol = vec3( 26,246,138); //miami green\n    else if (id< 6.) setCol = vec3(131, 58,187); //nordic violet\n    else if (id< 7.) setCol = vec3(231, 15, 20); //arena red\n    else if (id< 8.) setCol = vec3( 35, 87, 97); //arena dark blue\n    else if (id< 9.) setCol = vec3(103,211,225); //arena blue\n    else if (id<10.) setCol = vec3(241,204,  9); //bambus2 yellow\n    else if (id<11.) setCol = vec3( 22,242,124); //bambus2 green\n    else if (id<12.) setCol = vec3( 30,248,236); //magic turquoise\n    else if (id<13.) setCol = vec3(173,  0, 27); //matrix red\n    else if (id<14.) setCol = vec3( 28,142, 77); //matrix green\n    else if (id<15.) setCol = vec3( 66,120, 91); //matrix green 2\n    return setCol/256.;\n}\n\n// If you find color values that look better for\n// this scene don't hesitate to share them!\n#define bridgeCol      vec3(.1,1,.8)\n#define bridgePillars  vec3(1,.7,.4)\n#define pillarsCol     vec3(1,.1,.1)\n#define patternsCol    vec3(.8,.6,.3)\n\nfloat box( vec3 p, vec3 b ) {\n  vec3 q = abs(p) - b;\n  return length(max(q,0.)) + min(max(q.x,max(q.y,q.z)),0.);\n}\n\nfloat rect( vec2 p, vec2 b ) {\n    vec2 d = abs(p)-b;\n    return length(max(d,0.)) + min(max(d.x,d.y),0.);\n}\n\n#define rot(a) mat2(cos(a), -sin(a), sin(a), cos(a))\n#define rep(p,r) (mod(p+r/2.,r)-r/2.)\n#define lrep(p,c,l) (p-c*clamp(round(p/c),-l,l))\n#define rid(p,r) floor((p+r/2.)/r)\n\nfloat light(float d, float att, float n) {\n    return 1. / (1. + pow(abs(d*att), n));\n}\n\nfloat map(vec3 p, float t, inout vec3 lgt) {\n    float d, b1, b2, lb2, b3, b4, r;\n    vec2 id0, id1;\n    vec3 id3, q, c = cos(p)*.25+.75;\n\n    // Bridge\n    d = rect(p.xy + vec2(0,2), vec2(1.4, 1));\n\n    // Floor & Ceiling\n    d = min(d, abs(abs(p.y) - 4.));\n\n    if (abs(p.x) < 1.5) {\n        // Bridge steps\n        q   = p;\n        q.z = lrep(q.z, .7, floor(iTime*8. - 14.));\n        b1  = box(q - vec3(0, -1.1 ,0), vec3(1., .1, .08));\n        d   = min(d, b1);\n        //lgt += c*bridgeCol *(fft.y+0.02) * light(b1, 60., 2.);\n        //lgt += c*bridgeCol*getCol(10.*fft.z*fft.x+sin(iTime)) * light(b1, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n        //lgt += c*getCol(10.*fft.z*fft.x+sin(iTime)) * light(b1, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5)*.15;\n        lgt += c*getCol(10.*fft.z*fft.x+sin(iTime)) * light(b1, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5)*.15;\n        //c*getCol(10.*fft.z*fft.x+sin(iTime)) * light(b4, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n\n        // Bridge pillars\n        q = p;\n        q.x = abs(q.x);\n        q.z = rep(q.z, 1.5);\n        id3 = rid(p, 1.5);\n        b2  = rect(q.xz - vec2(1.2,0), vec2(.1));\n        q.z = lrep(p.z, 1.5, floor(iTime*8.));\n        //lb2 = box(q - vec3(1.2,2. + sin(iTime + id3.z)*.5,0), vec3(.1,.3,.1));\n        lb2 = box(q - vec3(1.2,2. + sin(iTime + id3.z)*.5,0), vec3(.1,.9*fft.x,.1));\n        d   = min(d, b2);\n        lgt += c*bridgePillars * light(lb2, 80., 2.)*t*.5;\n        //lgt += c*bridgePillars * light(lb2, 80., 2.)*t*.5*fft.x;\n    }\n\n    // Ground/Ceiling pattern\n    if (abs(p.y) > 2.) {\n        const float br = 1.5;\n        q     = p;\n        id1   = rid(p.xz, br);\n        r     = fract(dot(sin(id1), (id1+41.21)*24.77));\n        q.xz  = rep(p.xz, br);\n        q.y   = abs(q.y)-4.;\n        q.xz *= rot(1.570796*(.5 + floor(r*2.)));\n        q.x   = abs(q.x)-br*.35;\n        b3    = box(q, vec3(.01,.2,br*.4));\n        d     = min(d, b3);\n        //lgt  += c*patternsCol * light(b3, 20., 2.) * exp(-t*.1 - (cos(max(0., iTime - 8.)*.5)*.5+.5)*10.);\n        lgt  += c*patternsCol * light(b3, 20., 2.) * exp(-t*.1 - (cos(max(0., iTime - 8.)+fft.x)*.5+.5)*10.);\n    }\n\n    // Distant pillars\n    q    = p;\n    id0  = rid(p.xz, 7.);\n    q.xz = rep(p.xz, 7.);\n    b3   = rect(q.xz, vec2(.5));\n    b3   = max(b3, -abs(p.x) +2.);\n    q.y  = rep(q.y, .5);\n    b4   = box(q, vec3(.5,.04,.5));\n    b4   = max(b4, -abs(p.x) +2.);\n    d    = min(d, b3);\n    if (fract((id0.x+41.11)*sin(id0.y*44.7)) < smoothstep(5., 8., iTime)){\n        //lgt += c*pillarsCol * light(b4, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n        //lgt += c*getCol(10.*(fft.z+fft.x+fft.y+fft.w)) * light(b4, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n        //lgt += c*getCol(10.*fft.z*fft.x) * light(b4, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n        lgt += c*getCol(10.*fft.z*fft.x+sin(iTime)) * light(b4, 40., 2.) * (sin(iTime+p.y*(2.*fract(id0.x*id0.y*47.44))+id0.x*id0.y)*.5+.5);\n\n    }\n    return d;\n}\n\nvoid sa_main() {\n    compressFft();\n    vec3 r3 = vec3(getDat(0),getDat(1),getDat(2));\n\n    //vec2 uv = (2.*F - iResolution.xy)/iResolution.y;\n    vec2 uv = -1.0 + 2.0* vUv;\n    vec3 lgt = vec3(0);\n    vec3 ro = vec3(0,0,iTime);\n    vec3 rd = normalize(vec3(uv, 1.));\n    float t = 0.;\n\n    for (int i = 0; i < 40; i++) {\n        vec3 p = ro + t*rd;\n        float d = map(p, t, lgt);\n        t += d;\n    }\n\n    sa_FragColor = vec4(pow(lgt, vec3(.45)), 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
