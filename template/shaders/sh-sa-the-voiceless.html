	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-the-voiceless","name":"The Voiceless","common":"","passes":{"image":{"source":"// The Voiceless — by python273\n// https://www.shadertoy.com/view/ls3cWM\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/ls3cWM\n// Modified by ArthurTent\n// Created by python273\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n#define PI 3.1415926535897932384626433832795\n#define half_PI 1.570796326794896619231321692\n\nfloat max_dist_image = distance(vec2(0.0), vec2(0.5));\nfloat max_dist_vr = distance(vec2(0.0), vec2(0.25));\nfloat c0;\n\nvec4 render(vec2 uv, float max_dist) {\n    float dist = distance(uv, vec2(0.0, 0.0)) / max_dist;\n    float a = (atan(uv.y, abs(uv.x)) + half_PI) / PI;\n\n\tc0 = texture(iChannel0, sa_fft(vec2(a, 0.25))).x;\n\n    return vec4(1.0, 1.0 - dist, c0, 1.0) * (c0 / dist);\n}\n\n\nvoid sa_main()\n{\n\t//vec2 uv = (fragCoord - .5*iResolution.xy) / min(iResolution.x, iResolution.y);\n    vec2 uv = -1.0 + 2.0 *vUv;  \n    sa_FragColor = render(uv, max_dist_image);\n}\n\n/*\nvoid mainVR( out vec4 fragColor, in vec2 fragCoord, in vec3 fragRayOri, in vec3 fragRayDir )\n{\n    vec2 uv = fragRayDir.xy / 2.0;\n    fragColor = render(uv, max_dist_vr);\n}\n*/\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
