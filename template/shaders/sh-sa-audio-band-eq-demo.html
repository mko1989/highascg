	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-audio-band-eq-demo","name":"Audio Band EQ Demo","common":"","passes":{"image":{"source":"// Audio Band EQ Demo — by byt3_m3chanic\n// https://www.shadertoy.com/view/WfByz1\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n#ifdef GL_ES\n#endif\n\n\n\n // expects BufferB output\n // expects BufferB output\n\n\n\n\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nvec2 vUv;\n\n/**\n\n    License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License\n\n    Revisiting one of my audio shaders now that I have a better grasp of FFT and sampling\n    audio in shaders\n\n    Audio Band EQ Demo\n    08/27/2025  @byt3_m3chanic\n\n*/\n\n#define R iResolution\n#define COLOR(COORD) texture(iChannel1,(COORD))\n\nvoid sa_mainImage( out vec4 O, in vec2 F )\n{\n\n\tvec2 uv = F.xy/R.xy;\n    vec3 color = COLOR(uv).rgb;\n\n    // effect sammple offset\n    vec3 fgclr = vec3(0);\n    float f = length(uv  - 1.4);\n    fgclr.x = COLOR(uv - vec2(f*0.003,.001)).x;\n    fgclr.y = COLOR(uv + vec2(f*0.001,-.002)).y;\n    fgclr.z = COLOR(uv + vec2(f*0.003,.001)).z;\n\n    // mask for effect\n    float dt = distance(uv.xy,vec2(.495))*1.75;\n    dt = smoothstep(.75,0.,dt);\n    vec3 C = mix(fgclr,color,dt);\n\n    // output & gamma\n    O = vec4(pow(C, vec3(.4545)),1.);\n\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio","A",null,null]},"bufferA":{"source":"vec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n#ifdef GL_ES\n#endif\n\n\n\n // expects BufferB output\n\n\n\n\n\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nvec2 vUv;\n\n/**\n\n    License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License\n\n    Revisiting one of my audio shaders now that I have a better grasp of FFT and sampling\n    audio in shaders\n\n    this song take a second to start - if no audio, stop, rewind, play..\n\n    Audio Band EQ Demo\n    08/27/2025  @byt3_m3chanic\n\n*/\n\n\n#define R           iResolution\n#define T           iTime\n#define M           iMouse\n\n#define PI          3.14159265\n#define PI2         6.28318530\n\n#define MIN_DIST 1e-3\n#define MAX_DIST 40.\n\n#define fftSize     64.\n\n//globals\nvec3 s_hit, g_hit;\nvec2 s_id, g_id;\nfloat s_fc, g_fc;\n\n\n//scales for all things\nconst float scale = 1./4.;\nconst float scale_h = scale*.5;\nconst vec2 s = vec2(scale)*2.;\n\n//positions and rotations\nconst vec2 pos = vec2(.5,-.5);\nconst vec2[4] ps4 = vec2[4](pos.yx,pos.xx,pos.xy,pos.yy);\n\nfloat hash21(vec2 p) {\n    return fract(sin(dot(p,vec2(26.37,45.93)))*4374.23);\n}\n\nmat2 rot(float a){\n    return mat2(cos(a),sin(a),-sin(a),cos(a));\n}\n\nvec3 hue(float t) {\n    return .45 + .35*cos(PI2*t*(vec3(1.,.85,.75)+vec3(.9,.7,.2)));\n}\n\n\nfloat cap( vec3 p, float h, float r ) {\n  vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h);\n  return min(max(d.x,d.y),0.0) + length(max(d,0.0));\n}\n\nfloat getFFT(float bin) {\n  float x = bin / fftSize;\n  return texture(iChannel0, sa_fft(vec2(x, 0.0))).r;\n}\n\nfloat getEQ(int eqId) {\n  int bandSize = int(fftSize) / 32;\n  int startBin = eqId * bandSize;\n\n  float sum = 0.0;\n  for (int i = 0; i < 16; i++) {\n    if (i < bandSize) {\n      sum += getFFT(float(startBin + i));\n    }\n  }\n  return sum / float(bandSize);\n}\n\n// block map -v4 tap technique from @Shane\nvec2 map(vec3 q3){\n    vec2 res = vec2(1e5,0.);\n    vec2 p,ip,id = vec2(0),ct = vec2(0);\n\n    float t=1e5, y=1e5, m=1.;\n\n    for(int i =0; i<4; i++) {\n\n        ct = ps4[i]/2. -  ps4[0]/2.;\n        p = q3.xz - ct*s;\n        ip = floor(p/s) + .5;\n        p -= (ip)*s;\n        vec2 idi = (ip + ct)*s;\n\n        vec3 q = vec3(p.x,q3.y,p.y);\n\n        float id = length(idi)*5.;\n        float fc = getEQ(int(id));\n\n        float tw = fc;\n        float b = cap(q-vec3(0,tw,0),tw,scale*.4)-.005;\n\n        if(b<t ) {\n            t = b;\n            m = 1.;\n            s_id = idi;\n            s_fc = fc;\n            s_hit = q+(idi.xyx*vec3(.25)+float(i));\n        }\n    }\n\n\tif(t<res.x) res = vec2(t,m);\n\n    float f = q3.y+.25;\n    if (f<res.x) {\n        res = vec2(f,2.);\n        s_hit = q3;\n    }\n\n    return res;\n}\n\nvec3 normal(vec3 p, float t) {\n    float e = MIN_DIST*t;\n    vec2 h =vec2(1,-1)*.5773;\n    vec3 n = h.xyy * map(p+h.xyy*e).x+\n             h.yyx * map(p+h.yyx*e).x+\n             h.yxy * map(p+h.yxy*e).x+\n             h.xxx * map(p+h.xxx*e).x;\n    return normalize(n);\n}\n\n\nvoid sa_mainImage( out vec4 fragColor, in vec2 F )\n{\n\n    vec2 uv = (2.*F.xy-R.xy)/max(R.x,R.y);\n\n    vec3 ro = vec3(0,0,7.+2.5*sin(T*.2));\n    vec3 rd = normalize(vec3(uv, -1));\n    float rtl = floor(mod(T,20.)) > 10. ? -1.32 : -.82;\n    // mouse //\n   \n    float x = M.xy==vec2(0) || M.z<0. ? 0. : -(M.y/R.y*.2-.1)*PI;\n    float y = M.xy==vec2(0) || M.z<0. ? 0. : -(M.x/R.x*1.-.5)*PI;\n\n    mat2 rx =rot(rtl-x), ry =rot(-(T*.07)-y);\n   \n    //mat2 rx =rot(rtl), ry =rot(-(T*.07));\n\n    ro.zy*=rx, ro.xz*=ry;\n    rd.zy*=rx, rd.xz*=ry;\n\n    vec3 C = vec3(0), ref = vec3(0), fil = vec3(1);\n\n    float d = 0.,m = 0.;\n    vec3 p = ro;\n\n    for(int i=0;i<128;i++) {\n        p = ro + rd * d;\n        vec2 ray = map(p);\n        if(ray.x<MIN_DIST*d||d>MAX_DIST)break;\n        d += i<32?ray.x*.25:ray.x;\n        m  = ray.y;\n    }\n\n    g_id=s_id;\n    g_fc=s_fc;\n\n    if(d<MAX_DIST)\n    {\n        vec3 n = normal(p,d);\n        vec3 lpos =  vec3(5,10,-5);\n        vec3 l = normalize(lpos-p);\n\n        float diff = clamp(dot(n,l),0.,1.);\n\n        float shdw = 1.;\n        for( float t=.01;t<10.; ) {\n            float h = map(p + l*t).x;\n            if( h<MIN_DIST ) { shdw = 0.; break; }\n            shdw = min(shdw, 32.*h/t);\n            t += h;\n            if( shdw<MIN_DIST || t>16. ) break;\n        }\n\n        diff = mix(diff,diff*shdw,.75);\n\n        float spec = .75 * pow(max(dot(normalize(p-ro),reflect(normalize(lpos),n)),0.),24.);\n        vec3 h = vec3(.001);\n        if(m==1.) {\n           float hs= hash21(g_id+floor(T*g_fc))*.1;\n            h = hue(1.-(g_fc+hs));\n            ref = h;\n        }\n\n        C = h * diff+spec;\n\n        ro = p+n*.001;\n        rd = reflect(rd,n);\n    }\n\n    C = mix(vec3(.025),C,  exp(-.0015*d*d*d));\n    //C = pow(C, vec3(.4545));\n    fragColor = vec4(C,1);\n}\n\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
