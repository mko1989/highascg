	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-fluidic-space","name":"Fluidic Space","common":"","passes":{"image":{"source":"// Fluidic Space — by EnigmaCurry\n// https://www.shadertoy.com/view/tdS3DD\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/tdS3DD\n// Modified by ArthurTent\n// Created by EnigmaCurry\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n// Fluidic Space - EnigmaCurry\n// Adapted from Simplicity by JoshP\n// https://www.shadertoy.com/view/lslGWr\n// http://www.fractalforums.com/new-theories-and-research/very-simple-formula-for-fractal-patterns/\nfloat field(in vec3 p) {\n\tfloat strength = 4. + .03 * log(1.e-6 + fract(sin(iTime) * 4373.11));\n\tfloat accum = 0.;\n\tfloat prev = 0.;\n\tfloat tw = 1.11;\n\tfor (int i = 0; i < 32; ++i) {\n\t\tfloat mag = dot(p/1.3, p/1.3);\n\t\tp = abs(p) / mag + vec3(-.5, -.4, -1.5);\n\t\tfloat w = exp(-float(i) / 777.);\n\t\taccum += w * exp(-strength * pow(abs(mag - prev), 1.9));\n\t\ttw += w;\n\t\tprev = mag;\n\t}\n\treturn max(0., 4. * accum / tw - .5);\n}\n\nvec4 simplicity(vec2 fragCoord, float fft) {\n\t//vec2 uv = 2. * fragCoord.xy / iResolution.xy - 1.;\n    vec2 uv = fragCoord - 0.45;\n\t//vec2 uvs = uv * iResolution.xy / max(iResolution.x, iResolution.y);\n    vec2 uvs = uv;// * iResolution.xy / max(iResolution.x, iResolution.y);\n\tvec3 p = vec3(uvs / 3., 0) + vec3(1., 1.01, 0.);\n\tp += 2. * vec3(sin(iTime / 39.), cos(iTime / 2100.)-2.,  sin(iTime / 18.)-8.);\n\tfloat t = field(p);\n\tfloat v = (1. - exp((abs(uv.x) - 1.) * 6.)) * (1. - exp((abs(uv.y) - 1.) * 6.));\n\treturn mix(.4, 1., v) * vec4(1.8 * t * t * t, 1.4 * t * t, t, 1.0) * fft;\n}\n\nvec4 simplicity2(vec2 fragCoord, float fft) {\n    float fmod = tan(fft/21222.);\n\t//vec2 uv = 2. * fragCoord.xy / iResolution.xy - 1.;\n    vec2 uv = fragCoord - 0.45;\n\tvec2 uvs = uv * iResolution.xy / max(iResolution.x, iResolution.y);\n\tvec3 p = vec3(uvs / 333., 0) + vec3(1., 0.1, 0.);\n\tp += tan(fmod) * vec3(cos(iTime / 39.), tan(iTime / 2100.)-2.,  sin(iTime / 18.)-8.);\n\tfloat t = field(p);\n\tfloat v = (1. - exp((abs(uv.x) - 1.) * 6.)) * (1. - exp((abs(uv.y) - 1.) * 6.));\n\treturn mix(.4, 1., v) * vec4(1.8 * t * t * t, 1.4 * t * t, t, 1.0) * fft;\n}\n\nvec4 simplicity3(vec2 fragCoord, float fft) {\n    float fmod = cos(fft*13.);\n\t//vec2 uv = 2. * fragCoord.xy / iResolution.xy - 1.;\n    vec2 uv = fragCoord - 0.45;\n\n\tvec2 uvs = uv * iResolution.xy / max(iResolution.x, iResolution.y);\n\tvec3 p = vec3(uvs / 1., 0) + vec3(1., 0.01, 0.);\n\tp += 2.19 * vec3(cos(iTime / 3900.), tan(iTime / 2100.)-2.,  sin(iTime / 18.)-8.);\n\tfloat t = field(p);\n\tfloat v = (1. - exp((abs(uv.x) - 1.) * 6.)) * (1. - exp((abs(uv.y) - 1.) * 6.));\n\treturn mix(sin(fmod)+8.8, 1., v) * vec4(0.8 * t * p.x * t, 0.9 * t, t, 1.0) * fft;\n}\n\n\nvoid sa_main() {\n    float fft = clamp(texture(iChannel0, sa_fft(vec2(0.1,0.1))).x * 12., 0.2, 99999.);\n    vec2 fragCoord =  -1.0 + 2.0 *vUv +.5;\n\tsa_FragColor += sqrt(simplicity(fragCoord, fft));\n    sa_FragColor += sqrt(simplicity2(fragCoord, fft));\n    sa_FragColor += sqrt(simplicity3(fragCoord, fft));\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
