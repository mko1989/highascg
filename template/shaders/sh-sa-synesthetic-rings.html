	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-synesthetic-rings","name":"Synesthetic Rings","common":"","passes":{"image":{"source":"// Synesthetic Rings — by isaacchurchill\n// https://www.shadertoy.com/view/Wt2cWR\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/Wt2cWR\n// Modified by ArthurTent\n// Created by isaacchurchill\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n//#define XOR_COLORING\n\n#define PI 3.14159265\n\nvec3 palette(float f)\n{\n#ifdef XOR_COLORING\n    return vec3(mod(f, 2.0));\n#else\n    f *= 0.09 * PI * 2.0;\n    return clamp(\n        vec3(sin(f + 2.0), sin(f + 1.0), sin(f + 0.0)),\n        0.0, 1.0);\n#endif\n}\n\nvoid sa_main()\n{\n    vec2 fragCoord = vUv * iResolution.xy;\n    vec2 uv = fragCoord/iResolution.xy * 2.0 - 1.0;\n    uv.x *= iResolution.x / iResolution.y;\n\n    float circle_radii = abs(texture(iChannel0, sa_fft(vec2(iTime,0.0))).x) * 0.7;\n    const float ring_spread = 0.35;\n\tconst float circle_spread = 0.2;\n\n    int intersections = 0;\n    float closest_dist = 999.9;\n\n    const int num_rings = 4;\n    const int circles_per_ring = 16;\n    for (int j = 0; j < num_rings; j++) {\n        float theta = (float(j) / float(num_rings)) * PI * 2.0;\n        theta += iTime;\n        vec2 ring_center = uv + vec2(sin(theta), cos(theta)) * ring_spread;\n\n        for (int i = 0; i < circles_per_ring; i++) {\n            float theta2 = (float(i) / float(circles_per_ring)) * PI * 2.0;\n\t        theta2 -= iTime * 0.2;\n            vec2 circle_pos = ring_center + vec2(sin(theta2), cos(theta2)) * circle_spread;\n\n            float dist = length(circle_pos) - circle_radii;\n            closest_dist = min(abs(dist), closest_dist);\n            if (dist < 0.0) {\n\t\t\t\tintersections++;\n            }\n        }\n    }\n\n    vec3 col = vec3(0.25);\n    if (intersections > 2) {\n\t    col = palette(float(intersections + 2));\n        col /= log(closest_dist * 120.0 + exp(0.8));\n    } else {\n        col /= log(closest_dist * 15.0 + exp(0.8));\n        col.z += (sin(closest_dist * 130.0) + 1.0)\n               * 0.07 / (closest_dist * 15.0 + 1.0);\n    }\n    col = clamp(col, 0.0, 1.0);\n\n    sa_FragColor = vec4(col, 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
