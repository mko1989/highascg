	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-sonic-pulse","name":"Sonic Pulse","common":"","passes":{"image":{"source":"// Sonic Pulse — by WillKirkby\n// https://www.shadertoy.com/view/4dcyD2\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/4dcyD2\n// Modified by ArthurTent\n// Created by WillKirkby\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nfloat snd = 0.;\nconst float PI = 3.1415926;\n\n// MIT Licensed hash From Dave_Hoskins (https://www.shadertoy.com/view/4djSRW)\nvec3 hash33(vec3 p)\n{\n    p = fract(p * vec3(443.8975,397.2973, 491.1871));\n    p += dot(p.zxy, p.yxz+19.27);\n    return fract(vec3(p.x * p.y, p.z*p.x, p.y*p.z));\n}\n\nvec3 stars(in vec3 p)\n{\n    vec3 c = vec3(0.);\n    float res = iResolution.x*0.8;\n    \n\tfor (float i=0.;i<4.;i++)\n    {\n        vec3 q = fract(p*(.15*res))-0.5;\n        //q*= snd/10.;\n        vec3 id = floor(p*(.15*res));\n        vec2 rn = hash33(id).xy;\n        float c2 = 1.-smoothstep(0.,.6,length(q));\n        c2 *= step(rn.x,.0005+i*i*0.001);\n        c += c2*(mix(vec3(1.0,0.49,0.1),vec3(0.75,0.9,1.),rn.y)*0.25+0.75);\n        p *= 1.4;\n    }\n    return c*c*.65;\n}\nvoid camera(vec2 fragCoord, out vec3 ro, out vec3 rd, out mat3 t)\n{\n    float a = 1.0/max(iResolution.x, iResolution.y);\n    //rd = normalize(vec3((fragCoord - iResolution.xy*0.5)*a, 0.5));\n    rd = normalize(vec3(fragCoord, 1.0));\n\n    ro = vec3(0.0, 0.0, -15.);\n\n    //float ff = min(1.0, step(0.001, iMouse.x) + step(0.001, iMouse.y));\n    float ff = min(1.0, step(0.001, iMouse.x) + step(0.001, iMouse.y))+sin(iTime/20.);\n    vec2 m = PI*ff + vec2(((iMouse.xy + 0.1) / iResolution.xy) * (PI*2.0));\n    //m.y = -m.y;\n    m.y = sin(m.y*0.5)*0.3 + 0.5;\n\n    //vec2 sm = sin(m)*sin(iTime), cm = cos(m)*(1.+sin(iTime));\n    vec2 sm = sin(m)*(1.+sin(iTime/10.)/2.), cm = cos(m);\n    mat3 rotX = mat3(1.0, 0.0, 0.0, 0.0, cm.y, sm.y, 0.0, -sm.y, cm.y);\n    mat3 rotY = mat3(cm.x, 0.0, -sm.x, 0.0, 1.0, 0.0, sm.x, 0.0, cm.x);\n\n    t = rotY * rotX;\n\n    ro = t * ro;\n    rd = t * rd;\n\n    rd = normalize(rd);\n}\n\nfloat circle(vec2 p, float r){\n\treturn r-length(p);\n}\n\nfloat scene(vec2 p){\n    vec2 p1=p;\n    if(abs(p.x)<.85&&abs(p.y)<.35)\n        p1=mod(p+.05,.1)-.05;  \n    \n    //p-=mod(p+.05,.1)-.05;\n    float r = texture(iChannel0, sa_fft(vec2(length(p)*.5,0))).r;\n    return circle(p1,.06*r*r);\n}\n\nvoid sa_main()\n{\n    int max_freq = 100;\n    for(int i=1; i < max_freq; i++){\n        snd +=FFT(i)*float(i);\n    }\n    snd /=float(max_freq*20);\n\tconst float cinematicAspect = 2.35;\n\tfloat currAspect = iResolution.x/iResolution.y;\n    \n    //vec2 uv = fragCoord/iResolution.xy-.5;\n    vec2 uv = -1.0 + 2.0 *vUv;\n    \n\t//camera + rd for stars\n    vec3 ro = vec3(0.0);//rd = vec3( 0.0 );\n\tvec3 rd = normalize(vec3(uv,-1.5));\n    mat3 t = mat3(1.0);\n\tcamera(uv, ro, rd, t);\n\n\tvec4 wave = texture(iChannel0, sa_fft(uv/256.));\n    uv.x *= currAspect;\n    \n    float d = scene(uv);\n    \n    sa_FragColor = 1.-clamp(vec4(d*iResolution.y*.5),0.,1.);\n    sa_FragColor.rgb = mix(\n    \t//vec3(11,231,184)/255.,\n        vec3(int(sin(wave.r)*200.),75+int(sin(wave.r)*10.),75+int(cos(wave.r)*50.))/255.,\n        vec3(30,57,77)/255.,\n        sa_FragColor.rgb\n    );\n    \n    if (abs(uv.y) > .75*(currAspect/cinematicAspect))\n    {\n\t\tsa_FragColor *= 0.;\n\t}\n    else\n    {\n        //sa_FragColor = sa_FragColor * (length(uv)*-.5+1.) + texture(iChannel0,uv/256.)*.004;\n        //                      ^ vignette           ^ noise to hide banding\n        sa_FragColor = sa_FragColor * (length(uv)*-.5+1.);\n        sa_FragColor *= pow(max(sa_FragColor - .2, 0.), vec4(1.4)) * (wave.r*100.);\n\t}\n    rd.x+=sin(iTime/1000.)*2.;\n\tvec3 bg = stars(rd)*(1.+30.*snd);\n\tsa_FragColor+=vec4(bg, 1.);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
