<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>vision on line — HighAsCG Shader FX</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }
	</style>
</head>
<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-vision-on-line","name":"vision on line","common":"","passes":{"image":{"source":"void mainImage(out vec4 A, vec2 F) {\n    vec2 r = iResolution.xy, u = (F+F-r)/r.y;    \n    A.rgb*=0.;\n\n    float autoStartTime = 0.0;\n    float timeFactor = 2.0; // mvmnt speed\n\n    for (float i; i<25.; A.rgb +=\n        .003/(abs(length(atan(u*u*u-u*u*u)-+tanh(u/u*u)/exp2(u*u))-i*.05)+.0009)\n        * (cos(i+vec3(3.9,5.,2.54534))+001.)                           \n        * smoothstep(.5,.9, abs(tan((length(mod(max(iTime-autoStartTime, 0.0),2.)-i*.1)-1.))))\n    ) {\n        // smoother mvmnt\n        float oscillation = atan(iTime * timeFactor) * 0.1;\n        u += oscillation * vec2(sin(iTime), sin(iTime));\n\n        // mvmnt transformations\n        u *= mat2(cos((iTime+autoStartTime+i++)*.01 + vec4(0,33,11,0)));\n    }\n\n    // audio\n    float audioAmplitude = texture(iChannel0, vec2(1.)).r * 2.0; \n    A.rgb *= audioAmplitude;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
</html>
