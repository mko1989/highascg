	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-modified-bear","name":"Modified Bear","common":"","passes":{"image":{"source":"// Modified Bear — by s23b\n// https://www.shadertoy.com/view/XtGGW3\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/XtGGW3\n// Modified by ArthurTent\n// Created by s23b\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n#define GLOW 1\n#define NEGATIVE 1\n#define GAMMA_CORRECT 0\n#define MASK_ONLY 0\n#define ADD_NOISE 1\n\n#define saturate2(x) clamp(x, 0., 1.)\n#define rot(a) mat2(cos(a), -sin(a), sin(a), cos(a))\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nfloat snd = 0.;\nconst float PI = 3.1415926;\n\n// MIT Licensed hash From Dave_Hoskins (https://www.shadertoy.com/view/4djSRW)\nvec3 hash33(vec3 p)\n{\n    p = fract(p * vec3(443.8975,397.2973, 491.1871));\n    p += dot(p.zxy, p.yxz+19.27);\n    return fract(vec3(p.x * p.y, p.z*p.x, p.y*p.z));\n}\n\nvec3 stars(in vec3 p)\n{\n    vec3 c = vec3(0.);\n    float res = iResolution.x*0.8;\n    \n\tfor (float i=0.;i<4.;i++)\n    {\n        vec3 q = fract(p*(.15*res))-0.5;\n        //q*= snd/10.;\n        vec3 id = floor(p*(.15*res));\n        vec2 rn = hash33(id).xy;\n        float c2 = 1.-smoothstep(0.,.6,length(q));\n        c2 *= step(rn.x,.0005+i*i*0.001);\n        c += c2*(mix(vec3(1.0,0.49,0.1),vec3(0.75,0.9,1.),rn.y)*0.25+0.75);\n        p *= 1.4;\n    }\n    return c*c*.65;\n}\nvoid camera(vec2 fragCoord, out vec3 ro, out vec3 rd, out mat3 t)\n{\n    float a = 1.0/max(iResolution.x, iResolution.y);\n    //rd = normalize(vec3((fragCoord - iResolution.xy*0.5)*a, 0.5));\n    rd = normalize(vec3(fragCoord, 1.0));\n\n    ro = vec3(0.0, 0.0, -15.);\n\n    //float ff = min(1.0, step(0.001, iMouse.x) + step(0.001, iMouse.y));\n    float ff = min(1.0, step(0.001, iMouse.x) + step(0.001, iMouse.y))+sin(iTime/20.);\n    vec2 m = PI*ff + vec2(((iMouse.xy + 0.1) / iResolution.xy) * (PI*2.0));\n    //m.y = -m.y;\n    m.y = sin(m.y*0.5)*0.3 + 0.5;\n\n    //vec2 sm = sin(m)*sin(iTime), cm = cos(m)*(1.+sin(iTime));\n    vec2 sm = sin(m)*(1.+sin(iTime/10.)/2.), cm = cos(m);\n    mat3 rotX = mat3(1.0, 0.0, 0.0, 0.0, cm.y, sm.y, 0.0, -sm.y, cm.y);\n    mat3 rotY = mat3(cm.x, 0.0, -sm.x, 0.0, 1.0, 0.0, sm.x, 0.0, cm.x);\n\n    t = rotY * rotX;\n\n    ro = t * ro;\n    rd = t * rd;\n\n    rd = normalize(rd);\n}\n\nfloat spikes(float x, float t) {\n    x = abs(fract(x) - .5) * 1. - .5 + t;\n    return x < 0. ? 0. : smoothstep(0., t, x);\n}\n\nfloat circle(vec2 p, float r) {\n    return length(p) - r;\n}\n\nfloat rect(vec2 p, vec2 s) {\n    vec2 a = abs(p) - s;\n    return a.x < 0. || a.y < 0. ? max(a.x, a.y) : length(a);\n}\n\nfloat opU(float a, float b) {\n    return min(a, b);\n}\n\nfloat opS(float a, float b) {\n    return max(a, -b);\n}\n\nfloat bear(vec2 p) {\n    float d = circle(p, 1.);\n\n    // draw ears\n    float earSize = .6;\n    vec2 earPos = vec2(.7);\n    float ear = circle(p - earPos, earSize);\n    float inEar = circle(p - earPos, earSize- .1);\n    inEar = opS(inEar, circle(p - earPos, earSize- .2));\n    ear = opS(ear, inEar);\n    ear = opS(ear, circle(p - earPos, earSize- .3));\n    d = opU(d, ear);\n\n    // substract face\n    d = opS(d, circle(p, .9));\n\n    // substract inside of ears on the top\n    d = opS(d, opS(inEar, p.y - earPos.y));\n\n    // draw eyes\n    float eyeSize = .49;\n    vec2 eyePos = vec2(.45, .2);\n    d = opU(d, circle(p - eyePos, eyeSize));\n    d = opS(d, circle(p - eyePos, eyeSize - .1));\n\n    // draw pupil\n    float pupilAngle = PI / 2. * (.9 - spikes(iTime / 6.4, .02) * .8);\n    d = opU(d, rect(p - eyePos, vec2(cos(pupilAngle), sin(pupilAngle)) * (eyeSize)));\n\n    // draw mouth\n    float mouthPos = eyePos.y - eyeSize + .04;\n    vec2 mouthSize = vec2(1.2, .05);\n    d = opU(d, rect(p - mouthPos, mouthSize));\n\n    // draw teeth\n    d = opU(d, rect(p * rot(.3) - vec2(.28, -.54), vec2(.05, .4)));\n    d = opU(d, rect(p * rot(-.3) - vec2(.13, -.62), vec2(.05, .35)));\n    d = opU(d, rect(p * rot(.3) - vec2(.63, -.38), vec2(.05, .35)));\n    d = opU(d, rect(p * rot(-.5) - vec2(.39, -.68), vec2(.05, .21)));\n\n    return d;\n}\n\n// interpolates between two closest fft samples with given resolution\nfloat fft(float t, float resolution) {\n    return mix(\n        texture(iChannel0, sa_fft(vec2(floor(t * resolution) / resolution, .25))).x,\n        texture(iChannel0, sa_fft(vec2(floor(t * resolution + 1.) / resolution, .25))).x,\n        fract(t * resolution));\n}\n\nfloat hash(vec2 uv) {\n    float f = fract(cos(sin(dot(uv, vec2(.009123898, .00231233))) * 480.512353) * 11111.5452313);\n    return f;\n}\n\nfloat noise(vec2 uv) {\n    vec2 fuv = floor(uv);\n    vec4 cell = vec4(\n        hash(fuv + vec2(0, 0)),\n        hash(fuv + vec2(0, 1)),\n        hash(fuv + vec2(1, 0)),\n        hash(fuv + vec2(1, 1))\n    );\n    vec2 axis = mix(cell.xz, cell.yw, fract(uv.y));\n    return mix(axis.x, axis.y, fract(uv.x));\n}\n\n// noise that flows arpind the center\nfloat fbm(vec2 uv) {\n    float f = 0.;\n    float r = 1.;\n    for (int i = 0; i < 8; ++i) {\n        uv *= rot(iTime / 10.);\n        f += noise((uv + float(i) / 10.) * r) / (r *= 2.);\n    }\n    return f / (1. - 1. / r);\n}\n\nvoid sa_main()\n{\n    int max_freq = 100;\n    for(int i=1; i < max_freq; i++){\n        snd +=FFT(i)*float(i);\n    }\n    snd /=float(max_freq*20);\n\t//vec2 uv = fragCoord.xy / iResolution.xy * 2. - 1.;\n    vec2 uv = -1.0 + 2.0 *vUv;\n\t//camera + rd for stars\n    vec3 ro = vec3(0.0);//rd = vec3( 0.0 );\n\tvec3 rd = normalize(vec3(uv,-1.5));\n    mat3 t = mat3(1.0);\n\tcamera(uv, ro, rd, t);\n    uv.x *= iResolution.x / iResolution.y;\n\n    vec2 p = vec2(abs(uv.x), uv.y + .13) * 1.3;\n\n\tfloat d = bear(p);\n\n    // add distortion\n    #if ADD_NOISE\n    d += (.5 - fbm(uv * 10.)) * .05;\n    d -= (fft(atan(p.x,p.y) / PI, 10.) - .2) * .05 * smoothstep(0., 1., length(p));\n    #endif\n\n    // create outline\n    float w = fwidth(d);\n    float mask = smoothstep(-w, w, d);\n\n    // add glow\n    #if GLOW\n    //float glow = pow(100., -d) * (.05 + smoothstep(.0, .5, texture(iChannel0, sa_fft(vec2(.6, .25))).x) * .25);\n    float glow = pow(100., -d) * (0.15 + smoothstep(.5, 1.5, texture(iChannel0, sa_fft(vec2(.1, .25))).x) * 1.25);\n\tmask = saturate2(mask - glow);\n    #endif\n\n    #if MASK_ONLY\n    sa_FragColor = vec4(mask);\n\n    #else\n    // create background flow\n    uv *= 2.;\n    // original flow\n    //vec4 flow = vec4(fbm(uv), fbm(uv * rot(1.)), fbm(uv * rot(2.)), 1);\n    //vec4 flow = vec4(fbm(uv)+(d/(sin(iTime/8.)+(d/10.))), fbm(uv * rot(1.))*(d+1./d), fbm(uv * rot(2.)*d), 1);\n    vec4 flow = vec4(fbm(uv)+(d/(sin(iTime/4.)+(d/10.))), fbm(uv * rot(1.))*(d+1./d), fbm(uv * rot(2.)*d), 1);\n    flow = floor(flow * 16.) / 16.;\n\n\n    // apply mask\n    sa_FragColor = mix(flow, vec4(1), mask);\n\n    #if NEGATIVE\n    sa_FragColor = 1. - sa_FragColor;\n    #endif\n\n    #if GAMMA_CORRECT\n    sa_FragColor = pow(sa_FragColor, vec4(.4545));\n    #endif\n    #endif\n    rd.x+=sin(iTime/1000.)*2.;\n\tvec3 bg = stars(rd)*(1.+30.*snd);\n\tsa_FragColor+=vec4(bg, 1.);\n\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
