	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-waveform-music-445","name":"Waveform Music [445]","common":"","passes":{"image":{"source":"// Waveform Music [445] — by Xor\n// https://www.shadertoy.com/view/wfcGR2\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n#ifdef GL_ES\n#endif\n\n\n\n // expects BufferB output\n\n\n\n\n#define FFT(a) pow(texelFetch(iChannel1, sa_fftI(ivec2(a, 0)), 0).x, 5.)\nvec2 vUv;\n\n\n/*\n    \"Waveform\" by @XorDev\n\n    I wish Soundcloud worked on ShaderToy again\n*/\nvoid sa_mainImage(out vec4 O, vec2 I)\n{\n    //Raymarch iterator, step distance, depth and reflection\n    float i, d, z, r;\n    //Clear fragcolor and raymarch 90 steps\n    for(O*= i; i++<9e1;\n    //Pick color and attenuate\n    O += (cos(z*.5+iTime+vec4(0,2,4,3))+1.3)/d/z)\n    {\n        //Raymarch sample point\n        vec3 R = iResolution.xyy,\n         p = z * normalize(vec3(I+I,0) - R);\n        //Shift camera and get reflection coordinates\n        r = max(-++p, 0.).y;\n        //Mirror and music\n        p.y += r+r-4.*texture(iChannel0, vec2((p.x+6.5)/15.,(-p.z-3.)*5e1/R.y)).r;\n        //Step forward (reflections are softer)\n        z += d = .1*(.1*r+abs(p.y)/(1.+r+r+r*r) + max(d=p.z+3.,-d*.1));\n    }\n    //Tanh tonemapping\n    O = tanh(O/9e2);\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["A","audio",null,null]},"bufferA":{"source":"vec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n\n#ifdef GL_ES\n#endif\n\n\n\n\n // expects BufferA output\n\n\n\n\n\n//uniform vec2 iFrame;\nvec2 vUv;\nfloat snd = 0.;\n\n\nvoid sa_mainImage(out vec4 O, vec2 I)\n{\n    vec2 r = iResolution.xy;\n    O = (I.y-=r.y/6e2)>1.?texture(iChannel0,I/r):texture(iChannel1, sa_fft(I/r));\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["A","audio",null,null]},"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
