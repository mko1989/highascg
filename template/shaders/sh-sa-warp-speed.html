	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-warp-speed","name":"Warp speed","common":"","passes":{"image":{"source":"// Warp speed — by Dave_Hoskins\n// https://www.shadertoy.com/view/Msl3WH\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/Msl3WH\n// Modified by ArthurTent\n// Created by Dave_Hoskins\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\n// 'Warp Speed' by David Hoskins 2013.\n// I tried to find gaps and variation in the star cloud for a feeling of structure.\n// Inspired by Kali: https://www.shadertoy.com/view/ltl3WS\nvec2 vUv;\n\n\n\n\n\n\n\n \n \n\nfloat getLevel(float x) {\n    return texelFetch(iChannel0, sa_fftI(ivec2(int(x*512.), 0)), 0).r;\n}\n\nvoid sa_main()\n{\n    float time = (iTime+29.) * 60.0;\n\t\n    float s = 0.0, v = 0.0;\n    //vec2 uv = (-iResolution.xy + 2.0 * fragCoord ) / iResolution.y;\n\tvec2 uv = -1.0 + 2.0 *vUv;\n\tfloat t = time*0.005;\n\tuv.x += sin(t) * .3;\n\tfloat level =  0.;\n\tfloat si = sin(t*(1.5+getLevel(10.))); // ...Squiffy rotation matrix!\n\tfloat co = cos(t);\n\tuv *= mat2(co, si, -si, co);\n\tvec3 col = vec3(0.0);\n\tvec3 p = vec3(0.0);\n\tvec3 init = vec3(0.25, 0.25 + sin(time * 0.001) * .1, time * 0.0008);\n\tfor (int r = 0; r < 100; r++) \n\t{\n\t\t//p = init + s * vec3(uv, 0.143)+getLevel(float(r));\n\t\tp = init + s * vec3(uv, 0.143);\n\n\t\tlevel = getLevel(float(r))*10000.;\n\t\t/*\n\t\tlevel =  mod(float(r),10.);\n\t\tif( level >= 0. ){\n\t\t\tlevel = getLevel(float(r));\n\t\t\tp = init + s * vec3(uv, 0.143)*level*100.;\n\t\t}\n\t\telse{\n\t\t\tp = init + s * vec3(uv, 0.143);\n\t\t}\n\t\t*/\n\t\t\n\t\tp.z = mod(p.z, 2.0);\n\t\tfor (int i=0; i < 10; i++)\tp = abs(p * 2.04) / dot(p, p) - 0.75;\n\t\t//for (int i=0; i < 10; i++)\tp = abs((getLevel(float(r))*p) * 2.04) / dot(p, p) - 0.75;\n\t\tv += length(p * p) * smoothstep(0.0, 0.5, 0.9 - s) * .002;\n\t\t// Get a purple and cyan effect by biasing the RGB in different ways...\n\t\tcol +=  vec3(v * 0.8+level/10., 1.1 - s * 0.5+level/30., .7 + v * 0.5+level/4.) * v * 0.013;\n\t\ts += .01;\n\t}\n\tsa_FragColor = vec4(col, 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>

</body>
