	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-ripplelppir","name":"ripplelppir","common":"","passes":{"image":{"source":"// ripplelppir — by bombblob\n// https://www.shadertoy.com/view/w3sGR7\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/w3sGR7\n// Modified by ArthurTent\n// Created by bombblob\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n#define FC fragCoord\n#define O fragColor\n#define R iResolution\n#define PI 3.14159\n#define F(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\n\n\nmat2 rot(float t){return mat2(cos(t),-sin(t),sin(t),cos(t));}\n\nvoid sa_mainImage( out vec4 fragColor, in vec2 fragCoord )\n{\n    vec2 uv=(FC-.5*R.xy)/R.y;\n\tfloat t=iTime;\n\tvec2 sv=sin(uv*rot(t*.5+sin(t*.25)*.2)*PI*3.-PI/2.)+sin(t*.5)*.5+F(1);\n\tfloat a=atan(uv.x,uv.y);\n\t//vec3 col=vec3(1.-sv.x*sv.y,(sv.x+sv.y)/2.,1.-max(sv.x,sv.y))*sin(length(uv)*PI*40.-t*3.+sin(a*32.-t*5.)+a*4.)*(1.+F((sv.x+sv.y)/2.)*5.);\n\tvec3 col=vec3(1.-sv.x*sv.y,(sv.x+sv.y)/2.,1.-max(sv.x,sv.y))*sin(length(uv)*PI*40.-t*3.+sin(a*32.-t*5.)+a*4.)*(1.+F((sv.x+sv.y)/2.)*2.);\n\tfloat pat= cos(a*8.+sin(atan(sv.x,sv.y)*2.*F(atan(sv.x,sv.y)*20.))*(sin(t*.5)+1.)+t*4.+length(uv)*sin(a*8.)*15.);\n\tcol*=pat;\n\tO=vec4(col,1.0);\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
