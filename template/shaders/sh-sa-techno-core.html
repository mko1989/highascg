	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-techno-core","name":"Techno Core","common":"","passes":{"image":{"source":"// Techno Core — by Kali\n// https://www.shadertoy.com/view/wtdXzS\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/wtdXzS\n// Modified by ArthurTent\n// Created by Kali\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\nfloat det = .001;\nvec3 objcol=vec3(0.);\nfloat snd;\n\n\nmat2 rot(float a) {\n\tfloat s = sin(a), c = cos(a);\n    return mat2(c, s, -s, c);\n}\n\nfloat fractal(vec3 p) {\n    vec3 c = p;\n    float m = 100.;\n    for(int i = 0; i < 10; i++) {\n\t\tp=abs(p + 1.) - abs( p - 1.) - p;\n        p=p / clamp(dot(p,p), 0.1, 1.) - c;\n    \tm=min(m, abs(length(p) - 3.5));\n    }\n    m = max(0., 1. - m);\n    objcol = abs(p) * .6;\n    return m * m * (.2+snd);\n}\n\nfloat de(vec3 p) {\n    p.yz *= rot(iTime);\n    p.xz *= rot(.2);\n    float f = fractal(p);\n\tfloat d = length(p) - 3.5 + f * 1.5 - snd * 3.;\n    d = min(d, length(p.xy) - .25);\n\td = min(d, length(p.yz) - .25);\n\td = min(d, length(p.xz) - .25);\n    return (d - f * .5) * .5;\n}\n\nvec3 march(vec3 from, vec3 dir) {\n\tvec3 col = vec3(0.), p;\n    float td = 0., d;\n    for (int i = 0; i < 150; i++) {\n    \tp = from + td * dir;\n\t\td = de(p);\n        td += max(det, abs(d));\n\t\tif (td > 20.) break;\n        col += objcol * exp(-.005 * td * td);\n    }\n    vec3 rescol = col * .01 * (.3 + snd * 1.5);\n    return rescol;\n}\n\nvoid sa_main()\n{\n    snd = texture(iChannel0, sa_fft(vec2(.15))).r;\n    //vec2 p = (fragCoord - iResolution.xy * .5) / iResolution.y;\n    //vec2 uv = fragCoord / iResolution.xy;\n    vec2 uv = vUv;\n    vec2 p = uv * 2. - 1.;\n    vec3 dir = normalize(vec3(p, .7));\n    float t = iTime*.5;\n    vec3 from = vec3(sin(t) * 2., 0., -10.);\n    from.xz *= rot(t);\n    dir.xz *= rot(t);\n\tdet += max(0. ,5. - iTime)*.02;\n    vec3 col = march(from, dir);\n    col += pow(abs(.5 - fract(dir.x * 20.)) * 2., 10.) * .2;\n    col += pow(abs(.5 - fract(dir.y * 20.)) * 2., 10.) * .2;\n    float spec = pow(texture(iChannel0, sa_fft(vec2(floor(dir.x*20.)/20. * .5 + .5, .1))).r,2.);\n\tvec2 sq = abs(.5-fract(dir.xy*20.));\n    col+=abs(1.-length(max(vec2(0.),abs(sq.xy)-.1)))*step(dir.y+.4,spec)*length(fract(dir.xy*10.))*.4;\n    col=max(col, vec3(.5, .2, 0.) - smoothstep(0.,.03,abs(dir.y - spec + .35)));\n    sa_FragColor = vec4(col, 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
