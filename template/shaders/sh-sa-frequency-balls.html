	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-frequency-balls","name":"frequency balls","common":"","passes":{"image":{"source":"// frequency balls — by nshelton\n// https://www.shadertoy.com/view/4scGW2\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/4scGW2\n// Modified by ArthurTent\n// frequency balls by nshelton\n// Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n\nfloat sphere(vec3 c, float r, vec3 p) {\n\treturn length(p-c) - r;   \n}\n\nfloat DE(vec3 p) {\n    //vec4 n1 = texture(iChannel0, vec2(0.2));\n    //vec4 n2 = texture(iChannel1, vec2(0.3));\n\n    float min_d = 100.;\n    \n    for ( int i = 0 ; i < 20; i ++ ) {\n        float t = float(i)/20. ;\n        float freq = pow(texture(iChannel0, sa_fft(vec2(t, 0.))).r, 3.0) * 2.;\n        \n\t\tfloat t_tex =  t + iTime/100.;\n        //vec4 n0 = texture(iChannel0, vec2(cos(t_tex), sin(t_tex)));\n\t\t//n0= n0 * 3. - 1.5;\n        //n0.y *=2.;\n        vec3 c = vec3(t * 10. - 5. , 0., 0.);// + n0.xyz;\n\t\tmin_d = min ( min_d, sphere(c, freq, p));\n\n    }\n        return min_d;\n}\n\nvec3 grad(vec3 p) {\n vec2 eps = vec2(0.01, 0.0);\n \n    return normalize(vec3(\n        DE(p + eps.xyy) -  DE(p - eps.xyy),\n        DE(p + eps.yxy) -  DE(p - eps.yxy),\n        DE(p + eps.yyx) -  DE(p - eps.yyx)));\n}\n\nvoid sa_main() \n{\n\t//vec2 uv = fragCoord.xy / iResolution.xy ;\n    //vec2 uv = -1.0 + 2.0 *vUv -.5;\n    vec2 uv = -1.0 + 2.0 *vUv +.35;\n\tuv = uv *2. - 1.; \n    uv.x *= iResolution.x/iResolution.y;\n    \n    vec3 ray = normalize(vec3(uv, 1.));\n    //vec3 camera = vec3(0.0, 0.0, sin(iTime)-4.);\n    vec3 camera = vec3(sin(iTime)*.4,cos(iTime), sin(iTime)-4.);\n    \n    float iter = 0.;\n    float t = 0.;\n   \tvec3 point;\n \tbool hit = false;\n    for ( int i = 0; i < 10; i ++) {\n    \tpoint = camera + ray * t;\n        \n        float d = DE(point);\n        \n        if (DE(point) < 0.1){\n         \thit = true;\n            break;\n        }\n        \n        iter += 0.1;\n        t += d;\n    }\n    vec3 color = vec3(0., 0., 0.);\n    if ( hit) {\n    \tcolor = vec3(dot(ray, -grad(point))) * vec3(1.-(cos(iTime)+sin(iTime)), sin(iTime), cos(iTime)) ;\n    \tcolor *= 1. - iter;\n    } \n    \n    sa_FragColor = vec4(color, 1.0);\n    \n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
