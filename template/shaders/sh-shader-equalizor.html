<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Shader Equalizor — HighAsCG Shader FX</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }
	</style>
</head>
<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-shader-equalizor","name":"Shader Equalizor","common":"","passes":{"image":{"source":"// ============================================\n// Circular Audio Equalizer - Shadertoy\n// ============================================\n// iChannel0 = Audio input (Sound or Soundcloud)\n// Paste into Shadertoy, set iChannel0 to a sound source\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n#define NUM_BARS 72.0\n#define INNER_RADIUS 0.18\n#define BAR_GAP 0.55          // 0..1 – gap between bars (higher = thinner bars)\n#define GLOW_STRENGTH 1.6\n\n// ---- helpers ----\nfloat hash(float n) { return fract(sin(n) * 43758.5453); }\n\nmat2 rot(float a) {\n    float c = cos(a), s = sin(a);\n    return mat2(c, -s, s, c);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord)\n{\n    // Centered & aspect-corrected UVs\n    vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;\n    float dist  = length(uv);\n    float angle = atan(uv.y, uv.x);               // -PI .. PI\n    float aNorm = (angle + PI) / TAU;               //  0  .. 1\n\n    // =============================================\n    // Audio sampling\n    // =============================================\n    // Row 0 = spectrum (FFT), Row 1 = waveform\n    float bass    = texture(iChannel0, vec2(0.02, 0.0)).r;\n    float mid     = texture(iChannel0, vec2(0.25, 0.0)).r;\n    float high    = texture(iChannel0, vec2(0.60, 0.0)).r;\n    float overall = (bass + mid + high) / 3.0;\n\n    // =============================================\n    // 1) Radial Equalizer Bars\n    // =============================================\n    float barIndex   = floor(aNorm * NUM_BARS);\n    float barCenter  = (barIndex + 0.5) / NUM_BARS;    // center of bar in 0..1\n    float barFrac    = fract(aNorm * NUM_BARS);         // position inside bar cell\n\n    // Frequency for this bar – sweep low→high around circle\n    float freq       = texture(iChannel0, vec2(barCenter, 0.0)).r;\n\n    // Bar geometry\n    float barHeight  = INNER_RADIUS + 0.05 + freq * 0.32;\n    float barMask    = smoothstep(0.0, 0.06, barFrac)\n                     * smoothstep(1.0, 1.0 - 0.06, barFrac);              // angular\n    barMask         *= step(BAR_GAP * 0.5, abs(barFrac - 0.5)) == 0.0\n                       ? 1.0 : 0.0;                                        // gap\n    barMask         *= smoothstep(INNER_RADIUS - 0.005, INNER_RADIUS + 0.005, dist); // inner edge\n    barMask         *= smoothstep(barHeight + 0.008, barHeight - 0.008, dist);        // outer edge\n\n    // Bar color – rainbow sweep + brightness from amplitude\n    vec3 barColor = 0.5 + 0.5 * cos(TAU * barCenter + iTime * 0.4 + vec3(0.0, 2.0, 4.0));\n    barColor *= 1.0 + freq * 1.8;                      // brighter at loud freqs\n    barColor *= smoothstep(INNER_RADIUS, barHeight, dist); // fade from inside out\n\n    // Tip glow at the end of each bar\n    float tipDist = abs(dist - barHeight);\n    float tipGlow = exp(-tipDist * 60.0) * freq * barMask * 0.8;\n\n    // =============================================\n    // 2) Inner Circle – bass-reactive pulsing core\n    // =============================================\n    float coreRadius = INNER_RADIUS - 0.02 + bass * 0.025;\n    float circle     = smoothstep(coreRadius, coreRadius - 0.025, dist);\n\n    // Subtle swirl inside the core\n    vec2 swirlUV = uv * rot(iTime * 0.3 + bass);\n    float swirl  = 0.5 + 0.5 * sin(atan(swirlUV.y, swirlUV.x) * 4.0 + iTime * 2.0 + bass * 8.0);\n    vec3 coreColor = mix(\n        vec3(0.05, 0.08, 0.22),\n        vec3(0.6, 0.25, 0.9),\n        swirl * 0.6 + bass * 0.5\n    );\n    coreColor += vec3(1.0, 0.4, 0.2) * bass * 0.4;    // warm bass punch\n\n    // =============================================\n    // 3) Waveform Ring\n    // =============================================\n    float waveRadius = INNER_RADIUS + 0.38 + mid * 0.06;\n    float wave       = texture(iChannel0, vec2(aNorm, 1.0)).r;  // waveform row\n    float waveR      = waveRadius + (wave - 0.5) * 0.08;\n    float waveLine   = exp(-abs(dist - waveR) * 120.0) * 0.7;\n    vec3 waveColor   = vec3(0.3, 0.8, 1.0) * (0.6 + high * 0.8);\n\n    // =============================================\n    // 4) Outer Ring & Glow\n    // =============================================\n    float outerRing  = INNER_RADIUS + 0.35 + overall * 0.05;\n    float ringLine   = exp(-abs(dist - outerRing) * 50.0) * 0.35;\n    vec3 ringColor   = 0.5 + 0.5 * cos(iTime * 0.6 + vec3(1.0, 3.0, 5.0));\n\n    // Central glow halo\n    float halo = exp(-dist * 2.8) * GLOW_STRENGTH * overall;\n\n    // =============================================\n    // 5) Background\n    // =============================================\n    // Subtle radial gradient + slow color shift\n    vec3 bg = vec3(0.012, 0.012, 0.03);\n    bg += 0.02 * (0.5 + 0.5 * cos(iTime * 0.15 + dist * 4.0 + vec3(0, 2, 4)));\n    // Faint grid / scanline vibe\n    bg *= 0.95 + 0.05 * sin(fragCoord.y * 1.8);\n\n    // =============================================\n    // Composite\n    // =============================================\n    vec3 col = bg;\n\n    // Bars\n    col = mix(col, barColor, barMask);\n    col += tipGlow * barColor;\n\n    // Core circle\n    col = mix(col, coreColor, circle);\n\n    // Rings & wave\n    col += ringLine * ringColor;\n    col += waveLine * waveColor;\n\n    // Glow\n    col += halo * vec3(0.25, 0.12, 0.45);\n\n    // ---- subtle vignette ----\n    col *= 1.0 - 0.35 * pow(length((fragCoord / iResolution.xy) - 0.5) * 1.8, 2.0);\n\n    // ---- tone mapping (keeps HDR glow but prevents clipping) ----\n    col = col / (1.0 + col);\n    col = pow(col, vec3(0.92));   // slight gamma lift\n\n    fragColor = vec4(col, 1.0);\n}","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
