	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-genizm-id-visualizer","name":"Genizm - Id (Visualizer)","common":"","passes":{"image":{"source":"// Genizm - Id (Visualizer) — by gurudevbk\n// https://www.shadertoy.com/view/7ldyzN\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/7ldyzN\n// Modified by ArthurTent\n// Created by gurudevbk\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Forked from \"Pretty Hip\" by Hadyn https://www.shadertoy.com/view/XsBfRW\nvec2 vUv;\n\n#define freq(f) texture(iChannel0, sa_fft(vec2(f, 0.25))).x * 0.8\n\n\nfloat avgFreq(float start, float end, float step) {\n    float div = 0.0;\n    float total = 0.0;\n    for (float pos = start; pos < end; pos += step) {\n        div += 1.0;\n        total += freq(pos);\n    }\n    return total / div;\n}\n\nvoid sa_main()\n{\n\n    float bassFreq = pow(avgFreq(0.0, 0.1, 0.01), 0.85);\n    float medFreq = pow(avgFreq(0.1, 0.6, 0.01), 0.85);\n    float topFreq = pow(avgFreq(0.6, 1.0, 0.01), 0.85);\n\n    float aspect = (iResolution.y/iResolution.x);\n    float value;\n\t//vec2 uv = fragCoord.xy / iResolution.x;\n    vec2 uv = vUv;\n    uv -= vec2(0.5, 0.5*aspect);\n    uv *= -0.01*iTime;\n\n    float rot = radians(45.0); // radians(45.0*sin(medFreq*iTime));\n    mat2 m = mat2(cos(rot), -sin(rot), sin(rot), cos(rot));\n   \tuv  = m * uv;\n    uv += vec2(0.5, 0.5*aspect);\n    uv.y+=0.5*(1.0-aspect);\n    vec2 pos = 10.0*uv;\n    vec2 rep = fract(pos);\n    float dist = 2.0*min(min(rep.x, 1.0-rep.x), min(rep.y, 1.0-rep.y));\n    float squareDist = length((floor(pos)+vec2(0.5)) - vec2(5.0) );\n\n    float edge = sin(medFreq+iTime-squareDist*0.5)*0.5+0.5;\n\n    edge = (bassFreq+medFreq+sin(iTime)-squareDist*iTime*0.5)*0.3;\n    edge += .2*medFreq;\n    edge = 2.0*fract(edge*0.5);\n    //value = 2.0*abs(dist-0.5);\n    //value = pow(dist, 2.0);\n    value = fract (dist*2.0);\n    value = mix(value, 1.0-value, step(1.0, edge));\n    //value *= 1.0-0.5*edge;\n    edge = pow(abs(1.0-edge), 2.0);\n\n    //edge = abs(1.0-edge);\n    value = smoothstep( edge-0.05, edge, 0.95*value);\n\n\n    value += squareDist*.1;\n    sa_FragColor = vec4(value);\n    sa_FragColor = mix(vec4(1.0,1.0,1.0,1.0),\n                    vec4(0.5*value*topFreq,\n                         0.5*medFreq,\n                         .5*value*bassFreq,1.0),\n                         value);\n    //fragColor.a = 0.25*clamp(value, 0.0, 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
