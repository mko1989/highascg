	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-exclamation-heart-nr-2-3","name":"Exclamation Heart Nr.2 <3!","common":"","passes":{"image":{"source":"// Exclamation Heart Nr.2 <3! — by ArthurTent\n// https://www.shadertoy.com/view/43dGDn\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International — http://creativecommons.org/licenses/by-nc-sa/4.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/43dGDn\n// Modified by ArthurTent\n// Created by ArthurTent\n// License: MIT\n// https://opensource.org/license/mit\nvec2 vUv;\n// The MIT License\n// Copyright © 2024 by ArthurTent\n\n// Based on Heart - distance 2D from Inigo Quilez https://www.shadertoy.com/view/3tyBzV\n\n// Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the \"Software\"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions: The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.\n\n// Distance to 45 degree heart shape, with only two square roots\n// (or 1, if the GPU supports actual branching)\n\n// List of some other 2D distances: https://www.shadertoy.com/playlist/MXdSRf\n//\n// and iquilezles.org/articles/distfunctions2d\n\n\nfloat dot2( in vec2 v ) { return dot(v,v); }\nfloat v = 0.;\n\n\nfloat sdHeart( in vec2 p )\n{\n    p.x = abs(p.x);\n\n    if( p.y+p.x>1.0 )\n        return sqrt(dot2(p-vec2(0.25,0.75))) - sqrt(2.0)/4.0;\n    float result = sqrt(min(dot2(p-vec2(0.00,1.00)),\n                    dot2(p-0.5*max(p.x+p.y,0.0)))) * sign(p.x-p.y);\n    return result;\n}\n\nfloat circlef(in vec2 p, vec2 center, float radius)\n{\n    p.x = abs(p.x);\n    return distance(p, center)-radius;\n}\n\nvoid sa_main()\n{\n    vec2 fragCoord = vUv * iResolution.xy;\n    // normalized pixel coordinates\n    vec2 p = (fragCoord*2.0-iResolution.xy)/iResolution.y;\n    v  = texture(iChannel0, sa_fft(vec2(1/510,0.25))).x;\n    /*\n    float red  = texture(iChannel0, sa_fft(vec2(1/510,0.25))).x;\n    float grn  = texture(iChannel0, sa_fft(vec2(0.5,0.5))).x;\n    float blu  = texture(iChannel0, sa_fft(vec2(0.75,0.5))).x;\n    */\n    p.y += 0.45;\n\n    p*= (.5+v*1.5);\n    float d = sdHeart(p)*(.005+v);\n\n    float theta = atan(p.y, p.x);\n\n    vec3 col = (d>0.0) ? vec3(0.9,0.6-v,0.3) : vec3(0.65,0.85-v,1.0);\n\n    vec2 circCenter = vec2(0.0, -0.55);\n    float circRadius = 0.15*(1.-v);\n\n    p/= (.5+v*1.5);\n\n    p.y -=0.25;\n\n    float circ = circlef(p, circCenter, circRadius);\n    col *= 1.0 - exp(-6.0*abs(circ));\n\tcol *= 1.0 + 0.2*cos(128.0*abs(circ));\n\tcol = mix( col, vec3(1.0), 1.0-smoothstep(0.0,0.01,abs(circ)) );\n\n    col *= 1.0 - exp(-6.0*abs(d));\n\tcol *= 1.0 + 0.2*cos(128.0*abs(d));\n\tcol = mix( col, vec3(1.0), 1.0-smoothstep(0.0,0.01,abs(d)) );\n\n   // output\n\tsa_FragColor = vec4(col, 1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
