<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>RYB Color wheel — HighAsCG Shader FX</title>
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }
	</style>
</head>
<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-ryb-color-wheel","name":"RYB Color wheel","common":"","passes":{"image":{"source":"void mainImage( out vec4 o,  vec2 i )\n{\n    o-=o;\n    vec3 r=vec3(1,0,0);\n    vec3 y=vec3(1,1,0);\n     vec3 g=vec3(0,1,0);\n    vec3 b=vec3(0,0,1);\n    vec3 ca[19];\n    ca[1]=b*2./6.+r*4./6.;\n    ca[2]=b*1./6.+r*5./6.;\n    ca[3]=r;\n    ca[4]=r*5./6.+y/6.;\n    ca[5]=r*4./6.+y*2./6.;\n    ca[6]=r*3./6.+y*3./6.;\n    ca[7]=r*2./6.+y*4./6.;\n    ca[8]=r*1./6.+y*5./6.;\n    ca[9]=y;\n    ca[10]=y*2./3.+g*1./3.;\n    ca[11]=y*1./3.+g*2./3.;\n    ca[12]=g;\n    ca[13]=g*2./3.+b*1./3.;\n    ca[14]=g*1./3.+b*2./3.;\n    ca[15]=b;\n    ca[16]=b*5./6.+r*1./6.;\n    ca[17]=b*4./6.+r*2./6.;\n    ca[18]=b*3./6.+r*3./6.;\n    \n\tvec2 uv = (i - .5*iResolution.xy)/iResolution.y;\n \n\t//o = .3*vec4(length(uv*2.));\n    int c=0;\n    for (float x=.0; x<acos(-1.)*2.;x+=acos(-1.)/18. )\n    {\n        \n        c+=1;\n        vec4 color=vec4(ca[c%18+1],0);   \n        o+=color*vec4((texture(iChannel0,vec2(.3-x*.05)).r)*x/2.*.008/length(uv-.1*sin(iDate.w*.2)*(x+1.5)*vec2(sin(x),cos(x))));\n        o+=color*vec4((texture(iChannel1,vec2(.3-x*.05)).r)*x/2.*.008/length(uv-.1*sin(iDate.w*.2)*(x+2.5)*vec2(sin(x),cos(x))));\n\n    }\n    o+=vec4(0,0,.2,0);\n}","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
</html>
