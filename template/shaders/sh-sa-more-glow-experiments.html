	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-more-glow-experiments","name":"More glow experiments","common":"","passes":{"image":{"source":"// More glow experiments — by mrange\n// https://www.shadertoy.com/view/W3X3zl\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: CC0 — https://creativecommons.org/public-domain/cc0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/NtXSzl\n// Modified by ArthurTent\n// Created by mrange\n// License CC0\n// https://creativecommons.org/public-domain/cc0/\n// License CC0: Moving without travelling\nvec2 vUv;\n\n// CC0: More glow experiments on a sunday\n// More tinkering\n#define FFT(a) pow(texelFetch(iChannel0, sa_fftI(ivec2(a, 0)), 0).x, 5.)\n#define aTime 128./60.*iTime\nmat2 rotM(float r){float c = cos(r), s = sin(r); return mat2(c,s,-s,c);} //2D rotation matrix\nfloat snd = 0.;\n\n// Can't decide which I prefer\n#define VARIANT\n\n#define TIME        iTime\n#define RESOLUTION  iResolution\n#define ROT(a)      mat2(cos(a), sin(a), -sin(a), cos(a))\n\nconst float\n    PI        = acos(-1.)\n  , TAU       = 2.*PI\n  ;\n\n\nmat2 g_rot;\nfloat g_scale;\n\n// License: Unknown, author: Matt Taylor (https://github.com/64), found: https://64.github.io/tonemapping/\nvec3 aces_approx(vec3 v) {\n  v = max(v, 0.0);\n  v *= 0.6*(.5+snd*2.);\n  float a = 2.51;\n  float b = 0.03+snd;\n  float c = 2.43*snd;\n  float d = 0.59+snd;\n  float e = 0.14+snd;\n  return clamp((v*(a*v+b))/(v*(c*v+d)+e), 0.0, 1.0);\n}\n\nvec3 offset(float t) {\n  t*= 0.25;\n  return 0.2*vec3(sin(TAU*t), sin(0.5*t*TAU), cos(TAU*t));\n}\n\nvec3 doffset(float t) {\n  const float dt = 0.01;\n  return (offset(t+dt)-offset(t-dt))/(2.*dt);\n}\n\n// License: MIT, author: Inigo Quilez, found: https://www.iquilezles.org/www/articles/smin/smin.htm\nfloat pmin(float a, float b, float k) {\n  float h = clamp(0.5+0.5*(b-a)/k, 0.0, 1.0);\n  return mix(b, a, h) - k*h*(1.0-h);\n}\n\nfloat pmax(float a, float b, float k) {\n  return -pmin(-a, -b, k);\n}\n\nvec3 palette(float a) {\n  return 1.+sin(vec3(0,1,2)+a);\n}\n\nfloat apollonian(vec4 p, float s, float w, out float off) {\n  float scale = 1.0;\n\n  for(int i=0; i<6 ;i++) {\n    p        = -1.0 + 2.0*fract(0.5*p+0.5);\n    float r2 = dot(p,p);\n    float k  = s/r2;\n    p       *= k;\n    scale   *= k;\n  }\n  vec4 sp = p/scale;\n  vec4 ap = abs(sp)-w;\n  float d = pmax(ap.w, ap.y, w*10.);\n#ifdef VARIANT\n  off = length(sp.xz);\n#else\n  d = min(d, pmax(ap.x, ap.z, w*10.));\n\n  off = length(sp.xy);\n#endif\n    //d*=(.1+snd*4.);\n    //d*=snd;\n  return d;\n}\n\nfloat df(vec3 p, float w, out float off) {\n  vec4 p4 = vec4(p, 0.1);\n  p4.yw *= g_rot;\n  p4.zw *= transpose(g_rot);\n  return apollonian(p4, g_scale, w, off);\n}\n\nvec3 glowmarch(vec3 col, vec3 ro, vec3 rd, float tinit) {\n  float t = tinit;\n  for (int i = 0; i < 60; ++i) {\n    vec3 p = ro + rd*t;\n    float off;\n    float d = df(p, 6E-5+t*t*2E-3, off);\n    d*=(0.3+FFT(i));\n    vec3 gcol = 1E-9*(palette((log(off)))+5E-2)/max(d*d, 1E-8);\n    col += gcol*smoothstep(0.5, 0., t);\n    t += 0.5*max(d, 1E-4);\n    \n    if (t > 0.5) break;\n  }\n  col.r*=(.1+snd*4.);\n  return col;\n}\n\n// borrowed from QuantumSuper\nvec2 getPlane(vec2 p){  \n    if(snd<.3){ p*=-1.5*rotM(sign(snd*10.)*aTime/8.);}\n    float fTime = fract(iTime/64.); \n    if (fract(aTime/32.)<.75) return p; //break, standard view\n    else if (fTime<.33) {p = 2.5*fract(p*2.*abs(sin(aTime/8.))+.5)-.5; p.y-=.5;} //scaling multiples\n    else if (fTime<.66) p *= 1.5*rotM(sign(fract(aTime/32.)-.5)*aTime/8.); //rotation\n    else p = snd*sin( PI*p + vec2( sign(fract(aTime/32.)-.5) * aTime/4., 0)); //moving warp multiples\n    if(snd<.3){ p*=1.5*rotM(sign(snd*10.)*aTime/4.);}\n    else{p*=(.1+snd*3.);}\n    return p;\n}\n\nvec3 render(vec3 col, vec3 ro, vec3 rd) {\n  col = glowmarch(col, ro, rd, 1E-2);\n  return col;\n}\n\n\nvec3 effect(vec2 p, vec2 pp, vec2 q) {\n  float tm  = mod(TIME+50.,1600.0);\n  g_scale = mix(1.85, 1.5, 0.5-0.5*cos(TAU*tm/1600.));\n  g_rot = ROT(tm*TAU/800.0);\n  tm *= 0.025;\n  vec3 ro   = offset(tm);\n  vec3 dro  = doffset(tm);\n  vec3 ww = normalize(dro);\n  vec3 uu = normalize(cross(vec3(0,1,0), ww));\n  vec3 vv = cross(ww, uu);\n  vec3 rd = normalize(-p.x*uu + p.y*vv + 2.*ww);\n\n  vec3 col = vec3(0.0);\n  col += 1E-1*palette(5.0+0.1*p.y)/max(1.125-q.y+0.1*p.x*p.x, 1E-1); \n  col = render(col, ro, rd); \n  col *= smoothstep(1.707, 0.707, length(pp))*(.1+snd);\n  col -= vec3(2.0, 3.0, 1.0)*4E-2*(0.25+dot(pp,pp));\n  col = aces_approx(col);\n  col = sqrt(col);\n  return col;\n}\n// License: MIT, author: Inigo Quilez, found: https://iquilezles.org/www/index.htm\nvec3 postProcess(vec3 col, vec2 q) {\n  col = clamp(col, 0.0, 1.0);\n  col = pow(col, vec3(1.0/2.2));\n  col = col*0.6+0.4*col*col*(3.0-2.0*col);\n  col = mix(col, vec3(dot(col, vec3(0.33))), -0.4);\n  col *=0.5+0.5*pow(19.0*q.x*q.y*(1.0-q.x)*(1.0-q.y),0.7);\n  return col;\n}\nvoid sa_mainImage( out vec4 fragColor, in vec2 fragCoord ) {\n  int max_freq = 100;\n  for(int i=1; i < max_freq; i++){\n      snd +=FFT(i)*float(i); \n  }\n  snd /=float(max_freq*20);\n\n  vec2 q = fragCoord/RESOLUTION.xy;\n  vec2 p = -1. + 2. * q;\n  vec2 pp = p;\n  p.x *= RESOLUTION.x/RESOLUTION.y;\n  p = getPlane(p);\n  vec3 col = effect(p, pp, q);\n  //col = postProcess(col, q);\n  fragColor = vec4(col,1.0);\n}\n\nvoid sa_main() {\n\tvec2 fragCoord = vUv * iResolution.xy;\n\tsa_mainImage(sa_FragColor, fragCoord);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
