	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-mandelkoch-music-visualiser-ver","name":"MandelKoch- Music Visualiser ver","common":"","passes":{"image":{"source":"// MandelKoch- Music Visualiser ver — by Pelegefen\n// https://www.shadertoy.com/view/sslXzX\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/sslXzX\n// Modified by ArthurTent\n// Created by Pelegefen\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\n// ----------------CAUTION!!!--- FLASHING BRIGHT LIGHTS!!!-------------------------\n\n// Credits - fractal zoom with smooth iter count adapted from - iq (Inigo quilez) - https://iquilezles.org/articles/msetsmooth\n// Koch Snowflake symmetry from tutorial by Martijn Steinrucken aka The Art of Code/BigWings - 2020 - https://www.youtube.com/watch?v=il_Qg9AqQkE&ab_channel=TheArtofCode\n//music - Sajanka (Official) Sajanka - Sun Is Coming\n\n//Some notes - color is determined by date and not time - hour of day dependent.\n//Move the mouse on the Y axis to change the symmetry.\n\n//----------------------------------------------------------------------------------\n\n//uncomment to sample audio input from MIC instead of SoundCloud.\n//#define MIC_INPUT\n\n//comment to make it less trippy and noisy.\n#define EXTRA_DMT\n\n\n#define PI 3.14159265359\n\n\n\n#define date iDate\n#define time iTime\n#define resolution iResolution\n\nfloat freqs[4];\n\n\nvec2 rot(vec2 p,float a){\n\n    float c = cos(a);\n    float s = sin(a);\n\n    mat2 m = mat2(c,-s,s,c);\n\n    p*=m;\n    return p  ;\n}\n\nfloat localTime(){\n\nfloat d = date.w / date.x;\nreturn d;\n\n}\n\nvec3 randomCol(float sc){\n\n float d = localTime();\n\tfloat r = sin(sc * 1. * d)*.5+.5;\n\tfloat g = sin(sc * 2. * d)*.5+.5;\n\tfloat b = sin(sc * 4. * d)*.5+.5;\n\n\tvec3 col = vec3(r,g,b);\n\tcol = clamp(col,0.,1.);\n\n\treturn col;\n\t}\n\n\n//--------------------------------------------------mandelbrot generator-----------https://iquilezles.org/articles/msetsmooth\n\nfloat mandelbrot(vec2 c )\n{\n    float fr_avg = (freqs[0]+freqs[1]+freqs[2]+freqs[3])/4.;\n    #if 1\n    {\n        float c2 = dot(c, c);\n        // skip computation inside M1 - https://iquilezles.org/articles/mset1bulb\n        if( 256.0*c2*c2 - 96.0*c2 + 32.0*c.x - 3.0 < 0.0 ) return 0.0;\n        // skip computation inside M2 - https://iquilezles.org/articles/mset2bulb\n        if( 16.0*(c2+2.0*c.x+1.0) - 1.0 < 0.0 ) return 0.0;\n    }\n    #endif\n\n\n    const float B = 128.0;\n    float l = 0.0;\n    vec2 z  = vec2(0.0);\n    for( int i=0; i<256; i++ )\n    {\n        z = vec2( z.x*z.x - z.y*z.y, 2.0*z.x*z.y ) + c;\n        if( dot(z,z)>(B*B) ) break;\n        l += 1.0;\n    }\n\n    if( l>255.0 ) return 0.0;\n\n\n    // equivalent optimized smooth interation count\n    float sl = l - log2(log2(dot(z,z))) + 4.0;\n    //sl *= fr_avg;\n\n\n     return sl;\n }\n\n\nvec3 mandelbrotImg(vec2 p)\n{\n    float tsin = sin(iTime/32.);\n    float fr_avg = (freqs[0]+freqs[1]+freqs[2]+freqs[3])/4.;\n    fr_avg+=.1;\n    //uncomment to see unmaped set\n\t//p = (-resolution.xy + 2.0*gl_FragCoord.xy)/resolution.y;\n    float mtime =  time;\n    mtime -= freqs[3];\n    float zoo = 0.62 + 0.38*cos(.1*mtime)*fr_avg;\n   float coa = cos( 0.015*(1.0-zoo)*mtime );\n   float sia = sin( 0.015*(1.0-zoo)*mtime );\n   zoo = pow( zoo,6.0);\n   vec2 xy = vec2( p.x*coa-p.y*sia, p.x*sia+p.y*coa);\n   vec2 c = vec2(-.745,.186) + xy*zoo;\n\n    float l = mandelbrot(c);\n\n\n    vec3 col1 = vec3(0);\n    if(tsin>0.85){\n        col1 = 0.5 + 0.5*cos(3.0 + l*.15 * randomCol(.1)*fr_avg*4.);\n    }else if (tsin>0.5){\n        col1 = 0.5 + 0.5*cos(3.0 + l*.15 * randomCol(.1)+fr_avg*4.);\n    }else{\n        col1 = 0.5 + 0.5*cos(3.0 + l*.15 * randomCol(.1));\n    }\n    //col1 = 0.5 + 0.5*cos(3.0 + l*.15 * randomCol(.1))*fr_avg*4.;\n    #ifdef EXTRA_DMT\n\n    vec3 col2 = 0.5 + 0.5*cos( 3.0 + l*.15 / randomCol(.1));\n    #else\n    vec3 col2 = 0.5 + 0.5*cos( 3.0 + l*.15 * randomCol(.1));\n    #endif\n    vec3 col = mix(col1,col2,sin(mtime)*.5+.5);\n\n\n\n\nreturn col;\n}\n\n//-----------------functions-----------\n\nfloat remap(float a1, float a2 ,float b1, float b2, float t)\n{\n\treturn b1+(t-a1)*(b2-b1)/(a2-a1);\n}\n\n\nvec2 remap(float a1, float a2 ,float b1, float b2, vec2 t)\n{\n\treturn b1+(t-a1)*(b2-b1)/(a2-a1);\n}\n\n\nvec4 remap(float a1, float a2 ,float b1, float b2, vec4 t)\n{\n\treturn b1+(t-a1)*(b2-b1)/(a2-a1);\n}\n\n\n\n\n\nvec2 N(float angle) {\n    return vec2(sin(angle), cos(angle));\n}\n\nvoid sa_main()\n{\n//--------get soundtrack frequencies----\n\n\n    #ifdef MIC_INPUT\n\tfreqs[0] = texture(iChannel0, sa_fft(vec2( 0.01, 0.25 ))).x;\n\tfreqs[1] = texture(iChannel0, sa_fft(vec2( 0.07, 0.25 ))).x;\n\tfreqs[2] = texture(iChannel0, sa_fft(vec2( 0.15, 0.25 ))).x;\n\tfreqs[3] = texture(iChannel0, sa_fft(vec2( 0.30, 0.25 ))).x;\n    #else\n    freqs[0] = texture(iChannel0, sa_fft(vec2( 0.01, 0.25 ))).x;\n\tfreqs[1] = texture(iChannel0, sa_fft(vec2( 0.07, 0.25 ))).x;\n\tfreqs[2] = texture(iChannel0, sa_fft(vec2( 0.15, 0.25 ))).x;\n\tfreqs[3] = texture(iChannel0, sa_fft(vec2( 0.30, 0.25 ))).x;\n    #endif\n    float avgFreq = (freqs[0] +freqs[1] +freqs[2] +freqs[3])/4.;\n\n//--------image part---------\n    //vec2 uv = (fragCoord.xy-.5*resolution.xy)/resolution.y;\n    vec2 uv = -1. +2.*vUv;\n\tvec2 mouse = 1. - iMouse.xy/resolution.xy; // 0 1\n\tvec2 ouv = uv;\n    //uv.y -= .05;\n\n    uv = rot(uv,(sin(iTime*.1) / freqs[0]*.1  ) * PI  ) ;\n\tuv *= 4.0 - (avgFreq * 1.5  );\n\n    uv.x = abs(uv.x);\n\n    vec3 col = vec3(0);\n    float d;\n\n    float angle = 0.;\n    vec2 n = N((5./6.)*3.1415);\n\n    uv.y += tan((5./6.)*3.1415)*.5;\n   \td = dot(uv-vec2(.5, 0), n);\n    uv -= max(0.,d)*n*2.;\n\n    float scale = 1.;\n\n    n = N( freqs[0]*(2./3.)*3.1415);\n    uv.x += .5;\n    for(int i=0; i<10; i++) {\n        uv *= 3.;\n        scale *= 3.;\n        uv.x -= 1.5;\n\n        uv.x = abs(uv.x);\n        uv.x -= .5;\n        d = dot(uv, n);\n        uv -= min(0.,d)*n*2.;\n    }\n\n    d = length(uv/ clamp(freqs[2],0.1,.9 )- vec2(clamp(uv.x,-1., 1.), 0));\n    col += smoothstep(10./resolution.y, .0, d/scale);\n    uv /= scale;\t// normalization\n\n\n\tvec3 manCol = mandelbrotImg(uv);\n\t col += manCol;\n\n\n \t\t// vignette effect\n\t  col *= 1.0 - 0.5*length(uv *0.5) * freqs[1];\n\n\n    sa_FragColor = vec4( col,1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
