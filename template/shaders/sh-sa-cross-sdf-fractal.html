	<style>

		#shaderfx-canvas { display: block; width: 100vw; height: 100vh; }

<body>
	<canvas id="shaderfx-canvas"></canvas>
	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-cross-sdf-fractal","name":"Cross SDF fractal","common":"","passes":{"image":{"source":"// Cross SDF fractal — by bradjamesgrant\n// https://www.shadertoy.com/view/tssfz7\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/tssfz7\n// Created by bradjamesgrant\n// Modified by Arthur Tent\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n\nvec3 palette(float d, float intensity){\n    d = d/50.;\n    //return mix(vec3(.0,.2,.2),vec3(.8,.2,.5),1.-d)*3.5;\n    if(intensity<0.1)\n        return mix(vec3(.0,.0,.0),vec3(0.,.0,.0),1.-d)*3.5;\n    return mix(vec3(sin(iTime)+intensity*10.3*cos(iTime),.51+intensity*0.5,intensity+2.2*sin(iTime)),vec3(.8,.2,.5),1.-d)*3.5;\n}\nfloat rnd(vec2 p){\n\treturn fract(sin(p.x+100. + p.y*6574.)*45233.);\n}\n\nvec2 rotate(vec2 p, float a){\n\tfloat c = cos(a);\n    float s = sin(a);\n    return mat2(c,s,-s,c)*p;\n}\n\nfloat box(vec3 p, vec3 s, float intensity){\n\tp= abs(p)-s*intensity*4.;\n    return max(p.x*intensity,max(p.y,p.z));\n}\nfloat map(vec3 p, float intensity){\n    float t=iTime+385.;\n    //CHANGE TEMPO HERE\n     //t = t*1.59;\n    t = t*1.;\n    float tfract = fract(t);\n    tfract*=tfract;\n    t = floor(t) + tfract;\n    t = t*0.2;\n    for( int i = 0; i<13; ++i){\n\n        p.xz =rotate(p.xz,t);\n        p.xy =rotate(p.xy,t*1.89);\n        p.xz = abs(p.xz);\n        p.xz-=1.0;\n    }\n    vec3 q = p;\n    q.xy = rotate(p.xy,t*1000.*.02);//*p.x*30.; add artifacts\n    return min(box(p,vec3(2.,.5,.3), intensity),box(q,vec3(.5,2.,.3), intensity));\n}\n\n\n\n\nvec3 castRay (vec3 ro, vec3 rd){\n    float intensity = texture(iChannel0, sa_fft(vec2(0.25, 0.0))).r;\n\tfloat t=0.;\n    vec3 col = vec3(0.);\n    int i = 0;\n    for(i = 0; i<50; i++){\n    \tvec3 p = ro+t*rd*intensity;\n        float d = map(p,intensity)*.5*intensity;\n        if(d>200.)\n            break;\n        if(d<0.01){\n            d = 0.1+intensity*100.1;\n        }\n\n        t+=d;\n        col+=palette(float(i), intensity)*((0.005+intensity/200.)/(0.2+abs(d)));\n        //col+=palette(length(p))*0.005/(0.2+abs(d));\n\n    }\n    return col;\n\n}\n\nvoid sa_main()\n{\n    float intensity = texture(iChannel0, sa_fft(vec2(0.25, 0.0))).r;\n    //vec2 uv = (fragCoord-(iResolution.xy/2.))/iResolution.y;\n    vec2 uv = -1.+2.*vUv;\n\tvec3 ro = vec3(0.,0.,-40.);\n\tvec3 cf = normalize(-ro);\n    vec3 cs = normalize(cross(cf,vec3(0.,1.,0.)));\n    vec3 cu = normalize(cross(cf,cs));\n\n    vec3 uuv = ro+ cs*uv.x + cu*uv.y;\n\n   \tvec3 rd = uuv-ro*intensity*10.;\n\n    rd = normalize(vec3(-uv,1.));\n\n    vec3 col = castRay(ro,rd);\n\n    sa_FragColor = vec4(col,1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
	<script src="ShaderToyLite.js"></script>
	<script src="player.js"></script>
</body>
</html>
