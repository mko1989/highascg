	<script>window.__SHADERFX_CONFIG__ = {"id":"sh-sa-quicky-058","name":"大龙猫 - Quicky#058","common":"","passes":{"image":{"source":"// 大龙猫 - Quicky#058 — by totetmatt\n// https://www.shadertoy.com/view/fdcGRj\n// Ported to ShaderAmp (github.com/ArthurTent/ShaderAmp) by ArthurTent\n// License: Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License — https://creativecommons.org/licenses/by-nc-sa/3.0/\n// Converted for HighAsCG, WO-586 (iAudioData -> audio channel, main -> mainImage wrapper)\n\nvec4 sa_FragColor;\nvec2 sa_fft(vec2 p) { return vec2(p.x, 0.25); } // ShaderAmp FFT is one row\nivec2 sa_fftI(ivec2 p) { return ivec2(p.x, 0); }\n// https://www.shadertoy.com/view/fdcGRj\n// Modified by ArthurTent\n// Created by hunter\n// License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.\n// https://creativecommons.org/licenses/by-nc-sa/3.0/\nvec2 vUv;\n/*\n\n Blame @byt3_m3chanic for the abuse of LogPolar\n and djH0ffman for the overuse of good sounds :D\n\n Thanks folks !\n\n*/\n\n#define PI 3.141592\n#define fGlobalTime iTime\nvec2 logpol(vec2 uv){\n    return vec2(log((length(uv))),atan(uv.y,uv.x));\n }\nmat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}\nvoid sa_main()\n{\n    vec2 fragCoordFromUV = vUv * iResolution.xy;\n    // Normalized pixel coordinates (from 0 to 1)\n    vec2 uv = (2.0*fragCoordFromUV-iResolution.xy)/iResolution.y;\n    //vec2 uv = (fragCoord-.5*iResolution.xy)/iResolution.y;\n\n\n    vec3 col;\n\n\n  uv*=rot(fGlobalTime*.5);\n\n  uv = -logpol(uv)*3.0;\n\n  uv+=fGlobalTime*.5;\n  uv = asin(sin(uv));\n\n\n  uv = logpol(uv)*3.5*.5*texture(iChannel0, sa_fft(fract(vec2(.1)))).r; // A 2 c'est MIEUX :D\n\n  uv.x -=sqrt(texture(iChannel0, sa_fft(fract(vec2(.1)))).r*10.)*2.+fGlobalTime*1.0;\n  uv.y +=pow(fGlobalTime,1.2);\n  vec2 id = floor(uv);\n  uv = fract(uv)*2.-1.;\n  float d = length(uv)-.35-sin(id.x*3.+id.y*4.)*.2;\n  d/=3.5;\n  d = smoothstep(fwidth(d),0.,d);\n  d = d+abs(uv.x)-.1;\n    d = smoothstep(fwidth(d),-0.01,d);\n\n  col  = mod(length(floor(uv)),2.) == 0. ? 1.-vec3(d) :  vec3(d);\n    sa_FragColor = vec4(col,1.0);\n}\n\nvoid mainImage(out vec4 fragColor, in vec2 fragCoord) {\n\tvUv = fragCoord / iResolution.xy;\n\tsa_FragColor = vec4(0.0);\n\tsa_main();\n\tfragColor = sa_FragColor;\n}\n","channels":["audio",null,null,null]},"bufferA":null,"bufferB":null,"bufferC":null,"bufferD":null},"audio":{"enabled":true},"opts":{"alpha":false}}</script>
