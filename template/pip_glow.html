<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PIP Glow Overlay</title>
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body {
		width: 100%; height: 100%;
		overflow: visible;
		background: transparent !important;
	}
	#root {
		position: absolute;
		inset: 0;
		pointer-events: none;
		overflow: visible;
		opacity: var(--layer-o, 1);
	}
	.pip-frame {
		position: absolute;
		left: calc(var(--il) * 100%);
		top: calc(var(--it) * 100%);
		width: calc(var(--iw) * 100%);
		height: calc(var(--ih) * 100%);
		border-radius: var(--r, 0);
		pointer-events: none;
		box-sizing: border-box;
		overflow: visible;
		/* WO-220 H1: invisible background forces CEF to composite this element + its box-shadow (glow effect) */
		background: rgba(0, 0, 0, 0.002);
	}
	/* Shadow color rides currentColor so the secondary-color cycle can animate `color`. */
	.pip-frame.side-outside {
		box-shadow: 0 0 var(--i) var(--w) currentColor;
	}
	.pip-frame.side-inside {
		box-shadow: inset 0 0 var(--i) var(--w) currentColor;
	}
	.pip-svg {
		position: absolute;
		inset: 0;
		pointer-events: none;
	}
	.pip-frame.pulse, .pip-svg.pulse {
		animation: glow-pulse var(--ps, 2s) ease-in-out infinite alternate;
	}
	.pip-frame.cycle, .pip-svg.cycle {
		animation: glow-cycle var(--cs, 3s) ease-in-out infinite alternate;
	}
	.pip-frame.pulse.cycle, .pip-svg.pulse.cycle {
		animation:
			glow-pulse var(--ps, 2s) ease-in-out infinite alternate,
			glow-cycle var(--cs, 3s) ease-in-out infinite alternate;
	}
	@keyframes glow-pulse {
		0% { opacity: var(--min-o, 0.4); }
		100% { opacity: 1; }
	}
	@keyframes glow-cycle {
		0% { color: var(--c); }
		100% { color: var(--c2, var(--c)); }
	}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
	var root = document.getElementById('root')
	var state = {
		color: '#e63946',
		intensity: 15,
		width: 0,
		pulse: true,
		pulseSpeed: 2,
		minOpacity: 0.4,
		color2Enabled: false,
		color2: '#0aa5e5',
		colorCycleSec: 3,
		radius: 0,
		side: 'outside',
		opacity: 1,
		segmentation: 0,
		inner: null,
		slices: [],
		liveFile: null,
	}

	var livePollId = null
	var lastLiveRaw = ''

	function clamp01(x) {
		var n = Number(x)
		return isFinite(n) ? Math.max(0, Math.min(1, n)) : 0
	}

	function readInner(d) {
		if (!d || !d.inner || typeof d.inner !== 'object') return null
		return { l: clamp01(d.inner.l), t: clamp01(d.inner.t), w: clamp01(d.inner.w), h: clamp01(d.inner.h) }
	}

	function hasMargin(inn) {
		if (!inn) return false
		var w = inn.w != null ? inn.w : (inn.width != null ? inn.width : 0)
		var h = inn.h != null ? inn.h : (inn.height != null ? inn.height : 0)
		return w > 0 && h > 0
	}

	function normalizeSlice(s) {
		return {
			l: clamp01(s.x != null ? s.x : s.l),
			t: clamp01(s.y != null ? s.y : s.t),
			w: clamp01(s.w),
			h: clamp01(s.h),
		}
	}

	function activeSlices() {
		var slices = state.slices || []
		if (slices.length === 0 && state.inner && hasMargin(state.inner)) {
			return [state.inner]
		}
		return slices.map(normalizeSlice).filter(hasMargin)
	}

	function styleFrame(frame, inn) {
		if (!frame || !inn) return
		frame.style.setProperty('--il', String(inn.l))
		frame.style.setProperty('--it', String(inn.t))
		frame.style.setProperty('--iw', String(inn.w))
		frame.style.setProperty('--ih', String(inn.h))
		frame.style.setProperty('--i', state.intensity + 'px')
		frame.style.setProperty('--w', (state.width || 0) + 'px')
		frame.style.setProperty('--c', state.color)
		frame.style.setProperty('--c2', state.color2)
		frame.style.setProperty('--cs', (state.colorCycleSec > 0 ? state.colorCycleSec : 3) + 's')
		frame.style.color = state.color
		frame.style.setProperty('--ps', state.pulseSpeed + 's')
		frame.style.setProperty('--min-o', String(state.minOpacity))
		frame.style.setProperty('--r', (state.radius || 0) + 'px')

		frame.className = 'pip-frame side-' + (state.side || 'outside')
		/* pulseSpeed 0 = pulse effectively off (a 0s animation would strobe). */
		if (state.pulse && state.pulseSpeed > 0) frame.classList.add('pulse')
		if (state.color2Enabled && state.color2) frame.classList.add('cycle')

		if (state.segmentation > 0) {
			var s = state.segmentation * 4
			var gap = 5
			var step = 360 / s
			var mask = 'repeating-conic-gradient(from -' + (gap / 2) + 'deg, transparent 0deg, transparent ' + gap + 'deg, black ' + gap + 'deg, black ' + step + 'deg)'
			frame.style.maskImage = mask
			frame.style.webkitMaskImage = mask
		} else {
			frame.style.maskImage = ''
			frame.style.webkitMaskImage = ''
		}
	}

	var layoutKey = ''

	function sliceLayoutKey(slices) {
		var out = []
		for (var i = 0; i < slices.length; i++) {
			var s = slices[i]
			out.push([s.l, s.t, s.w, s.h].join(','))
		}
		return out.join('|')
	}

	/* WO-1064 — the server squeezes this page onto the overlay's rectangle (MIXER FILL), across and down by different
	 * amounts unless the rectangle has the canvas's shape: a box-shadow drawn in page pixels came out wider top and
	 * bottom than left and right (box 13.11, an 817×669 layer on 3072×1024: 16 px vs 40 px). A CSS transform cannot
	 * undo it — the browser blurs with ONE radius in device pixels whatever the transform (tried: sides right, top
	 * 2.5× too soft). So with `layerPx` (the rectangle's real pixel size) the glow is an SVG drawn pre-stretched:
	 * every length ×kx across and ×ky down, the blur with its own deviation per axis. 1 unit = 1 output pixel.
	 * The elements are made once and only re-attributed: an update (a followed layer moving) restarts no animation. */
	var svgEl = null
	var NS = 'http://www.w3.org/2000/svg'

	function rrect(x, y, w, h, rx, ry) {
		rx = Math.max(0, Math.min(rx, w / 2)); ry = Math.max(0, Math.min(ry, h / 2))
		if (!(rx > 0) || !(ry > 0)) return 'M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + -w + 'z'
		return 'M' + (x + rx) + ' ' + y + 'h' + (w - 2 * rx) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + rx + ' ' + ry + 'v' + (h - 2 * ry) +
			'a' + rx + ' ' + ry + ' 0 0 1 ' + -rx + ' ' + ry + 'h' + -(w - 2 * rx) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + -rx + ' ' + -ry +
			'v' + -(h - 2 * ry) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + rx + ' ' + -ry + 'z'
	}

	function renderSvg(inn) {
		var W = window.innerWidth || 1920
		var H = window.innerHeight || 1080
		var kx = W / state.layerPx.w
		var ky = H / state.layerPx.h
		if (!svgEl || !svgEl.parentNode) {
			root.innerHTML = '<div class="pip-svg"><svg xmlns="' + NS + '" width="100%" height="100%" style="position:absolute;left:0;top:0;overflow:visible">' +
				'<defs><filter id="gb" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur/></filter>' +
				'<mask id="gm" maskUnits="userSpaceOnUse"><path class="keep" fill="#fff" fill-rule="evenodd"/></mask></defs>' +
				'<g mask="url(#gm)"><path class="glow" fill="currentColor" fill-rule="evenodd" filter="url(#gb)"/></g></svg></div>'
			svgEl = root.querySelector('.pip-svg')
			layoutKey = ''
		}
		var x = inn.l * W, y = inn.t * H, w = inn.w * W, h = inn.h * H
		var r = Math.max(0, state.radius || 0), sp = Math.max(0, state.width || 0)
		var inside = String(state.side || 'outside') === 'inside'
		var page = 'M0 0h' + W + 'v' + H + 'h' + -W + 'z'
		var content = rrect(x, y, w, h, r * kx, r * ky)
		var glow, keep
		if (inside) {
			// everything but the content shrunk by the spread, blurred, shown inside the content only
			glow = 'M' + -W + ' ' + -H + 'h' + 3 * W + 'v' + 3 * H + 'h' + -3 * W + 'z' + rrect(x + sp * kx, y + sp * ky, Math.max(0, w - 2 * sp * kx), Math.max(0, h - 2 * sp * ky), Math.max(0, r - sp) * kx, Math.max(0, r - sp) * ky)
			keep = content
		} else {
			// the content grown by the spread, blurred, shown outside the content only (as a box-shadow is)
			glow = rrect(x - sp * kx, y - sp * ky, w + 2 * sp * kx, h + 2 * sp * ky, r > 0 ? (r + sp) * kx : 0, r > 0 ? (r + sp) * ky : 0)
			keep = page + content
		}
		var f = svgEl.querySelector('#gb')
		f.setAttribute('x', -W); f.setAttribute('y', -H); f.setAttribute('width', 3 * W); f.setAttribute('height', 3 * H)
		// a box-shadow blur radius B is a Gaussian of deviation B / 2
		f.firstChild.setAttribute('stdDeviation', (state.intensity / 2) * kx + ' ' + (state.intensity / 2) * ky)
		var m = svgEl.querySelector('#gm')
		m.setAttribute('x', 0); m.setAttribute('y', 0); m.setAttribute('width', W); m.setAttribute('height', H)
		svgEl.querySelector('.keep').setAttribute('d', keep)
		svgEl.querySelector('.glow').setAttribute('d', glow)
		svgEl.style.color = state.color
		svgEl.style.setProperty('--c', state.color)
		svgEl.style.setProperty('--c2', state.color2)
		svgEl.style.setProperty('--cs', (state.colorCycleSec > 0 ? state.colorCycleSec : 3) + 's')
		svgEl.style.setProperty('--ps', state.pulseSpeed + 's')
		svgEl.style.setProperty('--min-o', String(state.minOpacity))
		svgEl.classList.toggle('pulse', !!(state.pulse && state.pulseSpeed > 0))
		svgEl.classList.toggle('cycle', !!(state.color2Enabled && state.color2))
		var mask = ''
		if (state.segmentation > 0) {
			var gap = 5
			var step = 360 / (state.segmentation * 4)
			mask = 'repeating-conic-gradient(from -' + gap / 2 + 'deg at ' + (x + w / 2) + 'px ' + (y + h / 2) + 'px, transparent 0deg, transparent ' + gap + 'deg, black ' + gap + 'deg, black ' + step + 'deg)'
		}
		svgEl.style.maskImage = mask
		svgEl.style.webkitMaskImage = mask
	}

	function render() {
		root.style.setProperty('--layer-o', String(clamp01(state.opacity)))
		var slices = activeSlices()
		if (state.layerPx && slices.length === 1) return renderSvg(slices[0])
		svgEl = null
		var key = sliceLayoutKey(slices)
		var frames = root.querySelectorAll('.pip-frame')
		if (key !== layoutKey || frames.length !== slices.length) {
			root.innerHTML = ''
			slices.forEach(function () {
				var frame = document.createElement('div')
				frame.className = 'pip-frame'
				root.appendChild(frame)
			})
			layoutKey = key
			frames = root.querySelectorAll('.pip-frame')
		}
		for (var i = 0; i < slices.length; i++) {
			if (frames[i]) styleFrame(frames[i], slices[i])
		}
	}

	window['play'] = function () {}
	window['stop'] = function () {}
	window['next'] = function () {}

	function applyFromData(d) {
		if (!d) return
		if (d.color != null) state.color = String(d.color)
		if (d.intensity != null) state.intensity = parseFloat(d.intensity) || 15
		if (d.pulse != null) state.pulse = !!d.pulse
		if (d.pulseSpeed != null) { var psv = parseFloat(d.pulseSpeed); state.pulseSpeed = isFinite(psv) ? psv : 2 }
		if (d.color2Enabled != null) state.color2Enabled = !!d.color2Enabled
		if (d.color2 != null) state.color2 = String(d.color2)
		if (d.colorCycleSec != null) { var ccs = parseFloat(d.colorCycleSec); state.colorCycleSec = isFinite(ccs) && ccs > 0 ? ccs : 3 }
		if (d.minOpacity != null) state.minOpacity = parseFloat(d.minOpacity)
		if (d.radius != null) state.radius = parseFloat(d.radius) || 0
		if (d.side != null) state.side = String(d.side)
		if (d.width != null) state.width = parseFloat(d.width) || 0
		if (d.segmentation != null) state.segmentation = parseFloat(d.segmentation) || 0
		if (d.opacity != null) state.opacity = clamp01(parseFloat(d.opacity))
		state.inner = readInner(d)
		if (d.layerPx && d.layerPx.w > 0 && d.layerPx.h > 0) state.layerPx = { w: Number(d.layerPx.w), h: Number(d.layerPx.h) }
		if (Array.isArray(d.slices)) {
			state.slices = d.slices.map(function (s) {
				return {
					x: clamp01(s.x),
					y: clamp01(s.y),
					w: clamp01(s.w),
					h: clamp01(s.h),
				}
			})
		}
		render()
	}

	function pollLiveFile() {
		if (!state.liveFile) return
		var xhr = new XMLHttpRequest()
		xhr.open('GET', state.liveFile + '?_=' + Date.now(), true)
		xhr.onload = function () {
			if (xhr.status !== 200 && xhr.status !== 0) return
			if (xhr.responseText === lastLiveRaw) return
			lastLiveRaw = xhr.responseText
			try {
				applyFromData(JSON.parse(xhr.responseText))
			} catch (e) { console.warn('pip_glow live:', e) }
		}
		xhr.send(null)
	}

	function ensureLivePoll(file) {
		if (file) state.liveFile = String(file)
		if (!state.liveFile) return
		if (!livePollId) {
			livePollId = setInterval(pollLiveFile, 33)
			pollLiveFile()
		}
	}

	window['update'] = function (raw) {
		try {
			var d = typeof raw === 'string' ? JSON.parse(raw.replace(/\\"/g, '"').replace(/^"|"$/g, '')) : raw
			if (d.liveFile) ensureLivePoll(d.liveFile)
			applyFromData(d)
		} catch (e) { console.warn('pip_glow update:', e) }
	}

	render()
})()
</script>
</body>
</html>
