<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Multiview master</title>
	<style>
		@font-face {
			font-family: 'Rewir';
			src: url('fonts/Rewir-Light.woff') format('woff');
			font-weight: 300;
			font-style: normal;
			font-display: swap;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: transparent !important;
			font-family: 'Rewir', system-ui, sans-serif;
		}
		#cv {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			display: block;
		}
	</style>
</head>
<body>
	<canvas id="cv" width="1920" height="1080"></canvas>
	<script src="multiview-playback-osc.js"></script>
	<script>
		const W = 1920;
		const H = 1080;
		const canvas = document.getElementById('cv');
		const ctx = canvas.getContext('2d', { alpha: true });

		let ws = null;
		let oscState = { channels: {}, updatedAt: 0 };
		let lastWsMessageAt = 0;
		let resyncRequestedAt = 0;
		let channelMap = { programChannels: [], programResolutions: [] };
		let sceneLive = {};
		let programLayerBankByChannel = {};
		let cellsConfig = [];
		let showTimersUnderLabels = false;
		let timerScale = 1; // WO-203: timerScale/100 from CG payload
		let highlightTopTimer = true; // WO-203 §5

		function mergeChannel(a, b) {
			if (!b) return a;
			if (!a) return b;
			const o = { ...a, ...b };
			if (b.layers || a.layers) {
				o.layers = { ...(a.layers || {}) };
				for (const k of Object.keys(b.layers || {})) {
					const aL = a.layers && a.layers[k] ? a.layers[k] : {};
					const bL = b.layers[k];
					const merged = { ...aL, ...bL };
					if (aL.file && bL.file && typeof aL.file === 'object' && typeof bL.file === 'object') {
						merged.file = { ...aL.file, ...bL.file };
					}
					o.layers[k] = merged;
				}
			}
			return o;
		}

		function connect() {
			const host = window.location.hostname || '127.0.0.1';
			const port = window.location.port || '4200';
			const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
			ws = new WebSocket(proto + '//' + host + ':' + port + '/api/ws');
			ws.onclose = () => setTimeout(connect, 2000);
			ws.onmessage = (ev) => {
				try {
					lastWsMessageAt = Date.now();
					const msg = JSON.parse(ev.data);
					if (msg.type === 'state') {
						if (msg.data?.osc?.channels) {
							oscState.channels = msg.data.osc.channels;
							if (msg.data.osc.updatedAt) oscState.updatedAt = msg.data.osc.updatedAt;
						}
						if (msg.data?.channelMap) channelMap = msg.data.channelMap;
						if (msg.data?.scene) {
							sceneLive = msg.data.scene.live || {};
							programLayerBankByChannel = msg.data.scene.programLayerBankByChannel || {};
						}
					} else if (msg.type === 'osc') {
						if (msg.data?.channels) {
							if (msg.data.delta) {
								for (const k of Object.keys(msg.data.channels)) {
									oscState.channels[k] = mergeChannel(oscState.channels[k], msg.data.channels[k]);
								}
							} else {
								oscState.channels = msg.data.channels;
							}
							if (msg.data.updatedAt) oscState.updatedAt = msg.data.updatedAt;
						}
					} else if (msg.type === 'change') {
						if (msg.data?.path === 'scene.live') sceneLive = msg.data.value || {};
						else if (msg.data?.path === 'scene.programLayerBankByChannel') {
							programLayerBankByChannel = msg.data.value || {};
						}
					}
				} catch (e) {
					console.error('Multiview master WS:', e);
				}
			};
		}
		connect();

		/**
		 * WS liveness watchdog: the server pushes `osc` at least every ~50 ms while Caspar emits OSC,
		 * so silence means a stalled/half-open socket (server restart, network blip) — the exact
		 * "timers frozen at an old state" failure (WO-151 B151.2). Ask for a resync after 12 s;
		 * force-reconnect after 30 s (onclose triggers connect()).
		 */
		setInterval(() => {
			if (!ws || ws.readyState !== WebSocket.OPEN || !lastWsMessageAt) return;
			const silentMs = Date.now() - lastWsMessageAt;
			if (silentMs > 30000) {
				try { ws.close(); } catch (e) { /* onclose reconnects */ }
			} else if (silentMs > 12000 && Date.now() - resyncRequestedAt > 12000) {
				resyncRequestedAt = Date.now();
				try { ws.send(JSON.stringify({ type: 'osc_resync' })); } catch (e) { /* watchdog will close */ }
			}
		}, 5000);

		function formatMmSs(sec) {
			if (!Number.isFinite(sec) || sec < 0) return '0:00';
			const m = Math.floor(sec / 60);
			const s = Math.floor(sec % 60);
			return `${m}:${String(s).padStart(2, '0')}`;
		}

		function getScreenLabelForChannel(chNum) {
			if (channelMap && Array.isArray(channelMap.programChannels)) {
				const idx = channelMap.programChannels.indexOf(chNum);
				if (idx !== -1) return `Screen ${idx + 1}`;
			}
			return `Ch ${chNum}`;
		}


		function getActiveScenes() {
			const list = [];
			if (channelMap && Array.isArray(channelMap.programChannels)) {
				channelMap.programChannels.forEach((chNum) => {
					const entry = sceneLive[String(chNum)] || sceneLive[chNum];
					if (entry?.scene) list.push(entry.scene);
				});
			}
			return list;
		}

		function getDynamicCellLabel(cell) {
			if ((cell.type === 'pgm' || cell.type === 'prv') && typeof cell.screenIdx === 'number') {
				if (channelMap && channelMap.virtualMainChannels && channelMap.virtualMainChannels[cell.screenIdx] && channelMap.virtualMainChannels[cell.screenIdx].name) {
					const name = channelMap.virtualMainChannels[cell.screenIdx].name;
					return `${cell.type === 'pgm' ? 'PGM' : 'PRV'} · ${name}`;
				}
			}
			return cell.label || '';
		}

		function colorsForType(t) {
			if (t === 'pgm') return { border: '#e63946', solid: '#c92a2a', prog: '#ffffff' };
			if (t === 'prv') return { border: '#2a9d8f', solid: '#0d9488', prog: '#a7f3d0' };
			return { border: '#457b9d', solid: '#2563eb', prog: '#ffffff' };
		}

		function cellRectPx(cell) {
			return {
				x: (cell.x || 0) * W,
				y: (cell.y || 0) * H,
				w: Math.max(1, (cell.w || 0) * W),
				h: Math.max(1, (cell.h || 0) * H),
			};
		}

		function resolvePlaybackCh(cell) {
			const chNum = cell.channelNum;
			const screenIdx = cell.screenIdx;
			let resolvedChNum = chNum;
			if (cell.type === 'pgm') {
				const bank = programLayerBankByChannel?.[String(chNum)] || 'a';
				const activeCh =
					channelMap.transitionModel === 'switcher_bus'
						? bank === 'b'
							? channelMap.switcherBusChannels?.[screenIdx]
							: channelMap.switcherBus1Channels?.[screenIdx]
						: chNum;
				resolvedChNum = activeCh || chNum;
			}
			return resolvedChNum;
		}

		function fillTruncatedLine(text, x, y, maxW, padL, padR, font) {
			const max = maxW - padL - padR;
			let t = String(text);
			ctx.font = font || '500 10px Rewir, system-ui, sans-serif';
			ctx.textBaseline = 'middle';
			while (t.length > 3 && ctx.measureText(t).width > max) t = t.slice(0, -2) + '…';
			ctx.fillText(t, x + padL, y);
		}

		function drawCenteredTitle(text, x, y, w, h) {
			ctx.font = '600 11px Rewir, system-ui, sans-serif';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			let t = String(text || '');
			while (t.length > 3 && ctx.measureText(t).width > w - 12) t = t.slice(0, -2) + '…';
			ctx.fillStyle = '#fff';
			ctx.fillText(t, x + w / 2, y + h / 2);
			ctx.textAlign = 'left';
			ctx.textBaseline = 'alphabetic';
		}

		function roundRectPath(x, y, rw, rh, r) {
			const rr = Math.min(r, rw / 2, rh / 2);
			ctx.beginPath();
			ctx.moveTo(x + rr, y);
			ctx.arcTo(x + rw, y, x + rw, y + rh, rr);
			ctx.arcTo(x + rw, y + rh, x, y + rh, rr);
			ctx.arcTo(x, y + rh, x, y, rr);
			ctx.arcTo(x, y, x + rw, y, rr);
			ctx.closePath();
		}

		// Check if a source path matches the pip template family (WO-195.1)
		function isPipTemplateSource(sourceValue) {
			if (!sourceValue) return false;
			const src = String(sourceValue).toLowerCase();
			// Match pip_border/pip-border, pip_shadow/pip-shadow, etc.
			return /\b(pip_border|pip-border|pip_shadow|pip-shadow|pip_edge_strip|pip-edge-strip|pip_glow|pip-glow|pip_router|pip-router)\b/i.test(src);
		}

		// Extract basename without extension from a source path
		function getSourceBasename(sourceValue) {
			if (!sourceValue) return '';
			const src = String(sourceValue);
			const parts = src.split(/[/\\]/);
			const last = parts[parts.length - 1] || '';
			return last.replace(/\.[^.]*$/, ''); // Remove extension
		}

		// WO-223: Map route:// sources to friendly channel/screen labels
		// keep in parity with template/multiview_overlay.js
		function friendlyRouteLabel(sourceValue, channelMap) {
			if (!sourceValue) return '';
			const src = String(sourceValue);
			// Check if this is a route:// source
			if (!src.startsWith('route://')) return '';

			// Parse route://N or route://N-L
			const routePart = src.substring(8); // Remove 'route://'
			const parts = routePart.split('-');
			const channelNum = parseInt(parts[0], 10);
			const layerNum = parts.length > 1 ? parseInt(parts[1], 10) : null;

			if (!Number.isFinite(channelNum)) return '';

			// Check if channelNum is in programChannels
			if (channelMap && Array.isArray(channelMap.programChannels)) {
				const idx = channelMap.programChannels.indexOf(channelNum);
				if (idx !== -1) {
					const screenLabel = channelMap.screenLabels?.[idx] || `PGM${idx + 1}`;
					return screenLabel;
				}
			}

			// Check if channelNum is in previewChannels
			if (channelMap && Array.isArray(channelMap.previewChannels)) {
				const idx = channelMap.previewChannels.indexOf(channelNum);
				if (idx !== -1) {
					return `PRV${idx + 1}`;
				}
			}

			// Fallback: return 'Route ch N'
			return `Route ch ${channelNum}`;
		}

		// WO-212: Build playlist-aware row label (current -> next) when autoplay enabled
		// keep in parity with template/multiview_overlay.js
		function buildPlaylistRowLabel(num, layer, oscPlayingName, getSourceBasename, friendlyRouteLabel, channelMap) {
			if (layer.sourceMode !== 'list' || !Array.isArray(layer.playlist) || layer.playlist.length <= 1 || layer.playlistAdvance === 'manual') {
				const sourceValue = layer.source?.value;
				let basename = friendlyRouteLabel(sourceValue, channelMap) || getSourceBasename(sourceValue);
				return basename ? `L${num} ${basename}` : `L${num}`;
			}
			// Playlist with autoplay: compute current -> next
			const testName = String(oscPlayingName || getSourceBasename(layer.playlist[0]?.value) || '').toLowerCase();
			let idxOfCurrent = 0;
			for (let i = 0; i < layer.playlist.length; i++) {
				const itemBase = getSourceBasename(layer.playlist[i]?.value);
				if (itemBase && testName && itemBase.toLowerCase() === testName) {
					idxOfCurrent = i;
					break;
				}
			}
			// If no match found, fallback to first item
			const currentValue = layer.playlist[idxOfCurrent]?.value;
			const current = friendlyRouteLabel(currentValue, channelMap) || getSourceBasename(currentValue);
			const isLastItem = idxOfCurrent === layer.playlist.length - 1;
			const hasNext = !(isLastItem && layer.playlistLoop === false);
			let label = `L${num} ${current}`;
			if (hasNext) {
				const nextIdx = (idxOfCurrent + 1) % layer.playlist.length;
				const nextValue = layer.playlist[nextIdx]?.value;
				const next = friendlyRouteLabel(nextValue, channelMap) || getSourceBasename(nextValue);
				label += ` -> ${next}`;
			}
			return label;
		}

		function collectLayerLines(cell, resolvedChNum, screenIdx, chNum, isPgm) {
			const rows = [];
			const activeScenes = getActiveScenes();
			for (const scene of activeScenes) {
				if (!Array.isArray(scene.layers)) continue;
				for (const layer of scene.layers) {
					const num = Number(layer.layerNumber);
					const sourceValue = layer.source?.value;
					if (sourceValue && sourceValue.includes('playback_timers.html')) continue;
					// Skip pip decoration templates (WO-195.1)
					if (isPipTemplateSource(sourceValue)) continue;
					let lookScreenIdx = 0;
					if (/^[0-3]$/.test(String(scene.mainScope))) lookScreenIdx = parseInt(scene.mainScope, 10);
					else if (channelMap.programChannels) {
						for (let i = 0; i < channelMap.programChannels.length; i++) {
							const entry = sceneLive[String(channelMap.programChannels[i])] || sceneLive[channelMap.programChannels[i]];
							if (entry?.sceneId === scene.id) {
								lookScreenIdx = i;
								break;
							}
						}
					}
					if (lookScreenIdx !== screenIdx) continue;
					// PGM: bank-mapped physical; PRV has no banks — logical = physical (WO-195.4)
					const bank = programLayerBankByChannel?.[String(chNum)] || 'a';
					const pLayer = isPgm && bank === 'b' ? num + 100 : num;
					const chOsc = oscState.channels[String(resolvedChNum)] || oscState.channels[resolvedChNum];
					let layerOsc = chOsc?.layers?.[pLayer] || chOsc?.layers?.[String(pLayer)];
					const isStale = layerOsc && window.mvPlaybackOsc?.isStaleOscPlaybackLayer?.(layerOsc, oscState.updatedAt);
					if (isStale) layerOsc = null;
					let lFile = layerOsc?.file || {};
					const elapsed = lFile.elapsed ?? 0;
					const duration = lFile.duration ?? 0;
					// Strict runtime guard: digits+bar only when Number.isFinite(duration) && duration > 0 && !stale (WO-195.3)
					const hasRuntime = Number.isFinite(duration) && duration > 0 && !isStale;
					// WO-212: Playlist-aware label, OSC playing file available here
					const oscPlayingName = lFile.name || lFile.path ? getSourceBasename(lFile.name || lFile.path) : null;
					const layerLabel = buildPlaylistRowLabel(num, layer, oscPlayingName, getSourceBasename, friendlyRouteLabel, channelMap);
					rows.push({
						num,
						hasRuntime,
						elapsed,
						duration,
						label: layerLabel
					});
				}
			}
			// Sort descending by layer number
			rows.sort((a, b) => b.num - a.num);
			return rows;
		}

		function redraw() {
			ctx.clearRect(0, 0, W, H);
			ctx.save();
			for (const cell of cellsConfig) {
				if (cell.type === 'timers') continue;
				const r = cellRectPx(cell);
				const c = colorsForType(cell.type);
				ctx.lineWidth = 3;
				ctx.strokeStyle = c.border;
				ctx.strokeRect(r.x + 1.5, r.y + 1.5, r.w - 3, r.h - 3);

				const lx = (cell.labelX ?? cell.x) * W;
				const ly = (cell.labelY ?? (cell.y + cell.h)) * H;
				const lw = (cell.labelW ?? cell.w) * W;
				const lh = (cell.labelH ?? 0) * H;

				const frac = typeof cell.chromeBottomFrac === 'number' && cell.chromeBottomFrac > 0 ? cell.chromeBottomFrac : 0.035;
				const chromeH = lh > 0 ? lh : r.h * frac;
				const titleBarH = Math.min(34, Math.max(22, Math.floor(chromeH * 0.36)));

				const isScreen = cell.type === 'pgm' || cell.type === 'prv';
				const useTimers = isScreen && showTimersUnderLabels && cell.channelNum != null;

				if (!useTimers) {
					const solidH = lh > 0 ? lh : titleBarH;
					ctx.fillStyle = c.solid;
					ctx.fillRect(lx, ly, lw, solidH);
					drawCenteredTitle(getDynamicCellLabel(cell), lx, ly, lw, solidH);
					continue;
				}

				const resolvedChNum = resolvePlaybackCh(cell);
				const isPgm = cell.type === 'pgm';

				ctx.fillStyle = c.solid;
				ctx.fillRect(lx, ly, lw, titleBarH);
				drawCenteredTitle(getDynamicCellLabel(cell), lx, ly, lw, titleBarH);

				const pad = 8;
				const dockW = Math.max(80, lw - 2 * pad);
				const dockX = lx + pad;
				const dockY = ly + titleBarH;
				const dockH = chromeH - titleBarH;
				if (dockH > 12) {
					let ty = dockY + 14;
					ctx.textBaseline = 'middle';
					ctx.fillStyle = '#f1f5f9';
					ctx.font = '500 9px Rewir, system-ui, sans-serif';
					const layerRows = collectLayerLines(cell, resolvedChNum, cell.screenIdx, cell.channelNum, isPgm);
					const maxY = ly + chromeH - 4;
					// WO-203/204: scale row typography/bars; §5 highlight the top running-media row
					const rowFont = Math.round(18 * timerScale);
					const timeFont = Math.round(16 * timerScale);
					const barH = Math.max(2, Math.round(6 * timerScale));
					const textRowH = Math.round(22 * timerScale);
					const topRuntimeNum = highlightTopTimer
						? (layerRows.find((r) => r.hasRuntime && Number(r.duration) > 0)?.num ?? null)
						: null;
					for (const row of layerRows) {
						// T250.2 (WO-250): the bar for a runtime row is reserved INSIDE this row's own
						// budget (text + bar + gap), not a further `textRowH` below it — that used to
						// draw the bar into the NEXT row's space, so on short docks / >=2 rows the bar
						// silently clipped (`ty + 2 <= maxY` failed) even though the digits above it
						// still fit under `maxY`. Gating on the full per-row step up front means a row
						// is only started when its bar (if it has one) will also fit — digits and bar
						// always render together.
						const hasBar = row.hasRuntime && Number(row.duration) > 0;
						const rowStep = hasBar ? textRowH + barH + 2 : textRowH;
						if (ty + rowStep > maxY) break;
						const isTop = topRuntimeNum != null && row.num === topRuntimeNum;

						// WO-204.1: Draw highlight chip background for top row
						if (isTop) {
							ctx.globalAlpha = 0.28;
							ctx.fillStyle = '#e63946';
							ctx.fillRect(dockX + pad - 3, ty, dockW - pad * 2 + 6, rowFont + 4);
							ctx.globalAlpha = 1;
						}

						ctx.fillStyle = '#fff';
						ctx.font = `${isTop ? 700 : 600} ${rowFont}px Rewir, system-ui, sans-serif`;
						ctx.textBaseline = 'middle';
						ctx.textAlign = 'left';

						// WO-204.4: Measure time text and truncate label
						let labelText = row.label;
						if (hasBar) {
							const rem = Number.isFinite(row.duration) && row.duration > 0 ? Math.max(0, row.duration - row.elapsed) : 0;
							const timeText = `${formatMmSs(row.elapsed)}/${formatMmSs(row.duration)} (-${formatMmSs(rem)})`;
							ctx.font = `500 ${timeFont}px Rewir, system-ui, sans-serif`;
							const timeW = ctx.measureText(timeText).width;
							const maxLabelW = dockW - pad * 2 - timeW - 6;

							// Truncate label if needed
							ctx.font = `${isTop ? 700 : 600} ${rowFont}px Rewir, system-ui, sans-serif`;
							while (labelText.length > 3 && ctx.measureText(labelText).width > maxLabelW) {
								labelText = labelText.slice(0, -2) + '…';
							}
						} else {
							// No time text, label can use most of the width
							const maxLabelW = dockW - pad * 2 - 6;
							while (labelText.length > 3 && ctx.measureText(labelText).width > maxLabelW) {
								labelText = labelText.slice(0, -2) + '…';
							}
						}

						ctx.fillText(labelText, dockX + pad, ty + 8);

						if (hasBar) {
							const rem = Number.isFinite(row.duration) && row.duration > 0 ? Math.max(0, row.duration - row.elapsed) : 0;
							const timeText = `${formatMmSs(row.elapsed)}/${formatMmSs(row.duration)} (-${formatMmSs(rem)})`;
							ctx.font = `500 ${timeFont}px Rewir, system-ui, sans-serif`;
							ctx.textAlign = 'right';
							ctx.fillText(timeText, dockX + dockW - pad, ty + 8);
							// Bar sits immediately under the text, INSIDE the row's own reserved height
							// (`rowStep` above already accounts for it) — not a further `textRowH` below.
							const barY = ty + textRowH;
							const thisBarH = isTop ? barH + 1 : barH;
							ctx.fillStyle = 'rgba(255,255,255,0.25)';
							ctx.fillRect(dockX + pad, barY, dockW - pad * 2, thisBarH);
							const pct = Number(row.duration) > 0 ? Math.min(100, Math.max(0, (row.elapsed / row.duration) * 100)) : 0;
							ctx.fillStyle = isTop ? '#ffc078' : c.prog;
							ctx.fillRect(dockX + pad, barY, ((dockW - pad * 2) * pct) / 100, thisBarH);
						}
						ty += rowStep;
					}
					ctx.textBaseline = 'alphabetic';
				}
			}
			ctx.restore();
		}

		setInterval(redraw, 150);

		window['play'] = function () {};

		function update(raw) {
			let data;
			try {
				if (typeof raw === 'string') {
					let s = raw.trim();
					if (!s) return;
					if (s.indexOf('\\"') !== -1) s = s.replace(/\\"/g, '"');
					if (s.charAt(0) === '"' && s.length > 1 && s.charAt(s.length - 1) === '"') s = s.slice(1, -1);
					if (s.charAt(0) === '"') {
						s = s.slice(1).replace(/\\"/g, '"');
						s = s.replace(/"\s*$/, '');
					}
					data = JSON.parse(s);
				} else if (raw && typeof raw === 'object') {
					data = raw;
				} else return;
			} catch (e) {
				console.error('Multiview master update:', e);
				return;
			}
			cellsConfig = data?.cells || [];
			showTimersUnderLabels = !!data?.showTimersUnderLabels;
			{
				const tsRaw = Number(data?.timerScale);
				timerScale = Number.isFinite(tsRaw) ? Math.min(300, Math.max(50, tsRaw)) / 100 : 1; // WO-203
				highlightTopTimer = data?.highlightTopTimer !== false; // WO-203 §5 default true
			}
			redraw();
		}
		window['update'] = update;

		if (document.fonts && document.fonts.ready) {
			document.fonts.ready.then(redraw).catch(() => redraw());
		}
	</script>
</body>
</html>
