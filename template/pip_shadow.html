<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PIP Shadow Overlay</title>
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body {
		width: 100%; height: 100%;
		overflow: visible;
		background: transparent !important;
	}
	#root {
		position: absolute;
		inset: 0;
		pointer-events: none;
		overflow: visible;
	}
	.pip-frame {
		position: absolute;
		left: calc(var(--il) * 100%);
		top: calc(var(--it) * 100%);
		width: calc(var(--iw) * 100%);
		height: calc(var(--ih) * 100%);
		border-radius: var(--r, 0);
		pointer-events: none;
		box-sizing: border-box;
		overflow: visible;
		opacity: var(--o, 1);
		/* WO-220 H1: invisible background forces CEF to composite this element + its box-shadow */
		background: rgba(0, 0, 0, 0.002);
	}
	.pip-frame.side-outside {
		box-shadow: var(--ox) var(--oy) var(--b) var(--s) var(--c);
	}
	.pip-frame.side-inside {
		box-shadow: inset var(--ox) var(--oy) var(--b) var(--s) var(--c);
	}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
	var root = document.getElementById('root')
	var state = {
		blur: 20,
		offsetX: 5,
		offsetY: 5,
		color: 'rgba(0,0,0,0.6)',
		spread: 0,
		radius: 0,
		side: 'outside',
		opacity: 1,
		inner: null,
		slices: [],
		liveFile: null,
	}

	var livePollId = null
	var lastLiveRaw = ''

	function clamp01(x) {
		var n = Number(x)
		return isFinite(n) ? Math.max(0, Math.min(1, n)) : 0
	}

	function readInner(d) {
		if (!d || !d.inner || typeof d.inner !== 'object') return null
		return { l: clamp01(d.inner.l), t: clamp01(d.inner.t), w: clamp01(d.inner.w), h: clamp01(d.inner.h) }
	}

	function hasMargin(inn) {
		if (!inn) return false
		var w = inn.w != null ? inn.w : 0
		var h = inn.h != null ? inn.h : 0
		return w > 0 && h > 0
	}

	function normalizeSlice(s) {
		return {
			l: clamp01(s.x != null ? s.x : s.l),
			t: clamp01(s.y != null ? s.y : s.t),
			w: clamp01(s.w),
			h: clamp01(s.h),
		}
	}

	function activeSlices() {
		var slices = state.slices || []
		if (slices.length === 0 && state.inner && hasMargin(state.inner)) {
			return [state.inner]
		}
		return slices.map(normalizeSlice).filter(hasMargin)
	}

	function styleFrame(frame, inn) {
		if (!frame || !inn) return
		frame.style.setProperty('--il', String(inn.l))
		frame.style.setProperty('--it', String(inn.t))
		frame.style.setProperty('--iw', String(inn.w))
		frame.style.setProperty('--ih', String(inn.h))
		frame.style.setProperty('--b', state.blur + 'px')
		frame.style.setProperty('--ox', state.offsetX + 'px')
		frame.style.setProperty('--oy', state.offsetY + 'px')
		frame.style.setProperty('--s', state.spread + 'px')
		frame.style.setProperty('--c', state.color)
		frame.style.setProperty('--r', (state.radius || 0) + 'px')
		frame.style.setProperty('--o', String(clamp01(state.opacity)))
		frame.className = 'pip-frame side-' + (state.side || 'outside')
	}

	var layoutKey = ''

	function sliceLayoutKey(slices) {
		var out = []
		for (var i = 0; i < slices.length; i++) {
			var s = slices[i]
			out.push([s.l, s.t, s.w, s.h].join(','))
		}
		return out.join('|')
	}

	/* WO-1064 — as pip_glow.html: the server squeezes this page onto the overlay's rectangle by different amounts across
	 * and down, and a box-shadow's blur cannot be pre-stretched (one radius in device pixels whatever the transform).
	 * With `layerPx` (the rectangle's real pixel size) the shadow is an SVG drawn pre-stretched: lengths ×kx across and
	 * ×ky down, the blur with its own deviation per axis. Made once, re-attributed on updates. */
	var svgEl = null
	var NS = 'http://www.w3.org/2000/svg'

	function rrect(x, y, w, h, rx, ry) {
		rx = Math.max(0, Math.min(rx, w / 2)); ry = Math.max(0, Math.min(ry, h / 2))
		if (!(rx > 0) || !(ry > 0)) return 'M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + -w + 'z'
		return 'M' + (x + rx) + ' ' + y + 'h' + (w - 2 * rx) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + rx + ' ' + ry + 'v' + (h - 2 * ry) +
			'a' + rx + ' ' + ry + ' 0 0 1 ' + -rx + ' ' + ry + 'h' + -(w - 2 * rx) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + -rx + ' ' + -ry +
			'v' + -(h - 2 * ry) + 'a' + rx + ' ' + ry + ' 0 0 1 ' + rx + ' ' + -ry + 'z'
	}

	function renderSvg(inn) {
		var W = window.innerWidth || 1920
		var H = window.innerHeight || 1080
		var kx = W / state.layerPx.w
		var ky = H / state.layerPx.h
		if (!svgEl || !svgEl.parentNode) {
			root.innerHTML = '<div class="pip-svg" style="position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none"><svg xmlns="' + NS + '" width="100%" height="100%" style="position:absolute;left:0;top:0;overflow:visible">' +
				'<defs><filter id="sb" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur/></filter>' +
				'<mask id="sm" maskUnits="userSpaceOnUse"><path class="keep" fill="#fff" fill-rule="evenodd"/></mask></defs>' +
				'<g mask="url(#sm)"><path class="shade" fill-rule="evenodd" filter="url(#sb)"/></g></svg></div>'
			svgEl = root.querySelector('.pip-svg')
			layoutKey = ''
		}
		var x = inn.l * W, y = inn.t * H, w = inn.w * W, h = inn.h * H
		var r = Math.max(0, state.radius || 0), sp = Number(state.spread) || 0
		var ox = (Number(state.offsetX) || 0) * kx, oy = (Number(state.offsetY) || 0) * ky
		var inside = String(state.side || 'outside') === 'inside'
		var content = rrect(x, y, w, h, r * kx, r * ky)
		var shade, keep
		if (inside) {
			// everything but the content (moved by the offset, shrunk by the spread), blurred, shown inside the content only
			shade = 'M' + -W + ' ' + -H + 'h' + 3 * W + 'v' + 3 * H + 'h' + -3 * W + 'z' +
				rrect(x + ox + sp * kx, y + oy + sp * ky, Math.max(0, w - 2 * sp * kx), Math.max(0, h - 2 * sp * ky), Math.max(0, r - sp) * kx, Math.max(0, r - sp) * ky)
			keep = content
		} else {
			// the content moved by the offset and grown by the spread, blurred, shown outside the content only
			shade = rrect(x + ox - sp * kx, y + oy - sp * ky, Math.max(0, w + 2 * sp * kx), Math.max(0, h + 2 * sp * ky), r > 0 ? Math.max(0, r + sp) * kx : 0, r > 0 ? Math.max(0, r + sp) * ky : 0)
			keep = 'M0 0h' + W + 'v' + H + 'h' + -W + 'z' + content
		}
		var f = svgEl.querySelector('#sb')
		f.setAttribute('x', -W); f.setAttribute('y', -H); f.setAttribute('width', 3 * W); f.setAttribute('height', 3 * H)
		var b = Math.max(0, Number(state.blur) || 0)
		f.firstChild.setAttribute('stdDeviation', (b / 2) * kx + ' ' + (b / 2) * ky) // a box-shadow blur B is a Gaussian of deviation B / 2
		var m = svgEl.querySelector('#sm')
		m.setAttribute('x', 0); m.setAttribute('y', 0); m.setAttribute('width', W); m.setAttribute('height', H)
		svgEl.querySelector('.keep').setAttribute('d', keep)
		var sh = svgEl.querySelector('.shade')
		sh.setAttribute('d', shade)
		sh.style.fill = state.color
		svgEl.style.opacity = String(clamp01(state.opacity))
	}

	function render() {
		var slices = activeSlices()
		if (state.layerPx && slices.length === 1) return renderSvg(slices[0])
		svgEl = null
		var key = sliceLayoutKey(slices)
		var frames = root.querySelectorAll('.pip-frame')
		if (key !== layoutKey || frames.length !== slices.length) {
			root.innerHTML = ''
			slices.forEach(function () {
				var frame = document.createElement('div')
				frame.className = 'pip-frame'
				root.appendChild(frame)
			})
			layoutKey = key
			frames = root.querySelectorAll('.pip-frame')
		}
		for (var i = 0; i < slices.length; i++) {
			if (frames[i]) styleFrame(frames[i], slices[i])
		}
	}

	window['play'] = function () {}
	window['stop'] = function () {}
	window['next'] = function () {}

	function applyFromData(d) {
		if (!d) return
		if (d.blur != null) state.blur = parseFloat(d.blur) || 0
		if (d.offsetX != null) state.offsetX = parseFloat(d.offsetX) || 0
		if (d.offsetY != null) state.offsetY = parseFloat(d.offsetY) || 0
		if (d.color != null) state.color = String(d.color)
		if (d.spread != null) state.spread = parseFloat(d.spread) || 0
		if (d.radius != null) state.radius = parseFloat(d.radius) || 0
		if (d.side != null) state.side = String(d.side)
		if (d.opacity != null) state.opacity = clamp01(parseFloat(d.opacity))
		state.inner = readInner(d)
		if (d.layerPx && d.layerPx.w > 0 && d.layerPx.h > 0) state.layerPx = { w: Number(d.layerPx.w), h: Number(d.layerPx.h) }
		if (Array.isArray(d.slices)) {
			state.slices = d.slices.map(function (s) {
				return {
					x: clamp01(s.x),
					y: clamp01(s.y),
					w: clamp01(s.w),
					h: clamp01(s.h),
				}
			})
		}
		render()
	}

	function pollLiveFile() {
		if (!state.liveFile) return
		var xhr = new XMLHttpRequest()
		xhr.open('GET', state.liveFile + '?_=' + Date.now(), true)
		xhr.onload = function () {
			if (xhr.status !== 200 && xhr.status !== 0) return
			if (xhr.responseText === lastLiveRaw) return
			lastLiveRaw = xhr.responseText
			try { applyFromData(JSON.parse(xhr.responseText)) } catch (e) { console.warn('pip_shadow live:', e) }
		}
		xhr.send(null)
	}

	function ensureLivePoll(file) {
		if (file) state.liveFile = String(file)
		if (!state.liveFile || livePollId) return
		livePollId = setInterval(pollLiveFile, 33)
		pollLiveFile()
	}

	window['update'] = function (raw) {
		try {
			var d = typeof raw === 'string' ? JSON.parse(raw.replace(/\\"/g, '"').replace(/^"|"$/g, '')) : raw
			if (d.liveFile) ensureLivePoll(d.liveFile)
			applyFromData(d)
		} catch (e) { console.warn('pip_shadow update:', e) }
	}

	render()
})()
</script>
</body>
</html>
