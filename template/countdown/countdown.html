<!DOCTYPE html>
<!-- countdown.html — Countdown / timer CG overlay (WO-169). Transparent, multi-instance safe:
     N look layers each get their own Caspar CG host layer (700-899 band, see
     src/engine/cg-routing.js resolveTemplateCgHostLayer), so N countdowns run independently. -->
<html>
<head>
    <meta charset="utf-8">
    <title>Countdown / Timer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent;
            height: 1080px; width: 1920px;
            overflow: hidden;
            position: relative;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
        }
        .countdown-root {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 48px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .countdown-root.countdown-pos-top-left      { align-items: flex-start; justify-content: flex-start; text-align: left; }
        .countdown-root.countdown-pos-top-middle    { align-items: center;     justify-content: flex-start; text-align: center; }
        .countdown-root.countdown-pos-top-right     { align-items: flex-end;   justify-content: flex-start; text-align: right; }
        .countdown-root.countdown-pos-bottom-left   { align-items: flex-start; justify-content: flex-end;   text-align: left; }
        .countdown-root.countdown-pos-bottom-middle { align-items: center;     justify-content: flex-end;   text-align: center; }
        .countdown-root.countdown-pos-bottom-right  { align-items: flex-end;   justify-content: flex-end;   text-align: right; }
        .countdown-root.countdown-pos-center        { align-items: center;     justify-content: center;     text-align: center; }

        .countdown-timer {
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-size: 15vw;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
            white-space: nowrap;
        }
        .countdown-aux {
            font-weight: 500;
            line-height: 1.25;
            font-size: 5vw;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
            white-space: pre-wrap;
        }
        .countdown-aux:empty { display: none; }
    </style>
</head>
<body>
    <div class="countdown-root countdown-pos-top-left">
        <div class="countdown-aux countdown-aux-top"></div>
        <div class="countdown-timer">00:00:00</div>
        <div class="countdown-aux countdown-aux-middle"></div>
        <div class="countdown-aux countdown-aux-bottom"></div>
    </div>
    <script src="countdown-engine.js"></script>
    <script>
        CountdownEngine.init({ containerSel: '.countdown-root' });
    </script>
</body>
</html>
