name: CI

on:
  push:
    branches: [main]
  pull_request:
  # WO-452: a GitHub incident left a push run as an un-rerunnable zombie; manual
  # dispatch is the only way to get CI on a commit whose push run is wedged.
  workflow_dispatch:

# A force-push or rapid follow-up commit obsoletes the older run — kill it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The box is an X machine — give tests a real (virtual) X server, xrandr, and the
      # python3 Xlib the shape-overlay behavioral harness needs, so those paths run for
      # real on CI instead of skipping.
      - name: X test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb x11-xserver-utils python3-xlib

      - name: Repo integrity
        run: npm run verify:repo-integrity

      # WO-836: package.json scripts, run.sh, systemd units and src/ spawn paths must point at files that exist
      # (it exited 1 and ran nowhere until now).
      - name: Script paths exist
        run: npm run verify:script-paths

      - name: File size limit (500 lines)
        run: node tools/ci/check-max-file-lines.js

      # WO-367: code written, reviewed and marked DONE but never wired to a caller has shipped
      # three times (6e53abe, 9d2f6dd, 185d200). Fails only on NEW orphan exports.
      - name: Unwired exports
        run: node tools/ci/check-unwired-exports.js

      - name: Boot check (no-http)
        run: node index.js --no-http

      - name: ESLint
        run: npm run lint

      - name: Prettier (CI-scoped)
        run: npm run format:check

      - name: Offline tests
        run: xvfb-run -a npm run test:ci

      - name: npm audit
        run: node tools/ci/npm-audit-ci.js

  # WO-593/594/599 — the Godot operator client + the shm frame transport. No GPU on the runner:
  # GDScript logic tests run headless; the GPU upload path is verified on the box (WO-595).
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: shm seqlock test (writer/reader, torn frames, laps, generation)
        run: |
          c++ -std=c++17 -O2 -pthread caspar/modules/shm/tests/hshm_seqlock_test.cpp -o /tmp/hshm_test
          /tmp/hshm_test

      - name: shm bridge → probe round-trip (pixel-level torn check)
        run: |
          python3 tools/hshm-bridge/hshm_bridge.py --name ci --duration 6 &
          sleep 1
          python3 tools/hshm-bridge/hshm_probe.py --name ci --duration 3 --check-pattern --json
          wait

      - name: Download pinned Godot (godot/GODOT_VERSION)
        run: |
          v="$(cat godot/GODOT_VERSION)"
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${v}-stable/Godot_v${v}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${v}-stable_linux.x86_64" /tmp/godot/godot

      - name: Godot client unit tests (headless)
        run: /tmp/godot/godot --headless --path godot/client --script res://tests/run_tests.gd

      - name: Godot client boot check (every UI script compiles, _ready runs)
        run: GODOT=/tmp/godot/godot godot/client/run-client.sh --check

  # dist-web/ is untracked — the served UI only exists if `vite build` succeeds, so a
  # contributor's client/ change must prove it still builds (and that every module the
  # bundle imports actually resolves).
  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Client build
        run: npm run build:client

      - name: Bundle exists and is non-trivial
        run: |
          test -f dist-web/index.html
          size=$(du -sk dist-web | cut -f1)
          echo "dist-web: ${size} KB"
          test "$size" -ge 100

  # WO-736 — every push to main that passes all three jobs above becomes a server prerelease, so a second server
  # updates from Settings → Updates (the updater picks the newest release carrying a highascg-server_*.tar.gz).
  # The tarball carries godot/client, which the box's kiosk runs. The desktop operator builds (export templates,
  # minutes of exporting) stay in the manual release (`npm run release:github-server`). Only the newest 10 automatic
  # prereleases are kept.
  release:
    needs: [verify, godot, build-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (shipped in the tarball)
        run: npm ci --include=optional

      - name: Client build
        run: npm run build:client

      - name: Server prerelease
        run: bash tools/release/make-github-release-server.sh --no-godot-clients

      - name: Keep the newest 10 automatic prereleases
        run: bash tools/release/prune-auto-releases.sh 10
