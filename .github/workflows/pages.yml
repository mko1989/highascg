name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # build:map = generate map-data.json (gitignored) + vite build the viewer —
      # the raw vite command alone shipped an empty map (WO-349).
      - name: Build and inject Project Map
        run: |
          npm ci
          npm run build:map
          sudo mkdir -p _site/map
          sudo cp -r dist-map/* _site/map/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
