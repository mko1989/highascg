<!doctype html>
<!-- WO-675 — presenter intake for the audio tech's phone: photo + name + mic + note, sent only with consent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter intake</title>
<style>
	:root { --bg: #0d1117; --fg: #e6edf3; --dim: #8b949e; --line: #30363d; --accent: #58a6ff; --ok: #3fb950; --bad: #f85149; }
	* { box-sizing: border-box; }
	body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
	h1 { font-size: 20px; margin: 0 0 12px; }
	label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 14px; }
	input[type=text], textarea { width: 100%; padding: 10px; font: inherit; color: var(--fg); background: #161b22; border: 1px solid var(--line); border-radius: 6px; }
	textarea { min-height: 64px; resize: vertical; }
	.photo { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 4; max-height: 50vh; margin-top: 4px; border: 1px dashed var(--line); border-radius: 6px; background: #161b22 center / contain no-repeat; color: var(--dim); cursor: pointer; }
	.photo.has { border-style: solid; color: transparent; }
	#file { display: none; }
	.consent { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; color: var(--fg); font-size: 15px; }
	.consent input { width: 22px; height: 22px; flex: none; margin: 0; }
	button { width: 100%; padding: 14px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; }
	button:disabled { opacity: 0.4; }
	#msg { min-height: 1.4em; margin-top: 12px; }
	#msg.ok { color: var(--ok); }
	#msg.bad { color: var(--bad); }
</style>
</head>
<body>
<h1>Presenter</h1>
<div id="show-timers"></div>
<form id="f">
	<label for="file">Photo (the whole person)</label>
	<div class="photo" id="shot" role="button" tabindex="0">Tap to take a photo</div>
	<input id="file" type="file" accept="image/*" capture="environment">
	<label for="name">Name</label>
	<input id="name" type="text" maxlength="64" autocomplete="off" required>
	<label for="mic">Mic number</label>
	<input id="mic" type="text" maxlength="16" inputmode="numeric" autocomplete="off">
	<label for="note">Note</label>
	<textarea id="note" maxlength="280"></textarea>
	<label class="consent"><input id="consent" type="checkbox"> The presenter agreed to this photo being used to recognise them for automation during the show. It is kept only in the box's temporary memory and is deleted when the server restarts or the box reboots.</label>
	<button id="send" type="submit" disabled>Send</button>
	<div id="msg"></div>
</form>
<script>
const $ = (id) => document.getElementById(id)
let photo = ''
const ready = () => { $('send').disabled = !(photo && $('name').value.trim() && $('consent').checked) }
$('shot').onclick = () => $('file').click()
$('shot').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') $('file').click() }
$('file').onchange = async () => {
	const f = $('file').files[0]
	if (!f) return
	try {
		const img = await createImageBitmap(f, { imageOrientation: 'from-image' })
		const k = Math.min(1, 1280 / Math.max(img.width, img.height))
		const c = document.createElement('canvas')
		c.width = Math.round(img.width * k)
		c.height = Math.round(img.height * k)
		c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
		photo = c.toDataURL('image/jpeg', 0.85)
		$('shot').style.backgroundImage = `url(${photo})`
		$('shot').classList.add('has')
	} catch (e) {
		photo = ''
		say('Could not read that photo: ' + e.message, false)
	}
	ready()
}
for (const id of ['name', 'consent']) $(id).addEventListener('input', ready)
$('consent').addEventListener('change', ready)
function say(text, ok) {
	$('msg').textContent = text
	$('msg').className = ok ? 'ok' : 'bad'
}
$('f').onsubmit = async (e) => {
	e.preventDefault()
	$('send').disabled = true
	say('Sending…', true)
	try {
		const r = await fetch('./', { method: 'POST', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ name: $('name').value, mic: $('mic').value, note: $('note').value, consent: $('consent').checked, photo }) })
		const j = await r.json().catch(() => ({}))
		if (!r.ok) throw new Error(j.error || r.status)
		say(`Sent: ${j.presenter.name}${j.presenter.mic ? ' (mic ' + j.presenter.mic + ')' : ''}. Ready for the next presenter.`, true)
		$('f').reset()
		photo = ''
		$('shot').style.backgroundImage = ''
		$('shot').classList.remove('has')
	} catch (err) {
		say('Not sent: ' + err.message, false)
	}
	ready()
}
</script>
<script src="/api/show-timers/widget.js"></script>
</body>
</html>
