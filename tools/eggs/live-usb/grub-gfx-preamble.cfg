# Gfx + modules required for splash.png and theme.cfg (paired with font.pf2 on the ISO).
if loadfont /boot/grub/font.pf2 ; then
	set gfxmode=1920x1080,1680x1050,1600x900,1366x768,1280x1024,1024x768,800x600,auto
	set gfxpayload=keep
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
else
	set gfxmode=1920x1080,1680x1050,1600x900,1366x768,1280x1024,1024x768,800x600,auto
	set gfxpayload=keep
	insmod all_video
fi
insmod gfxterm
insmod gfxmenu
insmod png
terminal_output gfxterm
