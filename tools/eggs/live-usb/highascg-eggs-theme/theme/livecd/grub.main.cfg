set theme=/boot/grub/theme.cfg
set timeout=10
set default=0
set timeout_style=countdown

# Default boot: plain Live (RAM overlay). Durable operator data on LABEL=HIGHASCGEXF (exFAT).
menuentry "{{{fullname}}} Live" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} quiet splash loglevel=2 nvidia-drm.modeset=1
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Safe Mode" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} nomodeset quiet splash loglevel=2
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Text Mode" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} quiet splash loglevel=2 systemd.unit=multi-user.target
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

if [ "$grub_platform" = "efi" ]; then
menuentry "Boot from local disk" {
	exit 1
}
fi
