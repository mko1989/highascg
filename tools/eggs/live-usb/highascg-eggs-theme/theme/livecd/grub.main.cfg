# Gfx + theme (font names in grub.theme.cfg must match font.pf2 — GNU Unifont on Ubuntu eggs host)
# gfxmode must match splash.boot.png (1920×1080) — auto centers wallpaper ~50% with black bars.
if loadfont /boot/grub/font.pf2 ; then
	set gfxmode=1920x1080
	set gfxpayload=keep
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
else
	set gfxmode=1920x1080
	set gfxpayload=keep
	insmod all_video
fi
insmod gfxterm
insmod gfxmenu
insmod png
terminal_output gfxterm
set theme=/boot/grub/theme.cfg
set timeout=3
set default=0
# menu = progress bar in theme.cfg; countdown = lone number in corner when gfx fails
set timeout_style=menu

# Default boot: plain Live (RAM overlay). Durable operator data on LABEL=HIGHASCGEXF (exFAT).
menuentry "{{{fullname}}} Live" {
    # text = drop graphics before kernel (avoids ~2s frozen centered splash / black letterbox)
    set gfxpayload=text
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} console=tty0 fbcon=nodefer nosplash loglevel=7 systemd.show_status=true nvidia-drm.modeset=1 nvidia-drm.fbdev=1
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Live (Plymouth splash)" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} splash systemd.show_status=true loglevel=4 nvidia-drm.modeset=1 nvidia-drm.fbdev=1
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Safe Mode" {
    set gfxpayload=auto
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} nomodeset quiet splash
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Text Mode" {
    set gfxpayload=auto
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} console=tty1 systemd.show_status=true systemd.unit=multi-user.target
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

if [ "$grub_platform" = "efi" ]; then
menuentry "Boot from local disk" {
	exit 1
}
fi
