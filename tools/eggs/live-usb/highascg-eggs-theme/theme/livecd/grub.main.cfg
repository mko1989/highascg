set theme=/boot/grub/theme.cfg
set timeout=10
set default=0
set timeout_style=countdown

# Default boot: persistence is on the kernel line (not a separate GRUB item to hunt for).
# Requires LABEL=persistence + persistence.conf "/ union" on the USB (finish-operator-stick.sh).
menuentry "{{{fullname}}} Live" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} persistence quiet splash loglevel=2 nvidia-drm.modeset=1
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Safe Mode" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} persistence nomodeset quiet splash loglevel=2
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

menuentry "{{{fullname}}} Text Mode" {
    set gfxpayload=keep
    {{{rmModules}}}
    linux {{{vmlinuz}}} {{{kernel_parameters}}} persistence quiet splash loglevel=2 systemd.unit=multi-user.target
    initrd {{{initrdImg}}}
    {{{devicetree}}}
}

if [ "$grub_platform" = "efi" ]; then
menuentry "Boot from local disk" {
	exit 1
}
fi
