# HighAsCG isolinux — plain Live (exFAT for durable config; no union persistence)
path
include isolinux.theme.cfg
default vesamenu.c32
prompt 0
timeout 30

label Live
  menu label {{{fullname}}} Live
  menu default
  say "Booting {{{fullname}}} GNU/Linux (kernel {{{kernel}}})"
  linux {{{vmlinuz}}}
  append initrd={{{initrdImg}}} {{{kernel_parameters}}} splash systemd.show_status=true loglevel=3 nvidia-drm.modeset=1 nvidia-drm.fbdev=1

label ServiceConsole
  menu label {{{fullname}}} Live (service console)
  say "Booting {{{fullname}}} GNU/Linux (service console)"
  linux {{{vmlinuz}}}
  append initrd={{{initrdImg}}} {{{kernel_parameters}}} console=tty1 nosplash systemd.show_status=true loglevel=4 nvidia-drm.modeset=1 nvidia-drm.fbdev=1

label Safe
  menu label {{{fullname}}} Safe Mode
  say "Booting {{{fullname}}} GNU/Linux (safe)"
  linux {{{vmlinuz}}}
  append initrd={{{initrdImg}}} {{{kernel_parameters}}} nomodeset console=tty1 fbcon=nodefer splash loglevel=4

label Text
  menu label {{{fullname}}} Text Mode
  say "Booting {{{fullname}}} GNU/Linux (text)"
  linux {{{vmlinuz}}}
  append initrd={{{initrdImg}}} {{{kernel_parameters}}} console=tty1 fbcon=nodefer splash loglevel=4 systemd.unit=multi-user.target

label local
  menu label Boot from local disk
  COM32 chain.c32
  APPEND hd0
  say "Booting from the first hard drive"
