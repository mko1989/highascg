# HighAsCG GRUB menu (paired with theme/livecd/splash.png)

title-color: "white"
title-text: "HighAsCG Live"
title-font: "GNU Unifont Regular 16"
desktop-color: "#0c1220"
desktop-image: "splash.png"
message-color: "white"
message-bg-color: "#0c1220"
terminal-font: "GNU Unifont Regular 16"

+ boot_menu {
  top = 28%
  left = 8%
  width = 84%
  height = 42%
  menu_bg_color = "18, 26, 42"
  selected_item_bg_color = "94, 179, 255"
  item_font = "GNU Unifont Regular 16"
  item_color = "#b8c4d8"
  selected_item_color = "#0c1220"
  item_height = 28
  item_padding = 12
  item_spacing = 6
  scrollbar = true
  scrollbar_frame_color = "50, 80, 120"
  scrollbar_thumb_color = "94, 179, 255"
}

+ vbox {
  top = 100%-60
  left = 10%
  + hbox {
    top = 0
    left = 20%
    + label {text = "Enter: " font = "GNU Unifont Regular 16" color = "white" align = "left"}
    + label {text = "Boot selected entry      " font = "GNU Unifont Regular 16" color = "white" align = "left"}
  }
  + hbox {
    top = 0
    left = 20%
    + label {text = "E:     " font = "GNU Unifont Regular 16" color = "white" align = "left"}
    + label {text = "Edit kernel options      " font = "GNU Unifont Regular 16" color = "white" align = "left"}
  }
}

+ progress_bar {
  id = "__timeout__"
  left = 15%
  top = 100%-18
  width = 70%
  height = 18
  bg_color = "30, 40, 55"
  fg_color = "94, 179, 255"
  border_color = "60, 90, 120"
  show_text = true
  font = "GNU Unifont Regular 16"
  text_color = "white"
  text = "@TIMEOUT_NOTIFICATION_LONG@"
}
