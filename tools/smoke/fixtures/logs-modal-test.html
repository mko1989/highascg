<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>logs-modal toggle harness</title>
	<link rel="stylesheet" href="/client/styles/08a-modals-logs.css" />
	<style>
		.modal-overlay { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); }
		.modal-content { background: #1a1a1a; color: #ddd; margin: 2rem auto; border-radius: 8px; border: 1px solid #444; }
		.modal-header { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #333; }
		.modal-close { background: none; border: none; color: #aaa; font-size: 1.25rem; cursor: pointer; }
		.btn { padding: 4px 10px; border: 1px solid #444; background: #333; color: #ddd; border-radius: 4px; cursor: pointer; }
		.btn--secondary { background: #2a2a2a; }
		.btn--primary { background: #238636; border-color: #238636; }
	</style>
</head>
<body>
	<script>
		window.fetch = async (url, opts) => {
			const u = String(url)
			if (u.includes('/api/logs')) {
				return {
					ok: true,
					headers: { get: (k) => (k === 'content-type' ? 'application/json' : null) },
					json: async () => ({
						schemaVersion: 1,
						highascg: ['[2026-06-28 12:00:00.000] (HACG) [info] harness line'],
						caspar: ['caspar harness line'],
						casparPath: '/tmp/caspar.log',
					}),
					text: async () => '',
				}
			}
			if (u.includes('/api/support/bundle')) {
				return {
					ok: true,
					headers: {
						get: (k) => {
							if (k === 'content-disposition') return 'attachment; filename="test-support.zip"'
							if (k === 'content-type') return 'application/zip'
							return null
						},
					},
					blob: async () => new Blob(['PK\x03\x04'], { type: 'application/zip' }),
				}
			}
			if (u.includes('/api/raw')) {
				return {
					ok: true,
					headers: { get: () => 'application/json' },
					json: async () => '200 OK',
					text: async () => '200 OK',
				}
			}
			return {
				ok: false,
				status: 404,
				statusText: 'not found',
				json: async () => ({}),
				text: async () => '',
			}
		}
		window.alert = () => {}
	</script>
	<script type="module">
		import { showLogsModal } from '/client/components/logs-modal.js'

		showLogsModal()
		window.__logsModalReady = true
	</script>
</body>
</html>
