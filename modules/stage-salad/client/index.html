<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#17201a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="format-detection" content="telephone=no" />
		<title>Stage Salad</title>
		<!-- WO-1089: the RC kit's base styles (unchanged, served from /game/salad/kit/) + the game's own. -->
		<link rel="stylesheet" href="/game/salad/kit/rc.css" />
		<link rel="stylesheet" href="/game/salad/kit/rc-ui.css" />
		<link rel="stylesheet" href="/game/salad/salad.css" />
		<link rel="stylesheet" href="/game/salad/salad-hud.css" />
		<link rel="stylesheet" href="/game/salad/kit/ctl-panel.css" />
		<!-- The only inline script: the import map (data, not code). Everything else is an external module. -->
		<script type="importmap">
			{
				"imports": {
					"three": "/vendor/three/build/three.module.js",
					"three/addons/": "/vendor/three/examples/jsm/"
				}
			}
		</script>
		<script type="module" src="/game/salad/main.js"></script>
	</head>
	<body>
		<canvas id="view" aria-label="Stage view" tabindex="0"></canvas>
		<div id="hud"></div>
		<div id="lobby" hidden></div>
		<div id="loading" hidden></div>
		<div id="host"></div>
		<div id="screen" hidden></div>
		<div id="rotate">
			<div class="panel screen-card">
				<div class="rotate-icon"></div>
				<h1>Turn your phone sideways</h1>
				<p>The slingshot is played in landscape.</p>
			</div>
		</div>
	</body>
</html>
