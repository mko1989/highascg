<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#151a26" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="format-detection" content="telephone=no" />
		<title>Stage Sprint RC</title>
		<link rel="stylesheet" href="/game/rc/rc.css" />
		<link rel="stylesheet" href="/game/rc/rc-ui.css" />
		<link rel="stylesheet" href="/game/rc/rc-touch.css" />
		<link rel="stylesheet" href="/game/rc/rc-hud.css" />
		<!-- The only inline script: the import map (data, not code). Everything else is an external module. -->
		<script type="importmap">
			{
				"imports": {
					"three": "/vendor/three/build/three.module.js",
					"three/addons/": "/vendor/three/examples/jsm/"
				}
			}
		</script>
		<script type="module" src="/game/rc/main.js"></script>
	</head>
	<body>
		<canvas id="view" aria-label="Race view"></canvas>
		<div id="hud"></div>
		<div id="touch" aria-hidden="true">
			<div id="stick" class="stick">
				<div class="stick-track"><div id="knob" class="knob"></div></div>
				<span class="stick-label">steer</span>
			</div>
			<div class="cluster">
				<div id="t-item" class="tbtn item"><span>item</span></div>
				<div id="t-drift" class="tbtn drift"><span>drift</span></div>
				<div id="t-brake" class="tbtn brake"><span>brake</span></div>
				<div id="t-gas" class="tbtn gas"><span>go</span></div>
			</div>
		</div>
		<div id="lobby" hidden></div>
		<div id="loading" hidden></div>
		<div id="host"></div>
		<div id="screen" hidden></div>
		<div id="rotate">
			<div class="panel screen-card">
				<div class="rotate-icon"></div>
				<h1>Turn your phone sideways</h1>
				<p>The race is played in landscape.</p>
			</div>
		</div>
	</body>
</html>
