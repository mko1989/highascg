# Opt-in API-only mode (debug / CI). NOT the production default.
#
# WO-52 production: client + server on same playout machine; dist-web/ served on :4200.
# Electron launcher is hub-only (setup, links) — does not host the control UI.
#
# Drop-in for /etc/systemd/system/highascg.service.d/10-headless.conf
[Service]
Environment=HIGHASCG_HEADLESS=true
Environment=HIGHASCG_NO_STARTUP_LED_TEST=1
