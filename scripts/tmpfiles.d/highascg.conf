# WO-455: GUI update cache — installed systems ship without /var/cache/highascg
# (eggs excludes var/cache/*), so the node process (user casparcg) hit EACCES on
# its first GUI update. systemd-tmpfiles recreates the tree every boot.
# Install on a host: sudo install -m 0644 scripts/tmpfiles.d/highascg.conf /etc/tmpfiles.d/highascg.conf
# (then it rides every eggs ISO via the cloned /etc).
d /var/cache/highascg 0755 root root -
d /var/cache/highascg/updates 0755 casparcg casparcg -
d /var/cache/highascg/update-staging 0755 root root -
