# HighAsCG operator UI — port 80 → playout server on :4200 (API + dist-web + WebSocket).
# Installed by scripts/runtime/install-highascg-web-proxy.sh

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	# Media ingest uploads pass through this proxy — the node server enforces its own
	# 200 GB cap (routes-ingest readMaxUploadBytes), so nginx must not impose a smaller one.
	# 512m here rejected show mp4s with an HTML 413 page the GUI can't parse (WO-402).
	client_max_body_size 0;

	location / {
		# Stream request bodies straight to the node server (busboy) instead of
		# spooling multi-GB uploads to /var/lib/nginx on the root disk first.
		proxy_request_buffering off;
		proxy_pass http://127.0.0.1:4200;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 86400;
	}
}
