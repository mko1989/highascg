<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HighAsCG — Project Map</title>
  <meta name="description" content="Interactive architecture map of the HighAsCG playout stack">
  <link rel="stylesheet" href="styles/map-explorer.css">
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="map-root">
    <header id="map-header">
      <a href="/" class="map-logo" title="Back to HighAsCG">← HighAsCG</a>
      <nav id="map-breadcrumb" aria-label="Navigation breadcrumb"></nav>
      <span id="map-header-stats" class="map-header__stats" style="font-size: 12px; color: var(--map-text-muted); display: flex; gap: 6px;"></span>
      <div id="map-header-actions">
        <div class="map-toolbar__controls">
          <label class="map-toggle">
            <input type="checkbox" id="map-toggle-edges" checked>
            <span class="map-toggle__label">Show dependencies</span>
          </label>
          <label class="map-toggle">
            <input type="checkbox" id="map-toggle-cross-module">
            <span class="map-toggle__label">Cross-module edges</span>
          </label>
        </div>

        <button id="map-search-trigger" title="Search (Ctrl+K)">🔍 Search</button>
      </div>
    </header>
    <main id="map-viewport">
      <div id="map-grid" role="tree" aria-label="Project architecture map"></div>
      <svg id="map-edges" class="map-edges" aria-hidden="true">
        <defs>
          <marker id="map-arrowhead" viewBox="0 0 10 7" refX="9" refY="3.5"
                  markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
          </marker>
        </defs>
      </svg>
    </main>
    
    <div id="map-minimap" class="map-minimap map-minimap--hidden"></div>
    
    <div class="map-zoom-controls">
      <button class="map-zoom-btn" id="map-zoom-in" title="Zoom in">+</button>
      <button class="map-zoom-btn" id="map-zoom-reset" title="Reset zoom">⟳</button>
      <button class="map-zoom-btn" id="map-zoom-out" title="Zoom out">−</button>
      <span class="map-zoom-level" id="map-zoom-level">100%</span>
    </div>
    
    <aside id="map-sidebar" class="map-sidebar--collapsed" aria-label="Node details">
        <!-- Sidebar content goes here -->
    </aside>
    <div id="map-loading" class="map-loading">
      <div class="map-loading__spinner"></div>
      <p>Loading project map…</p>
    </div>

    <dialog id="map-search-overlay" class="map-search">
      <div class="map-search__container">
        <div class="map-search__input-row">
          <span class="map-search__icon">🔍</span>
          <input id="map-search-input" type="text" placeholder="Search nodes, files, functions, routes…"
                 autocomplete="off" spellcheck="false" autofocus>
          <kbd class="map-search__shortcut">Esc</kbd>
        </div>
        <div id="map-search-results" class="map-search__results" role="listbox">
          <!-- search results rendered here -->
        </div>
        <footer class="map-search__footer">
          <span><kbd>↑↓</kbd> Navigate</span>
          <span><kbd>Enter</kbd> Go to node</span>
          <span><kbd>Esc</kbd> Close</span>
        </footer>
      </div>
    </dialog>
  </div>
  <script type="module" src="components/map-explorer.js"></script>
</body>
</html>
